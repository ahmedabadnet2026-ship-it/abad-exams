the R2 and login to R2."};
window.LAB={key:"abad-ccna-dhcp-telnet-ssh-v1",title:"DHCP, Telnet & SSH",lead:["هيّئ خادم DHCP على الراوترات ليحصل كل PC على عنوانه تلقائياً، ثم فعّل الدخول عن بُعد بـ Telnet ثم SSH ببيانات مستخدمين محلية. ابنِ الشبكة كما في المخطط، واضغط على أي جهاز لفتح سطر الأوامر، ثم اضغط «تحقق».", "Configure the routers as DHCP servers so each PC gets its address automatically, then enable remote access with Telnet and then SSH using local users. Build the network from the diagram, click any device to open its CLI, then press “Check”."],tasks:function(A){var L=A.lang,ar=function(){return L()=="ar"},st=A.st,B=A.BASE,R=A.R;

 if(!p)return"ip dhcp pool ccna1";if(p.net!=lan+".0"||p.mask!="255.255.255.0")return"network "+lan+".0 255.255.255.0";if(p.gw!=lan+".1")return"default-router "+lan+".1";if(p.dns!="8.8.8.8")return"dns-server 8.8.8.8";if(!d.saved)return"copy running-config startup-config";return true}
