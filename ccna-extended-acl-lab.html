<script>
var H={"r1": ">> Assign IP addresses on R1 & R2 interfaces\n   And configure Routing\nR1\nenable\nconfig t\nhostname R1\ninterface g0/0\n ip address 192.168.1.1  255.255.255.0\n no shutdown\n exit\ninterface g0/1\n ip address 12.0.0.1  255.255.255.252\n no shutdown\n exit\nip route 192.168.2.0  255.255.255.0  12.0.0.2\nusername admin1  password ccna123\nenable secret ccna123\nline vty 0\ntransport input all\nend\nwr", "r2": "R2\nenable\nconfig t\nhostname R2\ninterface g0/0\n ip address 192.168.2.1  255.255.255.0\n no shutdown\n exit\ninterface g0/1\n ip address 12.0.0.2  255.255.255.252\n no shutdown\n exit\nip route 192.168.1.0  255.255.255.0  12.0.0.1\nusername admin2  password ccna123\nenable secret ccna123\nip domain-name ccna.com\ncrypto key generate rsa modulus 1024\nline vty 0\ntransport input all\nend\nwr", "x1": ">> TASK on R1\n>> Configure Numbered Extended ACL as per below\n   Given conditions:\n>> PC1 can SSH R2 IP 12.0.0.2, but cannot Ping to R2 IP\n>> Remaining all users in R1 LAN can access any Service\n   Of any users of R2 LAN\nR1\nenable\nconf t\naccess-list 101 permit tcp host 192.168.1.10  host 12.0.0.2  eq 22\naccess-list 101 deny icmp host 192.168.1.10  host 12.0.0.2\naccess-list 101 permit ip any any\ninterface g0/1\n ip access-group 101 out\n end", "x2": ">> TASK on R2\n>> Configure Numbered Extended ACL as per below\n   Given conditions:\n>> PC2 can Telnet R1 IP 12.0.0.1, but cannot Ping to R1 IP\n>> Remaining all users in R2 LAN can access any Service\n   Of any users of R1 LAN\nR1\nenable\nconf t\naccess-list 101 permit tcp host 192.168.2.20  host 12.0.0.1  eq 23\naccess-list 101 deny icmp host 192.168.2.20  host 12.0.0.1\naccess-list 101 permit ip any any\ninterface g0/1\n ip access-group 101 out\n end"};
window.LAB={key:"abad-ccna-extended-acl-v1",title:"Extended ACL",lead:["قوائم التحكم بالوصول الموسعة: اسمح بـ SSH و Telnet إلى الراوترات وامنع الـ ping إليها لمضيف محدد، مع السماح بباقي الحركة — بمطابقة البروتوكول والمنفذ.", "Extended access lists: allow SSH/Telnet to the routers but block ping to them for a specific host while allowing all other traffic — matching protocol and port."],tasks:function(A){var L=A.lang,st=A.st,B=A.BASE,R=A.R;function prt(a,e){return L()=="ar"?a:e}
var X1=["permit tcp host 192.168.1.10 host 12.0.0.2 eq 22","deny icmp host 192.168.1.10 host 12.0.0.2","permit ip any any"],X2=["permit tcp host 192.168.2.20 host 12.0.0.1 eq 23","deny icmp host 192.168.2.20 host 12.0.0.1","permit ip any any"];
function on(sn,id,l){return A.aclIs(sn[id],"101",l)&&A.agIs(sn[id],"g0/1","out","101")}
function u(id,n){var s=R(id)&&R(id).sec;return!!(s&&s.users[n]&&s.users[n].pw=="ccna123")}
function lg(pc,to,proto,f){return A.evFind(function(e){return e.t=="login"&&e.ok&&e.from==pc&&e.to==to&&e.proto==proto&&(!f||f(e))})}
function pg(pc,dst,ok,f){return A.evFind(function(e){return e.t=="ping"&&e.from==pc&&e.dst==dst&&!!e.ok==ok&&(!f||f(e))})}
function cfgOn(id,l){return on(A.snap(),id,l)}
return B.slice(0,4).concat([
{ar:"على R1: العناوين، مسار ثابت إلى <code>192.168.2.0/24</code>، المستخدم <code>admin1</code>، <code>enable secret</code> و <code>transport input all</code>",en:"On R1: addresses, static route to <code>192.168.2.0/24</code>, user <code>admin1</code>, <code>enable secret</code>, <code>transport input all</code>",h:H.r1,
 c:function(){var r=B[4].c();if(r!==true)return r;if(!A.hasRoute("R1","192.168.2.0","255.255.255.0","12.0.0.2"))return"ip route 192.168.2.0 255.255.255.0 12.0.0.2";if(!u("R1","admin1"))return"username admin1 password ccna123";var s=R("R1").sec;if(s.secret!="ccna123")return"enable secret ccna123";if(s.vty.tr!="all")return"transport input all";if(!R("R1").saved)return"wr";return true}},
{ar:"على R2: العناوين، مسار ثابت إلى <code>192.168.1.0/24</code>، المستخدم <code>admin2</code>، <code>enable secret</code>، <code>ip domain-name ccna.com</code>، مفاتيح RSA <code>1024</code> و <code>transport input all</code>",en:"On R2: addresses, static route to <code>192.168.1.0/24</code>, user <code>admin2</code>, <code>enable secret</code>, <code>ip domain-name ccna.com</code>, <code>1024</code>-bit RSA keys, <code>transport input all</code>",h:H.r2,
 c:function(){var r=B[5].c();if(r!==true)return r;if(!A.hasRoute("R2","192.168.1.0","255.255.255.0","12.0.0.1"))return"ip route 192.168.1.0 255.255.255.0 12.0.0.1";if(!u("R2","admin2"))return"username admin2 password ccna123";var s=R("R2").sec;if(s.secret!="ccna123")return"enable secret ccna123";if(s.domain!="ccna.com")return"ip domain-name ccna.com";if(s.rsa!=1024)return"crypto key generate rsa modulus 1024";if(s.vty.tr!="all")return"transport input all";if(!R("R2").saved)return"wr";return true}},
B[7],B[8],
{ar:"من PC1 ادخل بـ SSH إلى R2، ومن PC2 ادخل بـ Telnet إلى R1",en:"From PC1 SSH to R2, and from PC2 Telnet to R1",h:"PC1> ssh -l admin2 12.0.0.2      (Password: ccna123)\nPC2> telnet 12.0.0.1             (Username: admin1 / Password: ccna123)",
 c:function(){if(!lg("PC1","R2","ssh"))return prt("لم يتم الدخول بـ SSH من PC1 إلى R2","no SSH login PC1 → R2");if(!lg("PC2","R1","telnet"))return prt("لم يتم الدخول بـ Telnet من PC2 إلى R1","no Telnet login PC2 → R1");return true}},
{ar:"ACL موسعة رقم <code>101</code> على R1: اسمح لـ PC1 بـ SSH إلى <code>12.0.0.2</code>، امنع ping منه إلى <code>12.0.0.2</code>، واسمح بالباقي — طبّقها على <code>Gi0/1 out</code>",en:"Extended ACL <code>101</code> on R1: permit PC1 SSH to <code>12.0.0.2</code>, deny its ping to <code>12.0.0.2</code>, permit everything else — apply on <code>Gi0/1 out</code>",h:H.x1,c:function(){return cfgOn("R1",X1)||prt("ACL 101 على R1 غير مطابقة أو غير مطبقة على Gi0/1 out","ACL 101 on R1 doesn't match or isn't applied on Gi0/1 out")}},
{ar:"تحقق على R1: من PC1 ينجح SSH إلى <code>12.0.0.2</code>، يفشل ping إلى <code>12.0.0.2</code>، وينجح ping إلى PC2، ثم <code>sh access-list</code>",en:"Verify on R1: from PC1 SSH to <code>12.0.0.2</code> works, ping <code>12.0.0.2</code> fails, ping PC2 works, then <code>sh access-list</code>",h:"PC1> ssh -l admin2 12.0.0.2\nPC1> ping 12.0.0.2\nPC1> ping 192.168.2.20\nR1#sh access-list",
 c:function(){var f=function(e){return on(e.snap,"R1",X1)};if(!lg("PC1","R2","ssh",f))return"PC1> ssh -l admin2 12.0.0.2";if(!pg("PC1","12.0.0.2",false,f))return prt("ping من PC1 إلى 12.0.0.2 يجب أن يفشل","PC1 ping to 12.0.0.2 must fail");if(!pg("PC1","192.168.2.20",true,f))return"PC1> ping 192.168.2.20";
  if(!A.evFind(function(e){return e.t=="show"&&e.dev=="R1"&&f(e)}))return"R1#sh access-list";return true}},
{ar:"ACL موسعة رقم <code>101</code> على R2: اسمح لـ PC2 بـ Telnet إلى <code>12.0.0.1</code>، امنع ping منه إلى <code>12.0.0.1</code>، واسمح بالباقي — طبّقها على <code>Gi0/1 out</code> <small>(الملف يكتب R1 كعنوان للقسم، لكن المهمة على R2)</small>",en:"Extended ACL <code>101</code> on R2: permit PC2 Telnet to <code>12.0.0.1</code>, deny its ping to <code>12.0.0.1</code>, permit everything else — apply on <code>Gi0/1 out</code> <small>(the file labels this block R1, but the task is on R2)</small>",h:H.x2,c:function(){return cfgOn("R2",X2)||prt("ACL 101 على R2 غير مطابقة أو غير مطبقة على Gi0/1 out","ACL 101 on R2 doesn't match or isn't applied on Gi0/1 out")}},
{ar:"تحقق على R2: من PC2 ينجح Telnet إلى <code>12.0.0.1</code>، يفشل ping إلى <code>12.0.0.1</code>، وينجح ping إلى PC1، ثم <code>sh access-list</code>",en:"Verify on R2: from PC2 Telnet to <code>12.0.0.1</code> works, ping <code>12.0.0.1</code> fails, ping PC1 works, then <code>sh access-list</code>",h:"PC2> telnet 12.0.0.1\nPC2> ping 12.0.0.1\nPC2> ping 192.168.1.10\nR2#sh access-list",
 c:function(){var f=function(e){return on(e.snap,"R2",X2)};if(!lg("PC2","R1","telnet",f))return"PC2> telnet 12.0.0.1";if(!pg("PC2","12.0.0.1",false,f))return prt("ping من PC2 إلى 12.0.0.1 يجب أن يفشل","PC2 ping to 12.0.0.1 must fail");if(!pg("PC2","192.168.1.10",true,f))return"PC2> ping 192.168.1.10";
  if(!A.evFind(function(e){return e.t=="show"&&e.dev=="R2"&&f(e)}))return"R2#sh access-list";return true}}
])}};
