<script>
/* Live data from the platform API when available (Cloudways); static "coming soon" cards stay on GitHub Pages. */
addEventListener("DOMContentLoaded",function(){if(!window.ABAD_API)return;
  var EN=window.LANG==="en";function T(a,e){return EN?e:a}
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  ABAD_API.me().then(function(s){if(!s)return;var g=document.querySelector("main.grid");
    if(!s.user){var c=el("section","crs");c.append(el("h2","",T("سجّل الدخول لعرض دوراتك","Sign in to see your courses")),el("p","",T("أنشئ حساباً أو سجّل الدخول لمتابعة دوراتك المسجّلة ونتائج اختباراتك التجريبية.","Create an account or sign in to follow your enrolled courses and practice-exam results.")));
      var a=el("a","cta",T("تسجيل الدخول / حساب جديد","Sign in / Create account"));a.href="login.html?next=my-courses.html";c.append(a);g.prepend(c);return}
    ABAD_API.req("courses.php").then(function(j){if(!j.ok)return;if(!j.items.length){var c=el("section","crs");c.append(el("h2","",T("لا توجد دورات مسجّلة بعد","No enrolled courses yet")),el("p","",T("ستظهر دوراتك هنا بعد تأكيد التسجيل من المعهد.","Your courses will appear here once the institute confirms your enrollment.")));g.prepend(c);return}
      g.innerHTML="";j.items.forEach(function(x){var c=el("section","crs");var t=EN?(x.title_en||x.title_ar):x.title_ar;c.append(el("h2","",t));
        var m=el("div","meta");m.append(el("span","pill",x.delivery==="online"?T("أونلاين","Online"):T("حضوري","On-site")),el("span","pill",{active:T("نشط","Active"),completed:T("مكتمل","Completed")}[x.enrollment_status]||x.enrollment_status));
        if(x.start_date)m.append(el("span","",(x.start_date||"")+(x.end_date?" → "+x.end_date:"")));c.append(m);
        var d=EN?(x.description_en||x.description_ar):x.description_ar;if(d)c.append(el("p","",d));
        if(x.link_url&&/^(https:\/\/|[a-z0-9][a-z0-9._\/-]*\.html)/i.test(x.link_url)){var a=el("a","cta",T("فتح الدورة","Open course"));a.href=x.link_url;c.append(a)}g.append(c)})});
    ABAD_API.req("results.php").then(function(j){if(!j.ok||!j.items.length)return;var r=document.getElementById("myres");r.hidden=false;r.append(el("h2","",T("نتائج اختباراتي التجريبية","My practice-exam results")));
      var tb=el("table"),h=el("tr");[T("التاريخ","Date"),T("الاختبار","Exam"),T("الدرجة","Score"),T("النسبة","Percent")].forEach(function(x){h.append(el("th","",x))});tb.append(h);
      j.items.slice(0,30).forEach(function(x){var tr=el("tr");[String(x.created_at).slice(0,16),x.exam_id,x.score+" / "+x.total,x.percent+"%"].forEach(function(v){var td=el("td","",v);td.dir="ltr";tr.append(td)});tb.append(tr)});r.append(tb)})})});
</script>
