ion"}, {"k": "C", "t": "Group Policy Editor"}, {"k": "D", "t": "Task Manager"}], "ans": ["D"], "exp": "Task Manager in Windows allows administrators to view the number of active user sessions connected through Remote Desktop Services under the \"Users\" tab.", "src": "PDF"}, {"n": 106, "stem": ["Which of the following is used to implement PoE?"], "opts": [{"k": "A", "t": "Modem"}, {"k": "B", "t": "Range extender"}, {"k": "C", "t": "Media converter"}, {"k": "D", "t": "Injector"}], "ans": ["D"], "exp": "A PoE injector adds electrical power to an Ethernet cable, enabling devices like access points or IP cameras to receive both power and data through a single cable.", "src": "PDF"}, {"n": 107, "stem": ["A Windows user is having trouble accessing a fileshare. The technician would like to confirm the username that the machine is currently logged in to. Which of the following should the technician use?"], "opts": [{"k": "A", "t": "net user"}, {"k": "B", "t": "tracert"}, {"k": "C", "t": "whoami"}, {"k": "D", "t": "hostname"}], "ans": ["C"], "exp": "The whoami command displays the username of the currently logged-in user in Windows.", "src": "PDF"}, {"n": 108, "stem": ["A user reports that the time on their computer does not match the time on their VoIP phone. Which of the following should a technician do to fix the time difference?"], "opts": [{"k": "A", "t": "Confirm the user is logging in to the domain"}, {"k": "B", "t": "Manually set the time on the phone to match the computer"}, {"k": "C", "t": "Download and install the latest BIOS update"}, {"k": "D", "t": "Configure access to an available NTP server"}], "ans": ["D"], "exp": "Configuring access to an available Network Time Protocol server ensures both the computer and the VoIP phone synchronize their clocks to the same authoritative time source, resolving time discrepancies automatically.", "src": "PDF"}, {"n": 109, "stem": ["A technician is troubleshooting a print spooler that fails to start on a Windows 11 desktop computer. The technician determines the root cause is that required dependencies are failing to run. Which of the following tools is the technician using?"], "opts": [{"k": "A", "t": "Process"}, {"k": "B", "t": "Services"}, {"k": "C", "t": "Startup"}, {"k": "D", "t": "Performance"}], "ans": ["B"], "exp": "The Services tool in Windows allows a technician to view service dependencies and status. If the print spooler can't start due to a dependency, Services is the correct tool to inspect and manage them.", "src": "PDF"}, {"n": 110, "stem": ["A client reports that their browser's home page changed. Every time they run an internet search, the results returned are from unfamiliar websites. Which of the following actions should a technician take first to resolve the issue? (Choose two.)"], "opts": [{"k": "A", "t": "Clear the browsing history"}, {"k": "B", "t": "Run operating system updates"}, {"k": "C", "t": "Check the system date and time"}, {"k": "D", "t": "Uninstall malicious extensions"}, {"k": "E", "t": "Reset browser startup page"}, {"k": "F", "t": "Restart the user's machine"}], "ans": ["D", "E"], "exp": "Uninstalling malicious extensions can remove unwanted changes and stop further hijacking behavior. Resetting the browser startup page restores the original home page and removes unwanted redirects.", "src": "PDF"}, {"n": 111, "stem": ["Which of the following should a technician consider when adding ten new high-end graphic design and animation desktops at a client site?"], "opts": [{"k": "A", "t": "The local area's temperature"}, {"k": "B", "t": "The proper ventilation for hazardous fumes"}, {"k": "C", "t": "The interior office space's humidity levels"}, {"k": "D", "t": "The electrical circuit's power consumption"}], "ans": ["D"], "exp": "High-end graphic design desktops draw significant power, so the technician must ensure the electrical circuit can support the increased power consumption to prevent overloads and outages.", "src": "PDF"}, {"n": 112, "stem": ["Which of the following describes a virtualization concept that improves resource utilization by allowing multiple operating systems to run on a single physical server?"], "opts": [{"k": "A", "t": "Containerization"}, {"k": "B", "t": "Virtual machine"}, {"k": "C", "t": "Hypervisor"}, {"k": "D", "t": "Microservices architecture"}], "ans": ["B"], "exp": "A virtual machine allows multiple operating systems to run independently on a single physical server by virtualizing hardware resources, improving overall resource utilization.", "src": "PDF"}, {"n": 113, "stem": ["A user hears an unexpected noise coming from their desktop computer. To troubleshoot the issue, a technician needs to open the case. Which of the following actions should the technician take next?"], "opts": [{"k": "A", "t": "Open the system cover."}, {"k": "B", "t": "Ground the system."}, {"k": "C", "t": "Disconnect the power."}, {"k": "D", "t": "Remove any peripheral devices."}], "ans": ["C"], "exp": "The technician should disconnect the power before opening the computer case to ensure safety and prevent electrical shock or component damage.", "src": "PDF"}, {"n": 114, "stem": ["Due to recent security issues, the finance department requires a shorter screensaver timeout. Which of the following should a technician use to accomplish this task?"], "opts": [{"k": "A", "t": "gpedit.msc"}, {"k": "B", "t": "certmgr.msc"}, {"k": "C", "t": "devmgmt.msc"}, {"k": "D", "t": "perfmon.msc"}], "ans": ["A"], "exp": "gpedit.msc opens the Local Group Policy Editor, which allows a technician to configure securityrelated settings such as screen saver timeout and password protection policies to enforce shorter inactivity lock times.", "src": "PDF"}, {"n": 115, "stem": ["While working from home, the Chief Financial Officer (CFO) needs to open reports from accounting software. When the application opens, the CFO sees the error Unable to connect to database. Which of the following should the CFO do first?"], "opts": [{"k": "A", "t": "Confirm the application is up to date"}, {"k": "B", "t": "Return to the office"}, {"k": "C", "t": "Restart the PC"}, {"k": "D", "t": "Verify the VPN status"}], "ans": ["D"], "exp": "Verifying the VPN status is the first step because remote access to internal accounting databases typically requires an active VPN connection to reach internal network resources.", "src": "PDF"}, {"n": 116, "stem": ["A technician is working on a complex, large-scale software deployment. In which of the following places would the technician most likely reference deployment instructions?"], "opts": [{"k": "A", "t": "File server"}, {"k": "B", "t": "User's desktop"}, {"k": "C", "t": "Email"}, {"k": "D", "t": "Internal wiki"}], "ans": ["D"], "exp": "An internal wiki is the most likely place to store deployment instructions because it provides centralized, documented, and easily accessible technical procedures for large-scale or complex tasks.", "src": "PDF"}, {"n": 117, "stem": ["A user is renaming a .txt file to a .xml file. After renaming the file. Windows Explorer shows the filename as Document.xml. However, the document properties shows the type of file as: Text Document(.txt). Which of the following controls enables the user to correctly change the file type?"], "opts": [{"k": "A", "t": "Indexing options"}, {"k": "B", "t": "Format command"}, {"k": "C", "t": "Personalization"}, {"k": "D", "t": "Hide extensions"}], "ans": ["D"], "exp": "The \"Hide extensions\" control determines whether file extensions are visible in Windows Explorer. Disabling it allows users to change the file extension and, thus, the file type correctly.", "src": "PDF"}, {"n": 118, "stem": ["A systems administrator logs in to a developer's machine to update the system and notices a performance issue. To troubleshoot the issue, the administrator attempts to open Task Manager multiple times, but it does not open. Which of the following is most likely the cause of this issue?"], "opts": [{"k": "A", "t": "A software development application is running"}, {"k": "B", "t": "Windows Update Service is set to manual"}, {"k": "C", "t": "The operating system has a malware infection"}, {"k": "D", "t": "A page file was moved to D:\\ drive"}], "ans": ["C"], "exp": "Malware commonly disables system utilities such as Task Manager to prevent detection and termination of malicious processes, which explains why Task Manager fails to open despite multiple attempts.", "src": "PDF"}, {"n": 119, "stem": ["A user needs to install and uninstall software on their Windows laptop but does not need to manage user accounts. The company follows least-privilege principles. Which of the following account types meets these requirements?"], "opts": [{"k": "A", "t": "Guest"}, {"k": "B", "t": "Power user"}, {"k": "C", "t": "Service"}, {"k": "D", "t": "Administrator"}], "ans": ["B"], "exp": "A Power User account allows installing and uninstalling software but does not grant full administrative control, aligning with the principle of least privilege.", "src": "PDF"}, {"n": 120, "stem": ["A user is seeing authentication errors in applications and certificate errors when browsing. A technician verifies the following: - The gateway is reachable. - The local server fileshares are accessible without issue. Which of the following is the issue?"], "opts": [{"k": "A", "t": "The device is experiencing time drift."}, {"k": "B", "t": "Another PC on the network is assigned a duplicate IP address."}, {"k": "C", "t": "The firmware on the computer needs to be updated."}, {"k": "D", "t": "The DHCP server has the IP listed as a bad address."}], "ans": ["A"], "exp": "Time drift causes discrepancies between the system clock and trusted servers, leading to authentication failures and certificate validation errors because certificates rely on accurate system time to verify validity periods.", "src": "PDF"}, {"n": 121, "stem": ["A user's machine is infected with malware that the user's existing security software did not detect. Which of the following best explains the reason the infection was undetected?"], "opts": [{"k": "A", "t": "Folder permissions"}, {"k": "B", "t": "Outdated definitions"}, {"k": "C", "t": "Port security not enabled"}, {"k": "D", "t": "User account permissions"}], "ans": ["B"], "exp": "Outdated malware definitions prevent security software from recognizing newly developed or updated threats, allowing the infection to go undetected.", "src": "PDF"}, {"n": 122, "stem": ["A user's laptop keyboard is distorted and is no longer flat. Which of the following components most likely tailed?"], "opts": [{"k": "A", "t": "Battery"}, {"k": "B", "t": "RAM"}, {"k": "C", "t": "Keyboard"}, {"k": "D", "t": "HDD"}], "ans": ["A"], "exp": "A distorted or bulging keyboard is commonly caused by a swollen battery underneath it, which expands and pushes against the keyboard, deforming its shape.", "src": "PDF"}, {"n": 123, "stem": ["A help desk technician recently installed an SSH client on a workstation in order to access remote servers. What does this enable?"], "opts": [{"k": "A", "t": "To utilize an SSO connection"}, {"k": "B", "t": "To securely establish a console session"}, {"k": "C", "t": "To encrypt and decrypt protected messages"}, {"k": "D", "t": "To facilitate device log reviews"}], "ans": ["B"], "exp": "SSH (Secure Shell) allows encrypted console sessions to access and administer remote servers.", "src": "PDF"}, {"n": 124, "stem": ["A technician has been experimenting with different third-party tools on a laptop and wants to restore the device to its original factory settings. Which of the following procedures will best restore the laptop?"], "opts": [{"k": "A", "t": "Copy all the registry entries from another company laptop."}, {"k": "B", "t": "Use the OS vendor's media creation tool to create installation media."}, {"k": "C", "t": "Perform sfc /scannowto replace the files changed by third-party software."}, {"k": "D", "t": "Start to the Preboot Execution Environment and download setup files."}], "ans": ["B"], "exp": "Using the OS vendor's media creation tool allows the technician to reinstall the operating system cleanly, restoring the laptop to its original factory state and removing any third-party modifications.", "src": "PDF"}, {"n": 125, "stem": ["Which of the following file types allows macOS users to uninstall software completely by placing the file in the trash?"], "opts": [{"k": "A", "t": ".app"}, {"k": "B", "t": ".msi"}, {"k": "C", "t": ".exe"}, {"k": "D", "t": ".rpm"}, {"k": "E", "t": ".pkg"}], "ans": ["A"], "exp": "In macOS, applications packaged as .app bundles can typically be uninstalled by dragging them to the Trash. The application and its associated executable components are contained within the bundle, allowing removal through simple deletion.", "src": "PDF"}, {"n": 126, "stem": ["A user is trying to install 3-D rendering software on a new Windows computer, but the installation fails. An error states that the system does not meet the minimum hardware configuration. Which of the following features should the user check first?"], "opts": [{"k": "A", "t": "USB speed"}, {"k": "B", "t": "GPU requirements"}, {"k": "C", "t": "NIC bandwidth"}, {"k": "D", "t": "PSU wattage"}], "ans": ["B"], "exp": "3-D rendering software relies heavily on graphics processing, so verifying that the GPU meets the software's minimum requirements is the primary step.", "src": "PDF"}, {"n": 127, "stem": ["Which of the following file types is best for performing automated tasks on startup on a Windows computer?"], "opts": [{"k": "A", "t": "SH"}, {"k": "B", "t": "MSI"}, {"k": "C", "t": "BAT"}, {"k": "D", "t": "EXE"}], "ans": ["C"], "exp": "A .bat file is a batch script used in Windows to execute a series of commands automatically. It is commonly used for automated tasks at startup by placing the script in the Startup folder or configuring it through Task Scheduler.", "src": "PDF"}, {"n": 128, "stem": ["An IT technician is attempting to install a video-rendering application for a client when the installation program halts. The technician sees an error message about the system not meeting the VRAM requirement. The system has a popular, integrated video solution and twice the required DRAM. Which of the following should the technician access to meet the VRAM requirement?"], "opts": [{"k": "A", "t": "Device Manager"}, {"k": "B", "t": "Virtual RAM"}, {"k": "C", "t": "BIOS options"}, {"k": "D", "t": "System Configuration"}], "ans": ["C"], "exp": "Integrated video solutions use system memory as shared video memory, and the amount allocated to VRAM is configured in the BIOS. Adjusting BIOS options allows the technician to increase the VRAM allocation to meet the application's requirements.", "src": "PDF"}, {"n": 129, "stem": ["A technician is assigned to offboard a user. Which of the following are common tasks on an offboarding checklist? (Choose two.)"], "opts": [{"k": "A", "t": "Quarantine the hard drive in the user's laptop."}, {"k": "B", "t": "Deactivate the user's key fobs for door access."}, {"k": "C", "t": "Purge all Pll associated with the user."}, {"k": "D", "t": "Suspend the user's email account."}, {"k": "E", "t": "Turn off the network ports underneath the user's desk."}, {"k": "F", "t": "Add the MAC address of the user's computer to a blocklist."}], "ans": ["B", "D"], "exp": "Key fobs (or badges) grant physical access to offices, server rooms, or secure areas. Disabling them prevents the former employee from entering the premises once their employment ends. Suspend the user's email account Email is often the gateway to corporate resources (password resets, sensitive communications, file sharing). Suspending the account immediately stops any further logins, prevents unauthorized access to archived emails, and blocks potential misuse.", "src": "PDF"}, {"n": 130, "stem": ["Which of the following is a reason for a company to use on-premises AI instead of cloudbased AI?"], "opts": [{"k": "A", "t": "Appropriate use"}, {"k": "B", "t": "Avoiding hallucinations"}, {"k": "C", "t": "Data privacy"}, {"k": "D", "t": "Avoiding bias"}], "ans": ["C"], "exp": "On-premises AI keeps all data local, giving the company full control and ensuring sensitive information never leaves the organization, which addresses strict data privacy requirements.", "src": "PDF"}, {"n": 131, "stem": ["A technician verifies that a malware incident occurred on some computers in a small office. Which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Quarantine the infected systems."}, {"k": "B", "t": "Educate the end users."}, {"k": "C", "t": "Disable System Restore."}, {"k": "D", "t": "Update the anti-malware and scan the computers."}], "ans": ["A"], "exp": "Once an incident is confirmed, the immediate priority is containment. Isolating (quarantining) the infected machines prevents the malware from spreading to other systems or exfiltrating data, enabling safe analysis and remediation.", "src": "PDF"}, {"n": 132, "stem": ["A technician is deploying mobile devices and needs to prevent access to sensitive data if the devices are lost. Which of the following is the best way to prevent unauthorized access if the user is unaware that the phone is lost?"], "opts": [{"k": "A", "t": "Encryption"}, {"k": "B", "t": "Remote wipe"}, {"k": "C", "t": "Geofencing"}, {"k": "D", "t": "Facial recognition"}], "ans": ["A"], "exp": "Full-disk (or device) encryption ensures that, even if a lost mobile device is physically accessed by an unauthorized party, its stored data remains inaccessible without the correct decryption credentials. This protection is automatic and continuous, safeguarding data at rest regardless of whether the user realizes the device is missing or not. Remote wipe can remove data if triggered, but it requires the device to be online and the user (or admin) to initiate the wipe--whereas encryption is always in effect.", "src": "PDF"}, {"n": 133, "stem": ["Which of the following filesystems supports read and write operations for Windows, macOS, and Linux?"], "opts": [{"k": "A", "t": "exFAT"}, {"k": "B", "t": "ReFS"}, {"k": "C", "t": "NTFS"}, {"k": "D", "t": "APFS"}, {"k": "E", "t": "ext4"}], "ans": ["A"], "exp": "exFAT is supported by Windows, macOS, and Linux for both read and write operations, making it the most compatible file system among the options listed.", "src": "PDF"}, {"n": 134, "stem": ["A technician completes the installation of an OS that appears to be successful. However, when the technician removes the USB drive that was used for the installation and restarts the system, the following error appears: No OS found. Which of the following should the technician do next to resolve the issue?"], "opts": [{"k": "A", "t": "Reinstall the OS from a new ISO"}, {"k": "B", "t": "Enable UEFI devices in the BIOS"}, {"k": "C", "t": "Restart in recovery mode and troubleshoot"}, {"k": "D", "t": "Install storage drivers for the motherboard"}, {"k": "E", "t": "Reseat the SATA cable"}], "ans": ["B"], "exp": "Enabling UEFI devices in the BIOS ensures that the system can detect and boot from the OS installed on a UEFI-configured drive, resolving the \"No OS found\" error after installation.", "src": "PDF"}, {"n": 135, "stem": ["Which of the following describes a vulnerability that has been exploited before a patch or remediation is available?"], "opts": [{"k": "A", "t": "Spoofing"}, {"k": "B", "t": "Brute-force"}, {"k": "C", "t": "DoS"}, {"k": "D", "t": "zero-day"}], "ans": ["D"], "exp": "A zero-day vulnerability refers to a security flaw that is actively exploited by attackers before the software vendor has released a patch or remediation - meaning defenders have \"zero days\" to prepare once the exploit becomes known.", "src": "PDF"}, {"n": 136, "stem": ["A user is working from home and is unable to access work files on a company laptop. Which of the following should a technician configure to fix the network access issue?"], "opts": [{"k": "A", "t": "Wide-area network"}, {"k": "B", "t": "Wireless network"}, {"k": "C", "t": "Proxy network settings"}, {"k": "D", "t": "Virtual private network"}], "ans": ["D"], "exp": "A VPN creates a secure tunnel from the user's home network into the corporate network, providing the necessary routing and access controls for the laptop to reach internal file servers. Without a VPN, the device remains outside the corporate LAN and cannot directly reach protected resources.", "src": "PDF"}, {"n": 137, "stem": ["A technician completes all steps to remove malware from a computer. All scans show the infection has been removed, but the device still does not function properly. Which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Update the antivirus software."}, {"k": "B", "t": "Quarantine the system."}, {"k": "C", "t": "Enable System Restore."}, {"k": "D", "t": "Reimage the device."}], "ans": ["D"], "exp": "After malware removal is complete and scans confirm the infection is gone, a system that still does not function properly may have damaged operating system files or persistent configuration issues. Reimaging restores the device to a known-good state.", "src": "PDF"}, {"n": 138, "stem": ["A location is experiencing under-voltage events during peak periods. Which of the following should be deployed at this location?"], "opts": [{"k": "A", "t": "Proper ventilation"}, {"k": "B", "t": "UPS"}, {"k": "C", "t": "Surge protector"}, {"k": "D", "t": "PDU"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 139, "stem": ["A company network is spread across multiple office branches that are located within the same postal code and connected using leased lines. Which of the following best describes this network type?"], "opts": [{"k": "A", "t": "Campus area network"}, {"k": "B", "t": "Metropolitan area network"}, {"k": "C", "t": "Local area network"}, {"k": "D", "t": "Wide area network"}], "ans": ["A"], "exp": "A campus area network connects multiple buildings or office locations within a limited geographic area, such as the same postal code, using high-speed links like leased lines, providing centralized network management and connectivity.", "src": "PDF"}, {"n": 140, "stem": ["An organization is creating a new application. As part of the deployment, the roles and responsibilities for supporting the application need to be documented. Which of the following is designed to contain this information?"], "opts": [{"k": "A", "t": "SOP"}, {"k": "B", "t": "NDA"}, {"k": "C", "t": "DRM"}, {"k": "D", "t": "EULA"}], "ans": ["A"], "exp": "An SOP (Standard Operating Procedure) is designed to document roles, responsibilities, and processes for supporting an application.", "src": "PDF"}, {"n": 141, "stem": ["Which of the following is the best reason for a network engineering team to provide a help desk technician with IP addressing information to use on workstations being deployed in a secure network segment?"], "opts": [{"k": "A", "t": "Only specific DNS servers are allowed outbound access."}, {"k": "B", "t": "The network allow list is set to a specific address."}, {"k": "C", "t": "DHCP services are not enabled for this subnet."}, {"k": "D", "t": "NAC servers only allow for security updates to be installed."}], "ans": ["C"], "exp": "When a subnet does not offer DHCP, workstations cannot automatically obtain IP configuration. Supplying help desk technicians with the correct static IP address, subnet mask, gateway, and DNS ensures the newly deployed machines can communicate on the secure network segment without relying on DHCP.", "src": "PDF"}, {"n": 142, "stem": ["Which of the following is the most secure method of preventing someone from accessing a cell phone?"], "opts": [{"k": "A", "t": "PIN"}, {"k": "B", "t": "Swipe"}, {"k": "C", "t": "Passphrase"}, {"k": "D", "t": "Pattern"}], "ans": ["C"], "exp": "A passphrase is typically longer and more complex than a PIN, swipe, or pattern, making it the most secure method for preventing unauthorized access to a cell phone.", "src": "PDF"}, {"n": 143, "stem": ["Which of the following commands is used to look up DNS records for a remote host?"], "opts": [{"k": "A", "t": "find"}, {"k": "B", "t": "curl"}, {"k": "C", "t": "dig"}, {"k": "D", "t": "ip"}], "ans": ["C"], "exp": "The dig command is used to query DNS servers and look up DNS records for a remote host.", "src": "PDF"}, {"n": 144, "stem": ["A technician recently installed a hard drive from a decommissioned PC. The technician wants to repurpose it for data storage but is unable to delete all the partitions in the graphical disk management tool. Which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Reinstall the HDD in the previous computer and clear the BIOS password."}, {"k": "B", "t": "Start from a Linux rescue disk and remove all malware."}, {"k": "C", "t": "Utilize the command-line interface from an elevated prompt."}, {"k": "D", "t": "Return the HDD to the manufacturer for a low-level format."}], "ans": ["C"], "exp": "Using the command-line interface from an elevated prompt allows the technician to use tools such as DiskPart to forcefully remove protected or stubborn partitions that cannot be deleted through the graphical Disk Management utility.", "src": "PDF"}, {"n": 145, "stem": ["Which of the following is used to apply corporate restrictions on an Apple device?"], "opts": [{"k": "A", "t": "App Store"}, {"k": "B", "t": "VPN configuration"}, {"k": "C", "t": "Apple ID"}, {"k": "D", "t": "Management profile"}], "ans": ["D"], "exp": "An MDM (Mobile Device Management) management profile allows administrators to enforce corporate policies on Apple devices, such as restricting app installations, configuring network settings, and applying security restrictions. This profile is installed on the device and centrally managed to ensure compliance.", "src": "PDF"}, {"n": 146, "stem": ["A user reports that their corporate mobile phone is lost. Which of the following protects the data locally on the phone from unauthorized access?"], "opts": [{"k": "A", "t": "Password manager"}, {"k": "B", "t": "Degaussing"}, {"k": "C", "t": "Remote wipe"}, {"k": "D", "t": "Antivirus"}], "ans": ["C"], "exp": "Remote wipe is a mobile device management (MDM) feature that allows administrators to erase data remotely if a device is lost or stolen, preventing unauthorized access to corporate or personal information.", "src": "PDF"}, {"n": 147, "stem": ["When a corporate laptop is connected to the company network, the laptop is able to reach external websites. However, when the laptop tries to reach any internal websites the following error message appears: Hmm... Cannot reach this page. Which of the following should a technician configure?"], "opts": [{"k": "A", "t": "Subnet mask"}, {"k": "B", "t": "DNS settings"}, {"k": "C", "t": "Default gateway"}, {"k": "D", "t": "DHCP"}], "ans": ["B"], "exp": "Incorrect DNS settings prevent the laptop from resolving internal hostnames. External sites work because they use public DNS, but internal addresses fail without the correct internal DNS server. Configuring the proper DNS settings resolves the issue.", "src": "PDF"}, {"n": 148, "stem": ["Which of the following types of RAM is typically used in servers?"], "opts": [{"k": "A", "t": "SODIMM"}, {"k": "B", "t": "Rambus"}, {"k": "C", "t": "DDR3"}, {"k": "D", "t": "ECC"}], "ans": ["D"], "exp": "Error-correcting code memory is commonly used in servers because it detects and corrects memory errors, improving reliability and stability in critical systems.", "src": "PDF"}, {"n": 149, "stem": ["Which of the following is used to identify potential issues with a proposed change prior to implementation?"], "opts": [{"k": "A", "t": "Request form"}, {"k": "B", "t": "Rollback plan"}, {"k": "C", "t": "End-user acceptance"}, {"k": "D", "t": "Sandbox testing"}], "ans": ["D"], "exp": "Sandbox testing allows proposed changes to be evaluated in an isolated environment to identify potential issues before implementation.", "src": "PDF"}, {"n": 150, "stem": ["Technicians are failing to document user contact information, device asset tags, and a clear description of each issue in the ticketing system. Which of the following should a help desk management team implement for technicians to use on every call?"], "opts": [{"k": "A", "t": "Service-level agreements"}, {"k": "B", "t": "Call categories"}, {"k": "C", "t": "Standard operating procedures"}, {"k": "D", "t": "Knowledge base articles"}], "ans": ["C"], "exp": "Standard operating procedures (SOPs) define consistent, step-by-step guidelines that technicians must follow - such as capturing user contact details, asset tags, and detailed issue descriptions on every ticket. Implementing SOPs ensures thorough and uniform documentation across all calls.", "src": "PDF"}, {"n": 151, "stem": ["A user's Android smartphone frequently restarts when running a specific application. The smartphone is running the latest OS patch, and all applications are confirmed to be up to date. The issue began after the user installed several new applications the previous week. Which of the following steps should a technician take first?"], "opts": [{"k": "A", "t": "Clear the storage cache for the crashing application."}, {"k": "B", "t": "Uninstall the latest OS patch."}, {"k": "C", "t": "Perform a factory reset on the smartphone."}, {"k": "D", "t": "Test the application on another smartphone."}], "ans": ["A"], "exp": "Clearing the application's cache is the least invasive initial troubleshooting step and can resolve crashes caused by corrupted or conflicting cached data without affecting the operating system or other applications.", "src": "PDF"}, {"n": 152, "stem": ["A technician installs a Bluetooth headset for a user. During testing, the sound is still coming from the speaker on the computer. The technician verifies the headset shows up in Device Manager. Which of the following would the technician most likely do to fix this issue?"], "opts": [{"k": "A", "t": "Update the drivers for the wireless headset"}, {"k": "B", "t": "Replace the battery on the headset and try again later"}, {"k": "C", "t": "Verify that the sound is not muted in the control panel"}, {"k": "D", "t": "Change the headset as the default device in sound settings"}], "ans": ["D"], "exp": "The technician should change the headset to the default device in the sound settings to ensure audio is routed to the Bluetooth headset instead of the computer's speakers.", "src": "PDF"}, {"n": 153, "stem": ["Which of the following is a key AI characteristic that is applied in operational procedures?"], "opts": [{"k": "A", "t": "AI systems can support any kind of operations relying on historical data."}, {"k": "B", "t": "AI leverages preset rules and algorithms to imitate human decision-making."}, {"k": "C", "t": "AI eliminates the need for human oversight in all operational processes."}, {"k": "D", "t": "AI is primarily used to upgrade software components in IT systems."}], "ans": ["B"], "exp": "AI applies preset rules and algorithms to analyze data and mimic human decision-making, which is a key characteristic used in operational procedures.", "src": "PDF"}, {"n": 154, "stem": ["Which of the following is found in an MSDS sheet for a battery backup?"], "opts": [{"k": "A", "t": "Installation instructions"}, {"k": "B", "t": "Emergency procedures"}, {"k": "C", "t": "Configuration steps"}, {"k": "D", "t": "Voltage specifications"}], "ans": ["B"], "exp": "A Material Safety Data Sheet (MSDS) provides critical safety and handling information for hazardous materials - in this case, the battery's chemicals. It includes emergency procedures (first-aid measures, fire-fighting steps, spill containment), ensuring responders know how to act safely in an incident.", "src": "PDF"}, {"n": 155, "stem": ["Which of the following are system folders on the macOS? (Choose two.)"], "opts": [{"k": "A", "t": "Applications"}, {"k": "B", "t": "Spotlight"}, {"k": "C", "t": "Time Machine"}, {"k": "D", "t": "Library"}, {"k": "E", "t": "FileVault"}, {"k": "F", "t": "iCIoud"}], "ans": ["A", "D"], "exp": "Applications is a core macOS system folder that stores installed apps. Library is a system folder that contains system and user resources required by macOS and applications.", "src": "PDF"}, {"n": 156, "stem": ["A user called the help desk to report an issue with the internet connection speed on a laptop. The technician thinks that background services may be using extra bandwidth. Which of the following tools should the technician use to investigate connections on the laptop?"], "opts": [{"k": "A", "t": "nslookup"}, {"k": "B", "t": "net use"}, {"k": "C", "t": "netstat"}, {"k": "D", "t": "net user"}], "ans": ["C"], "exp": "The netstat tool displays active network connections and listening ports, allowing the technician to identify background services and processes that may be using extra bandwidth on the laptop.", "src": "PDF"}, {"n": 157, "stem": ["Which of the following is an example of malware that runs on the device and uses built-in sensors to monitor targets without their consent?"], "opts": [{"k": "A", "t": "Spyware"}, {"k": "B", "t": "Rootkit"}, {"k": "C", "t": "Trojan"}, {"k": "D", "t": "Stalkerware"}], "ans": ["D"], "exp": "Stalkerware is designed to secretly monitor a user's activity by leveraging device features such as GPS, microphone, camera, and other sensors without the user's consent.", "src": "PDF"}, {"n": 158, "stem": ["A customer asks a help desk technician for help in selecting new computers. The customer would like to avoid expensive licensing fees but would like all files to be kept locally. Which of the following operating systems should the technician recommend?"], "opts": [{"k": "A", "t": "Linux"}, {"k": "B", "t": "Chrome OS"}, {"k": "C", "t": "Windows"}, {"k": "D", "t": "macOS"}], "ans": ["A"], "exp": "Linux provides a full-featured OS without expensive licensing fees and allows all files to be stored locally, meeting the customer's requirements.", "src": "PDF"}, {"n": 159, "stem": ["A team member provides a link to an online slide deck presentation so other team members can add to the presentation. The link does not work for any of the other team members. Which of the following should the team check first?"], "opts": [{"k": "A", "t": "Version history"}, {"k": "B", "t": "Web browser compatibility"}, {"k": "C", "t": "Viewing and sharing permissions"}, {"k": "D", "t": "License management"}], "ans": ["C"], "exp": "The team should first check the viewing and sharing permissions, as incorrect permissions are the most likely reason others cannot access or edit the online slide deck.", "src": "PDF"}, {"n": 160, "stem": ["A user is experiencing issues with outdated images while browsing websites. Which of the following settings should a technician use to correct this issue?"], "opts": [{"k": "A", "t": "Administrative Tools"}, {"k": "B", "t": "Windows Defender Firewall"}, {"k": "C", "t": "Internet Options"}, {"k": "D", "t": "Ease of Access"}], "ans": ["C"], "exp": "In Internet Options (under the Browsing History Settings), you can configure how often the browser checks for newer versions of stored pages and content. Adjusting the \"Check for newer versions of stored pages\" setting forces the browser to retrieve up-to-date images rather than using cached copies.", "src": "PDF"}, {"n": 161, "stem": ["A support specialist needs to decide whether to install a 32-bit or 64-bit OS architecture on a new computer. Which of the following specifications will help the specialist determine which OS architecture to use?"], "opts": [{"k": "A", "t": "16GB RAM"}, {"k": "B", "t": "Intel i7 CPU"}, {"k": "C", "t": "500GB HDD"}, {"k": "D", "t": "1Gbps Ethernet"}], "ans": ["B"], "exp": "The CPU's architecture determines whether it can run a 64-bit OS. Most Intel i7 processors are 64-bit capable, whereas simply knowing the amount of RAM (e.g., 16 GB) doesn't guarantee the processor supports 64-bit operations. Once you confirm the CPU is 64-bit (as with an Intel i7), you can install a 64-bit OS to fully utilize available memory.", "src": "PDF"}, {"n": 162, "stem": ["A technician is assisting a customer who is experiencing frequent network issues. The customer asks whether other clients have experienced similar issues and how those situations were handled. Which of the following is the best way for the technician to respond?"], "opts": [{"k": "A", "t": "Share details about other customer issues and how they were resolved."}, {"k": "B", "t": "Dismiss the user's concern and assure them that their issue is unique."}, {"k": "C", "t": "Provide a general explanation of troubleshooting steps without additional details."}, {"k": "D", "t": "Criticize the customer's network provider and recommend a new vendor."}], "ans": ["C"], "exp": "Providing a general explanation of troubleshooting steps maintains professionalism and protects customer confidentiality while still addressing the user's concern.", "src": "PDF"}, {"n": 163, "stem": ["Each time a user tries to go to the selected web search provider, a different website opens. Which of the following should the technician check first?"], "opts": [{"k": "A", "t": "System time"}, {"k": "B", "t": "IP address"}, {"k": "C", "t": "DNS servers"}, {"k": "D", "t": "Windows updates"}], "ans": ["C"], "exp": "If a user is redirected to an unexpected website, the DNS servers should be checked first to ensure they have not been changed or compromised.", "src": "PDF"}, {"n": 164, "stem": ["A user is trying to install a preferred word processor on their work laptop, but the installation fails each time. Which of the following is most likely the cause of this failure?"], "opts": [{"k": "A", "t": "Full browser cache"}, {"k": "B", "t": "Slow internet speeds"}, {"k": "C", "t": "Incorrectly configured ACL"}, {"k": "D", "t": "Unformatted hard drive"}], "ans": ["C"], "exp": "An incorrectly configured access control list can prevent the user from having the necessary permissions to install software. If the user lacks write or execute permissions on required directories or system areas, the installation process will fail.", "src": "PDF"}, {"n": 165, "stem": ["A customer is unable to open some files on their system. Each time the customer attempts to open a file, the customer receives a message that the file is encrypted. Which of the following best describes this issue?"], "opts": [{"k": "A", "t": "Keylogger"}, {"k": "B", "t": "Ransomware"}, {"k": "C", "t": "Phishing"}, {"k": "D", "t": "Cryptominer"}], "ans": ["B"], "exp": "Ransomware is malware that encrypts a user's files and then demands payment (a ransom) in exchange for the decryption key. The user's inability to open the files and the message indicating they're encrypted are classic signs of a ransomware attack.", "src": "PDF"}, {"n": 166, "stem": ["A user wants to use a popular search engine. When the user enters the URL in the address bar. the web page displays the following message instead of the expected search engine: The antivirus has expired. Which of the following would most likely cause this issue?"], "opts": [{"k": "A", "t": "Random pop-ups"}, {"k": "B", "t": "Browser redirection"}, {"k": "C", "t": "Certificate warnings"}, {"k": "D", "t": "Internet failure"}], "ans": ["B"], "exp": "Browser redirection occurs when malware or unwanted software forces the browser to load an unexpected page instead of the intended site, such as showing an \"antivirus expired\" page instead of a search engine.", "src": "PDF"}, {"n": 167, "stem": ["Which of the following connector types would most likely be used to connect a fiber-optic cable to an SFP module?"], "opts": [{"k": "A", "t": "ST"}, {"k": "B", "t": "SC"}, {"k": "C", "t": "FC"}, {"k": "D", "t": "LC"}], "ans": ["D"], "exp": "LC connectors are the standard small form-factor connectors commonly used with SFP modules, providing a compact and secure connection for fiber-optic cables.", "src": "PDF"}, {"n": 168, "stem": ["A user decides to switch to Windows from Linux and is trying to migrate data using an external USB hard disk. However, when the user connects the cable to the Windows machine, an error message appears stating the device must be formatted before it can be used. The hard disk works as expected when connected to the Linux machine. Which of the following should the user do to resolve this issue?"], "opts": [{"k": "A", "t": "Configure Windows firewall to allow data from Linux systems"}, {"k": "B", "t": "Replace the cable with Windows-supported hardware"}, {"k": "C", "t": "Apply a firmware update from the PC manufacturer"}, {"k": "D", "t": "Update the file allocation system to exFAT"}], "ans": ["D"], "exp": "Updating the file allocation system to exFAT allows compatibility between Linux and Windows, enabling the hard disk to be read and written to by both operating systems.", "src": "PDF"}, {"n": 169, "stem": ["A user is unable to log in to the network. The network uses 802.1X with EAP-TLS to authenticate on the wired network. The user has been on an extended leave and has not logged in to the computer in several months. Which of the following is causing the login issue?"], "opts": [{"k": "A", "t": "Expired certificate"}, {"k": "B", "t": "OS update failure"}, {"k": "C", "t": "Service not started"}, {"k": "D", "t": "Application crash"}, {"k": "E", "t": "Profile rebuild needed"}], "ans": ["A"], "exp": "EAP-TLS authentication relies on digital certificates. If the user has not logged in for several months, their authentication certificate may have expired, preventing successful network login.", "src": "PDF"}, {"n": 170, "stem": ["Which of the following methods involves requesting a user's approval via a push notification to verify the user's identity?"], "opts": [{"k": "A", "t": "Call"}, {"k": "B", "t": "Authenticator"}, {"k": "C", "t": "Hardware token"}, {"k": "D", "t": "SMS"}], "ans": ["B"], "exp": "Modern authenticator apps (such as Microsoft Authenticator or Google Authenticator with push capability) can send a push notification to the user's registered device. The user approves or denies the login request via the notification, providing a quick and secure second factor for authentication.", "src": "PDF"}, {"n": 171, "stem": ["Which of the following controls access to certain services to ensure that administrators are not automatically given elevated permissions?"], "opts": [{"k": "A", "t": "PAM"}, {"k": "B", "t": "MFA"}, {"k": "C", "t": "DLP"}, {"k": "D", "t": "SSO"}], "ans": ["A"], "exp": "PAM (Privileged Access Management) controls access to certain services so that administrators are not automatically granted elevated permissions.", "src": "PDF"}, {"n": 172, "stem": ["After a local company office was destroyed by a hurricane, the company files an insurance claim for equipment replacement. The company maintained current, off-site backups. Which of the following is the most important information to provide to the insurance company?"], "opts": [{"k": "A", "t": "Inventory list"}, {"k": "B", "t": "Software licensing"}, {"k": "C", "t": "Warranty information"}, {"k": "D", "t": "Topology diagram"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 173, "stem": ["A user receives a new personal computer but is unable to run an application. An error displays saying that .NET Framework 3.5 is required and not found. Which of the following actions is the best way to resolve this issue?"], "opts": [{"k": "A", "t": "Resolve the dependency through the 'Turn Windows features on or off' menu."}, {"k": "B", "t": "Download the dependency via a third-party repository."}, {"k": "C", "t": "Ignore the dependency and install the latest version 4 instead."}, {"k": "D", "t": "Forward the trouble ticket to the SOC team because the issue poses a great security risk."}], "ans": ["A"], "exp": "Windows includes .NET Framework 3.5 as an optional feature. Enabling it via Control Panel Programs and Features Turn Windows features on or off ensures the OS installs the correct version directly from Microsoft without relying on untrusted sources or skipping needed dependencies.", "src": "PDF"}, {"n": 174, "stem": ["Which of the following describes an attack in which an attacker sets up a rogue AP that tricks users into connecting to the rogue AP instead of the legitimate network?"], "opts": [{"k": "A", "t": "Stalkerware"}, {"k": "B", "t": "Evil twin"}, {"k": "C", "t": "Tailgating"}, {"k": "D", "t": "Shoulder surfing"}], "ans": ["B"], "exp": "An evil twin attack involves an adversary configuring a rogue wireless access point with the same SSID and similar settings as a legitimate network. Unsuspecting users connect to this rogue AP, allowing the attacker to intercept traffic, capture credentials, and launch further attacks.", "src": "PDF"}, {"n": 175, "stem": ["An administrator is investigating a zero-day vulnerability on a core system. If the vulnerability is not patched, the negative impact to business could be significant. The vendor has released a patch, but it requires downtime to deploy. Which of the following actions should the administrator take?"], "opts": [{"k": "A", "t": "Create a standard change request."}, {"k": "B", "t": "Implement an emergency change."}, {"k": "C", "t": "Immediately freeze all changes."}, {"k": "D", "t": "Continue operations until the next change interval."}], "ans": ["B"], "exp": "An emergency change is appropriate when a critical vulnerability poses significant business risk and must be addressed immediately, even if downtime is required.", "src": "PDF"}, {"n": 176, "stem": ["An endpoint's screensaver no longer activates automatically. The global security policy states that the screensaver should activate after the endpoint has been idle for an hour. Which of the following commands should the technician run on the endpoint to investigate this issue?"], "opts": [{"k": "A", "t": "msinfo32.exe"}, {"k": "B", "t": "gpresult"}, {"k": "C", "t": "sfc /scannow"}, {"k": "D", "t": "whoami"}], "ans": ["B"], "exp": "The gpresult command displays the Resultant Set of Policy, allowing the technician to verify whether the screensaver policy is being applied and to troubleshoot Group Policy-related issues affecting the endpoint.", "src": "PDF"}, {"n": 177, "stem": ["A technician thinks a computer is not receiving some settings from the corporate domain. Which of the following tools should the technician use to gather more relevant information?"], "opts": [{"k": "A", "t": "chkdsk"}, {"k": "B", "t": "systeminfo"}, {"k": "C", "t": "gpresult"}, {"k": "D", "t": "nslookup"}], "ans": ["C"], "exp": "gpresult displays which Group Policy settings are applied to the computer and user, making it the correct tool to determine whether the system is receiving domain settings.", "src": "PDF"}, {"n": 178, "stem": ["A user installed a free application from an unofficial application store. Now, their smartphone displays random pop-ups and shows increased data usage. Additionally, the user cannot perform certain actions such as opening banking applications or updating their OS. Which of the following should the user do first to address the security issues on their smartphone?"], "opts": [{"k": "A", "t": "Perform a factory reset."}, {"k": "B", "t": "Clear the device cache."}, {"k": "C", "t": "Contact the manufacturer's support line."}, {"k": "D", "t": "Change all passwords on the device."}], "ans": ["A"], "exp": "A factory reset is the first step because the device is showing clear signs of malware infection from an unverified app. Resetting the smartphone removes malicious software and restores the device to a secure, clean state.", "src": "PDF"}, {"n": 179, "stem": ["A technician is 3-D printing high-strength, carbon fiber-based filament parts for a customer order. Which of the following is the most important for the technician to use?"], "opts": [{"k": "A", "t": "Steel-toed boots"}, {"k": "B", "t": "Air filter mask"}, {"k": "C", "t": "ESD mat"}, {"k": "D", "t": "Antistatic bags"}], "ans": ["B"], "exp": "An air filter mask is most important because 3-D printing carbon fiber-based filaments can release fine particles and fumes that are hazardous if inhaled.", "src": "PDF"}, {"n": 180, "stem": ["A user recently installed an application that accesses a database from a local server. When launching the application, it does not populate any information. Which of the following commandline tools is the best to troubleshoot the issue?"], "opts": [{"k": "A", "t": "ipconfig"}, {"k": "B", "t": "nslookup"}, {"k": "C", "t": "netstat"}, {"k": "D", "t": "curl"}], "ans": ["C"], "exp": "netstat reveals active network connections and listening ports on the local machine. By using it, you can confirm that the application has successfully opened (or attempted) a connection to the database server's port, verify the remote server's address and port, and detect any failed or hanging TCP sessions that would prevent data retrieval.", "src": "PDF"}, {"n": 181, "stem": ["Thousands of compromised machines are attempting to make fake purchases from an online store. Which of the following is taking place?"], "opts": [{"k": "A", "t": "Brute-force attack"}, {"k": "B", "t": "Spoofing"}, {"k": "C", "t": "DDoS"}, {"k": "D", "t": "SQL injection"}], "ans": ["C"], "exp": "A distributed denial-of-service attack occurs when many compromised machines, often part of a botnet, generate large volumes of traffic toward a target system. This overwhelms the online store's resources, disrupting normal operations such as legitimate purchases.", "src": "PDF"}, {"n": 182, "stem": ["A user takes a work-issued laptop home for the first time. When the user attempts to browse any website on the home internet, the user receives the following error: \"This site cannot be reached.\" A technician from work confirms that the static IP that was set up on the machine was changed back to DHCP. Which of the following needs to be corrected?"], "opts": [{"k": "A", "t": "HTTPS"}, {"k": "B", "t": "VLAN"}, {"k": "C", "t": "DNS"}, {"k": "D", "t": "SMTP"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 183, "stem": ["A company's Windows 10 devices have been infected with ransomware and all files are now encrypted. The executives have decided against paying the ransom money. Which of the following actions will achieve full operation without any trace of the ransomware?"], "opts": [{"k": "A", "t": "Restore from the recovery partition."}, {"k": "B", "t": "Upgrade all company machines to Windows 11."}, {"k": "C", "t": "Perform a clean installation."}, {"k": "D", "t": "Repair the installation using Windows Recovery Environment."}], "ans": ["C"], "exp": "A clean installation removes the existing infected operating system and encrypted file state, then rebuilds the device from a known-clean source. This provides full operation without retaining traces of the ransomware.", "src": "PDF"}, {"n": 184, "stem": ["A user calls the help desk to report potential malware on a computer. The anomalous activity began after the user clicked a link to a free gift card in a recent email. The technician asks the user to describe any unusual activity, such as slow performance, excessive pop-ups, and browser redirections. Which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Advise the user to run a complete system scan using the OS anti-malware application."}, {"k": "B", "t": "Guide the user to reboot the machine into safe mode and verify whether the anomalous activities are still present."}, {"k": "C", "t": "Have the user check for recently installed applications and outline those installed since the link in the email was clicked."}, {"k": "D", "t": "Instruct the user to disconnect the Ethernet connection to the corporate network."}], "ans": ["D"], "exp": "Disconnecting from the corporate network helps prevent the potential spread of malware and protects other systems while the issue is investigated.", "src": "PDF"}, {"n": 185, "stem": ["A technician is reviewing an organization's current incident management policy. The organization uses a third-party vendor to protect the organization's assets with multiple tools. Which of the following service types is the organization using?"], "opts": [{"k": "A", "t": "PaaS"}, {"k": "B", "t": "EDR"}, {"k": "C", "t": "MDR"}, {"k": "D", "t": "XDR"}], "ans": ["C"], "exp": "MDR (Managed Detection and Response) is a service where a third-party vendor provides security monitoring and incident response using multiple tools to protect an organization's assets.", "src": "PDF"}, {"n": 186, "stem": ["A company wants to use its directory database to authenticate users to its wireless network. Which of the following should the company use to accomplish this task?"], "opts": [{"k": "A", "t": "MFA"}, {"k": "B", "t": "WPA3"}, {"k": "C", "t": "RADIUS"}, {"k": "D", "t": "LDAP"}], "ans": ["C"], "exp": "RADIUS allows integration with directory databases to authenticate users to the wireless network.", "src": "PDF"}, {"n": 187, "stem": ["A company's IT policy requires the protection of sensitive data on employee laptops, especially those taken off premises. Recently, data theft on these devices has become a concern. Which of the following security measures should the company implement to safeguard the laptops?"], "opts": [{"k": "A", "t": "Full disk encryption"}, {"k": "B", "t": "Intrusion detection software"}, {"k": "C", "t": "Biometric authentication"}, {"k": "D", "t": "VPN access"}], "ans": ["A"], "exp": "Full disk encryption protects all data on a laptop by making the contents unreadable without proper authentication, preventing data theft even if the device is lost or stolen.", "src": "PDF"}, {"n": 188, "stem": ["A technician is installing a cloud-based productivity suite and keeps getting an error message stating that the installation is unavailable. Which of the following troubleshooting steps should the technician try first?"], "opts": [{"k": "A", "t": "Reinstalling the productivity suite"}, {"k": "B", "t": "Downloading an open-source alternative"}, {"k": "C", "t": "Checking the license device limit"}, {"k": "D", "t": "Updating the device OS"}], "ans": ["C"], "exp": "The technician should first check the license device limit, as exceeding the allowed number of installations can prevent the cloud-based productivity suite from being installed.", "src": "PDF"}, {"n": 189, "stem": ["Which of the following best describes XFS?"], "opts": [{"k": "A", "t": "A filesystem used by the Linux OS"}, {"k": "B", "t": "A filesystem used by iOS"}, {"k": "C", "t": "A filesystem used by the Windows OS"}, {"k": "D", "t": "A filesystem used by the macOS"}], "ans": ["A"], "exp": "XFS is a high-performance filesystem commonly used in Linux operating systems.", "src": "PDF"}, {"n": 190, "stem": ["A technician is testing a new network monitoring application that enables real-time notifications when remote devices go offline. The remote locations are connected to the corporate offices by a VPN connection over the internet. Which of the following should the technician consider before enabling monitoring in all locations?"], "opts": [{"k": "A", "t": "Operational uptime requirements and maintenance windows"}, {"k": "B", "t": "Bandwidth consumption at headquarters"}, {"k": "C", "t": "Impact on the remote devices' baseline performance"}, {"k": "D", "t": "Business use cases for network monitoring"}], "ans": ["A"], "exp": "Monitoring tools can generate alerts during planned downtime or maintenance, so understanding operational uptime requirements and maintenance windows is essential to avoid false positives and ensure accurate, meaningful alerting across all locations.", "src": "PDF"}, {"n": 191, "stem": ["A user is unable to use the latest version of an application on a legacy, personal tablet. Which of the following is most likely the reason?"], "opts": [{"k": "A", "t": "The OS is end-of-life"}, {"k": "B", "t": "Space is inadequate"}, {"k": "C", "t": "MDM is blocking updates"}, {"k": "D", "t": "The tablet is infected with malware"}], "ans": ["A"], "exp": "The OS is end-of-life, which prevents the latest version of the application from being supported or installed on the legacy tablet.", "src": "PDF"}, {"n": 192, "stem": ["Which of the following file extensions are commonly used to install applications on a macOS machine? (Choose three.)"], "opts": [{"k": "A", "t": ".mac"}, {"k": "B", "t": ".pkg"}, {"k": "C", "t": ".deb"}, {"k": "D", "t": ".dmg"}, {"k": "E", "t": ".msi"}, {"k": "F", "t": ".appx"}, {"k": "G", "t": ".app"}, {"k": "H", "t": ".apk"}], "ans": ["B", "D", "G"], "exp": ".pkg, .dmg, and .app are standard macOS file extensions used for installing or running applications.", "src": "PDF"}, {"n": 193, "stem": ["Which of the following is the quickest way to move from Windows 10 to Windows 11 without losing data?"], "opts": [{"k": "A", "t": "Using gpupdate"}, {"k": "B", "t": "Image deployment"}, {"k": "C", "t": "Clean install"}, {"k": "D", "t": "In-place upgrade"}], "ans": ["D"], "exp": "An in-place upgrade directly installs Windows 11 over the existing Windows 10 installation, preserving user files, applications, and settings. It's much faster than capturing and redeploying an image, and it avoids the data loss risk of a clean install.", "src": "PDF"}, {"n": 194, "stem": ["A technician needs to install a home wireless router for a customer who wants to limit connections made to the network from the internet. Which of the following should the technician do?"], "opts": [{"k": "A", "t": "Use content filtering."}, {"k": "B", "t": "Change the default password."}, {"k": "C", "t": "Configure the SSID settings."}, {"k": "D", "t": "Disable UPnP."}], "ans": ["D"], "exp": "Disabling UPnP (Universal Plug and Play) helps limit unsolicited or unauthorized connections from the internet by preventing devices from automatically opening ports on the router.", "src": "PDF"}, {"n": 195, "stem": ["A user receives an unexpected text message containing a link to reset an expired password. Which of the following social engineering attacks is taking place?"], "opts": [{"k": "A", "t": "Vishing"}, {"k": "B", "t": "Spear phishing"}, {"k": "C", "t": "Whaling"}, {"k": "D", "t": "Smishing"}], "ans": ["D"], "exp": "Smishing is a social engineering attack conducted via SMS or text messages, where attackers send fraudulent links or messages to trick users into revealing credentials or sensitive information.", "src": "PDF"}, {"n": 196, "stem": ["A government organization forbids a systems administrator from configuring any servers without the presence of another employee. Which of the following threats is the company trying to mitigate?"], "opts": [{"k": "A", "t": "Zero-day"}, {"k": "B", "t": "On-path"}, {"k": "C", "t": "Evil twin"}, {"k": "D", "t": "Insider"}], "ans": ["D"], "exp": "Requiring another employee to be present during server configuration is a control designed to prevent or detect malicious actions from an internal employee, mitigating insider threats.", "src": "PDF"}, {"n": 197, "stem": ["Various alerts on a user's Windows 11 laptop are continually interrupting the user during videoconference calls. Which of the following should a support technician recommend to best solve the issue?"], "opts": [{"k": "A", "t": "Use multiple sound output devices for the various source applications"}, {"k": "B", "t": "Disable all notifications in different applications in the order they appear"}, {"k": "C", "t": "Configure the Sounds option in Control Panel to be set to No Sounds"}, {"k": "D", "t": "Set Windows Notifications settings to Do Not Disturb"}], "ans": ["D"], "exp": "Windows 11 features a\"Do Not Disturb\"mode under Notification settings, which is designed to suppress interruptions during tasks like videoconferencing.", "src": "PDF"}, {"n": 198, "stem": ["An organization's marketing department wants to use a new generative AI product. A technician reviews the company's AI policy and notices the new product is not listed in the appropriate use section. Which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Inform the marketing department that the AI product cannot be used, as it is not within the company's AI policy."}, {"k": "B", "t": "Escalate the request to the chief technology office and legal department for appropriate approval."}, {"k": "C", "t": "Deploy the AI product to the marketing department for acceptable use testing."}, {"k": "D", "t": "Acquire additional information from the marketing department for a use case within the organization."}], "ans": ["B"], "exp": "Introducing a new generative AI product that is not covered by the existing AI policy requires formal review to address legal, security, compliance, and risk considerations. Escalating the request ensures the product is evaluated and approved through proper governance before use.", "src": "PDF"}, {"n": 199, "stem": ["Every time a user loads a specific spreadsheet, their computer is temporarily unresponsive. The user also notices that the title bar indicates the applications are not responding. Which of the following would a technician most likely inspect?"], "opts": [{"k": "A", "t": "Anti-malware logs"}, {"k": "B", "t": "Workstation repair options"}, {"k": "C", "t": "Bandwidth status as reported in the Task Manager"}, {"k": "D", "t": "File size and related memory utilization"}], "ans": ["D"], "exp": "A very large or complex spreadsheet can consume excessive RAM and CPU cycles, causing the application to hang or become unresponsive. By checking the file's size and monitoring how much memory Excel (or the spreadsheet program) uses when opening it, the technician can confirm whether resource exhaustion is the culprit and take steps - like simplifying the file or adding RAM - t o resolve the issue.", "src": "PDF"}, {"n": 200, "stem": ["Which of the following must be followed during incident response to ensure the collected evidence is properly handled and accounted for?"], "opts": [{"k": "A", "t": "Order of volatility for data"}, {"k": "B", "t": "Law enforcement notification procedures"}, {"k": "C", "t": "Data integrity best practices"}, {"k": "D", "t": "Chain of custody process"}], "ans": ["D"], "exp": "The chain of custody process ensures that evidence is properly documented, handled, and tracked throughout the incident response lifecycle, preserving its integrity and admissibility.", "src": "PDF"}, {"n": 201, "stem": ["A support technician must install software that allows a user to deliver a project status presentation to external stakeholders. Which of the following software types should the technician install?"], "opts": [{"k": "A", "t": "WinRM"}, {"k": "B", "t": "RMM"}, {"k": "C", "t": "Videoconferencing"}, {"k": "D", "t": "Secure file transfer"}], "ans": ["C"], "exp": "Videoconferencing software enables real-time audio and video communication and screen sharing, which is required for delivering a project status presentation to external stakeholders.", "src": "PDF"}, {"n": 202, "stem": ["An administrator must configure a server that prioritizes data availability. Because the server will be accessed by many users, the administrator must also consider performance. Which of the following RAID levels best meets these requirements within a single array?"], "opts": [{"k": "A", "t": "1"}, {"k": "B", "t": "2"}, {"k": "C", "t": "5"}, {"k": "D", "t": "10"}], "ans": ["D"], "exp": "RAID 10 combines mirroring and striping, providing high data availability through redundancy and improved performance through parallel read/write operations, making it ideal for environments with many users and high access demands.", "src": "PDF"}, {"n": 203, "stem": ["A technician is performing an in-place upgrade on a user's laptop. Which of the following is the most effective method of upgrading the workstation to the latest OS?"], "opts": [{"k": "A", "t": "Utilize the latest version of the .iso file."}, {"k": "B", "t": "Back up data and perform a fresh installation."}, {"k": "C", "t": "Enter the BIOS and enable USB access."}, {"k": "D", "t": "Use the System Update utility."}], "ans": ["D"], "exp": "The System Update utility is designed for in-place upgrades, allowing the technician to upgrade the OS while preserving user data and applications.", "src": "PDF"}, {"n": 204, "stem": ["A user wants to dispose of a failed hard drive in a way that ensures the data is unrecoverable. Which of the following is the best at-home method?"], "opts": [{"k": "A", "t": "Standard formatting"}, {"k": "B", "t": "Low-level formatting"}, {"k": "C", "t": "Shredding"}, {"k": "D", "t": "Degaussing"}, {"k": "E", "t": "Drilling"}], "ans": ["E"], "exp": "Drilling physically destroys the hard drive platters, making data recovery impossible, and is an effective at-home method for ensuring data is unrecoverable.", "src": "PDF"}, {"n": 205, "stem": ["Which of the following commands lists running processes in Linux?"], "opts": [{"k": "A", "t": "top"}, {"k": "B", "t": "apt-get"}, {"k": "C", "t": "ls"}, {"k": "D", "t": "cat"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 206, "stem": ["A technician needs to disable guest log-ins on domain-joined desktop machines. Which of the following should the technician use?"], "opts": [{"k": "A", "t": "Group Policy"}, {"k": "B", "t": "Firewall"}, {"k": "C", "t": "Microsoft Management Control"}, {"k": "D", "t": "MSConfig"}], "ans": ["A"], "exp": "Group Policy is the standard administrative tool for enforcing security and configuration settings across domain-joined systems, including disabling guest accounts.", "src": "PDF"}, {"n": 207, "stem": ["A customer is explaining issues with a workstation to a technician. While the customer is listing the issues, the technician is browsing social media on a smartphone. Which of the following professionalism and communication techniques should the technician be using in this situation? (Choose two.)"], "opts": [{"k": "A", "t": "Follow up with the customer."}, {"k": "B", "t": "Avoid personal interruptions."}, {"k": "C", "t": "Provide proper documentation."}, {"k": "D", "t": "Clarify customer statements."}, {"k": "E", "t": "Actively listen and take notes."}, {"k": "F", "t": "Maintain professional attire."}], "ans": ["B", "E"], "exp": "Avoiding personal interruptions ensures the technician gives full attention to the customer. Actively listening and taking notes demonstrates respect and helps accurately address the customer's issues.", "src": "PDF"}, {"n": 208, "stem": ["A customer must access the contents of the AppData folder, which is in the local user profile. Which of the following should a technician configure so the customer can easily navigate to this location?"], "opts": [{"k": "A", "t": "Indexing"}, {"k": "B", "t": "File Explorer Options"}, {"k": "C", "t": "Privacy"}, {"k": "D", "t": "Ease of Access"}], "ans": ["B"], "exp": "The AppData folder is hidden by default. The technician should configure File Explorer Options to show hidden files so the customer can easily access the folder.", "src": "PDF"}, {"n": 209, "stem": ["An international traveler is concerned about others accessing the contents of their smartphone if it is lost or stolen. The traveler has enabled biometrics. Which of the following additional security measures further reduces the risk of unauthorized data access?"], "opts": [{"k": "A", "t": "Remote backups"}, {"k": "B", "t": "Location tracking"}, {"k": "C", "t": "PIN code screen lock"}, {"k": "D", "t": "Device encryption"}], "ans": ["D"], "exp": "Device encryption further reduces the risk of unauthorized data access by ensuring the contents of the smartphone cannot be read without proper authentication, even if the device is lost or stolen.", "src": "PDF"}, {"n": 210, "stem": ["A user reports some single sign-on errors to a help desk technician. Currently, the user is able to sign in to the company's application portal but cannot access a specific SaaS-based tool. Which of the following would the technician most likely suggest as a next step?"], "opts": [{"k": "A", "t": "Reenroll the user's mobile device to be used as an MFA token."}, {"k": "B", "t": "Use a private browsing window to avoid local session conflicts."}, {"k": "C", "t": "Bypass single sign-on by directly authenticating to the application."}, {"k": "D", "t": "Reset the device being used to factory defaults."}], "ans": ["B"], "exp": "Single sign-on issues that affect only a specific application often stem from stale or conflicting session data in the user's browser. Launching a private (incognito) window ensures a fresh session without cached cookies or tokens, which can resolve access to the SaaS tool without affecting other configurations.", "src": "PDF"}, {"n": 211, "stem": ["Which of the following is an example of an application publisher including undisclosed additional software in an installation package?"], "opts": [{"k": "A", "t": "Virus"}, {"k": "B", "t": "Ransomware"}, {"k": "C", "t": "Potentially unwanted program"}, {"k": "D", "t": "Trojan"}], "ans": ["C"], "exp": "A potentially unwanted program (PUP) refers to software bundled with an installer that the user did not explicitly request and that's often advertised or installed without clear disclosure. While not always malicious, PUPs can degrade performance or introduce unwanted behavior, matching the description of undisclosed additional software in a package.", "src": "PDF"}, {"n": 212, "stem": ["A technician is selecting a remote access method so users can securely access Linux and Windows servers when working from home. Which of the following should the technician choose to best meet this requirement?"], "opts": [{"k": "A", "t": "File Transfer Protocol"}, {"k": "B", "t": "Virtual private network"}, {"k": "C", "t": "Remote Desktop Protocol"}, {"k": "D", "t": "Remote monitoring and management"}], "ans": ["B"], "exp": "A virtual private network provides secure, encrypted remote access to internal resources across both Linux and Windows systems, making it the best choice for remote users connecting from home.", "src": "PDF"}, {"n": 213, "stem": ["A technician is helping to create a desktop backup policy for the company. The requirements include ensuring that the backups work as intended and recovery is possible. Which of the following routine tasks should the technician include in the policy to meet these requirements? (Choose two.)"], "opts": [{"k": "A", "t": "Incremental backup"}, {"k": "B", "t": "Backup reconfiguration"}, {"k": "C", "t": "Backup testing"}, {"k": "D", "t": "Differential backup"}, {"k": "E", "t": "Purging old backups"}, {"k": "F", "t": "Full backup"}], "ans": ["C", "F"], "exp": "Backup testing verifies that backups are valid and can be successfully restored, ensuring recovery is possible. Full backup creates a complete copy of all data, providing a reliable baseline needed for successful restoration.", "src": "PDF"}, {"n": 214, "stem": ["An administrator is investigating a technical outage. The management team wants information that includes the summary of the outage and actions taken. Which of the following documentation should the administrator provide to the management team?"], "opts": [{"k": "A", "t": "Knowledge base article"}, {"k": "B", "t": "Non-disclosure agreement"}, {"k": "C", "t": "Incident report"}, {"k": "D", "t": "Standard operating procedure"}], "ans": ["C"], "exp": "An incident report documents key details such as the cause of the outage, steps taken to resolve it, and measures to prevent recurrence. It is a post-mortem analysis often shared with stakeholders to improve future response.", "src": "PDF"}, {"n": 215, "stem": ["A user takes an iOS-based smartphone that is performing slowly to a repair shop. A shop technician finds the following information: Battery charge: 25% Battery health: 90% Hotspot: On Mobile reception: ||| Roaming: Off Used space: 63.76GB/64GB Which of the following is the cause of the issue?"], "opts": [{"k": "A", "t": "The device is running out of free space"}, {"k": "B", "t": "The battery health is low"}, {"k": "C", "t": "The phone is not sufficiently charged"}, {"k": "D", "t": "The hotspot is degrading the performance"}, {"k": "E", "t": "Too many applications are open"}], "ans": ["A"], "exp": "The device is running out of free space, which can cause performance issues as the operating system and applications require available storage to function properly.", "src": "PDF"}, {"n": 216, "stem": ["A user cannot log in to their computer. A technician confirms that the user's account is unlocked and resets their password. The technician tries logging in with the new credentials but gets a trust relationship error. Which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Rejoin the device to the domain."}, {"k": "B", "t": "Verify that there is network connectivity."}, {"k": "C", "t": "Replace the Ethernet cable."}, {"k": "D", "t": "Log in with a different account."}], "ans": ["A"], "exp": "A trust relationship error indicates that the secure channel between the computer and the domain controller has been broken. Rejoining the device to the domain reestablishes this secure relationship and restores proper authentication with the domain.", "src": "PDF"}, {"n": 217, "stem": ["A user reports that their device is overheating after recently installing several applications. They also notice several pop-ups. Which of the following should a technician do to troubleshoot this issue?"], "opts": [{"k": "A", "t": "Close all programs and restart the device."}, {"k": "B", "t": "Run a malware scan on the device."}, {"k": "C", "t": "Check for any OS updates on the smartphone."}, {"k": "D", "t": "Determine If there are any hardware issues on the device."}], "ans": ["B"], "exp": "Overheating combined with pop-ups suggests potential malware activity consuming system resources. Running a malware scan helps identify and remove malicious applications causing the issue.", "src": "PDF"}, {"n": 218, "stem": ["A security administrator teaches all of an organization's staff members to use BitLocker To Go. Which of the following best describes the reason for this training?"], "opts": [{"k": "A", "t": "To ensure that all removable media is password protected in case of loss or theft"}, {"k": "B", "t": "To enable Secure Boot and a BIOS-level password to prevent configuration changes"}, {"k": "C", "t": "To enforce VPN connectivity to be encrypted by hardware modules"}, {"k": "D", "t": "To configure all laptops to use the TPM as an encryption factor for hard drives"}], "ans": ["A"], "exp": "BitLocker To Go is specifically designed to encrypt removable drives (USB flash drives, external HDDs). Training staff on its use guarantees that any data stored on such media requires a password (or recovery key) to access, protecting sensitive information if the device is lost or stolen.", "src": "PDF"}, {"n": 219, "stem": ["An end user sees frequent onscreen messages from a retail site they visited a week ago. A technician investigates and determines that the pop-up blocker is turned on. Which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Reset the browser to its default settings."}, {"k": "B", "t": "Turn off notifications in the browser."}, {"k": "C", "t": "Uninstall and reinstall the browser."}, {"k": "D", "t": "Clear the browser cache."}], "ans": ["B"], "exp": "Frequent onscreen messages from a previously visited site are most likely browser push notifications rather than traditional pop-ups. Disabling site notifications in the browser settings stops these messages without requiring a full browser reset or reinstallation.", "src": "PDF"}, {"n": 220, "stem": ["A technician is deploying a public-facing kiosk that will be used for a library directory. Which of the following account types should the IT team activate?"], "opts": [{"k": "A", "t": "Power user"}, {"k": "B", "t": "Domain"}, {"k": "C", "t": "Guest"}, {"k": "D", "t": "Service"}], "ans": ["C"], "exp": "A guest account is appropriate for a public-facing kiosk because it provides limited access for general users and helps restrict permissions to only what is needed for basic directory use.", "src": "PDF"}, {"n": 221, "stem": ["Which of the following is found in an SDS for a battery backup?"], "opts": [{"k": "A", "t": "Installation instructions"}, {"k": "B", "t": "Emergency procedures"}, {"k": "C", "t": "Configuration steps"}, {"k": "D", "t": "Voltage specifications"}], "ans": ["B"], "exp": "A Safety Data Sheet contains information about hazards, handling, storage, and emergency procedures related to a product. For a battery backup, it includes guidance on what to do in case of exposure, leaks, spills, or other hazardous situations.", "src": "PDF"}, {"n": 222, "stem": ["Which of the following is typically associated with a Linux filesystem?"], "opts": [{"k": "A", "t": "FAT32"}, {"k": "B", "t": "XFS"}, {"k": "C", "t": "NTFS"}, {"k": "D", "t": "APFS"}], "ans": ["B"], "exp": "XFS is a high-performance filesystem commonly used in Linux environments.", "src": "PDF"}, {"n": 223, "stem": ["A project team needs special access on a shared repository to add new content, edit existing content, and prevent content deletion. Which of the following should an administrator do to configure this setup with the least amount of effort?"], "opts": [{"k": "A", "t": "Map the network folder on each user's workstation for controlled access."}, {"k": "B", "t": "Create and assign a security group with adequate permissions"}, {"k": "C", "t": "Grant administrative permissions to the team."}, {"k": "D", "t": "Apply the required permissions to each individual user."}], "ans": ["B"], "exp": "Creating and assigning a security group allows the administrator to manage permissions centrally, granting the required access to all team members efficiently with minimal effort.", "src": "PDF"}, {"n": 224, "stem": ["A technician needs to apply a settings file to all user workstations. Which of the following tools should the technician use to import the file?"], "opts": [{"k": "A", "t": "lusrmgr.msc"}, {"k": "B", "t": "devmgmt.msc"}, {"k": "C", "t": "regedit.exe"}, {"k": "D", "t": "msconfig.exe"}], "ans": ["C"], "exp": "regedit.exe allows importing a settings file (such as a .reg file) into the Windows Registry so the configuration applies to all user workstations.", "src": "PDF"}, {"n": 225, "stem": ["A technician needs to configure laptops so that only administrators can enable virtualization technology if needed. Which of the following should the technician configure?"], "opts": [{"k": "A", "t": "BIOS password"}, {"k": "B", "t": "Guest account"}, {"k": "C", "t": "Screen lock"}, {"k": "D", "t": "AutoRun setting"}], "ans": ["A"], "exp": "Setting a BIOS (or UEFI) supervisor password restricts access to firmware settings, including enabling or disabling virtualization technology. Only those with the password - presumably administrators - ca n enter the BIOS setup and make that change.", "src": "PDF"}, {"n": 226, "stem": ["Which of the following malware types typically has very high computing resource usage?"], "opts": [{"k": "A", "t": "Rootkit"}, {"k": "B", "t": "Cryptominer"}, {"k": "C", "t": "Boot sector virus"}, {"k": "D", "t": "Trojan"}], "ans": ["B"], "exp": "Cryptominer malware uses significant computing resources to mine crypto currency, resulting in very high resource usage.", "src": "PDF"}, {"n": 227, "stem": ["A network engineer is dealing with an emergency situation in which a wired network connection needs to be replaced. A facility manager tells the network engineer that the current connection goes underneath a carpet and must be rerouted. Which of the following is the best reason to reroute this connection?"], "opts": [{"k": "A", "t": "Appropriate cable management removes a hazard."}, {"k": "B", "t": "Cleaning with a vacuum will create static electricity."}, {"k": "C", "t": "Labels for the cable routing are not appropriately displayed."}, {"k": "D", "t": "Walking over the cable can create intermittent issues."}], "ans": ["A"], "exp": "Runnin
