:root{--navy:#0A5F91;--deep:#10293B;--gold:#F5BD2D;--navy-t:#E8F1F8;--gold-t:#FEF6E0;--ink:#1F2933;--muted:#5B6B79;--line:#D9E2EA;--ok:#1E8E5A;--ok-t:#E5F5EC;--bad:#C0392B;--bad-t:#FBEAEA}
*{box-sizing:border-box}
body{margin:0;font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;background:#F3F6F9;color:var(--ink);font-size:16px}
header.top{background:var(--deep);color:#fff;border-bottom:4px solid var(--gold);display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:5}
.logo-card{background:#fff;border-radius:10px;padding:4px 8px;display:flex}.logo-card img{height:34px}
header .ttl{font-weight:800;font-size:17px;flex:1}header .ttl small{display:block;font-weight:400;font-size:12px;opacity:.85}
.timer{background:var(--navy);border:2px solid var(--gold);border-radius:10px;padding:4px 14px;font-weight:800;font-size:20px;direction:ltr;min-width:120px;text-align:center}
.timer.low{background:var(--bad)}
main{max-width:1150px;margin:18px auto;padding:0 14px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(16,41,59,.08);padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;right:0;left:0;height:6px;background:linear-gradient(90deg,var(--gold) 0 30%,var(--navy) 30%)}
h1{color:var(--deep);font-size:28px;margin:6px 0}h2{color:var(--navy);font-size:22px;margin:4px 0 10px}
.notice{background:var(--gold-t);border-right:6px solid var(--gold);padding:12px 16px;border-radius:10px;font-weight:700;margin:12px 0}
.btn{font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:10px;padding:10px 20px;cursor:pointer;background:var(--navy);color:#fff}
.btn:hover{filter:brightness(1.1)}.btn.gold{background:var(--gold);color:var(--deep)}.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.exam-tile{border:2px solid var(--line);border-radius:14px;padding:16px}.exam-tile h3{margin:0 0 6px;color:var(--deep)}
table.info{border-collapse:collapse;width:100%}table.info td{padding:7px 10px;border-bottom:1px solid var(--line)}table.info td:first-child{font-weight:700;color:var(--navy);width:40%}
ul.rules li{margin:5px 0}
.layout{display:grid;grid-template-columns:1fr 250px;gap:16px}
@media(max-width:850px){.layout{grid-template-columns:1fr}}
.qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pill{background:var(--navy-t);color:var(--navy);border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
.pill.gold{background:var(--gold-t);color:#8a6200}
.qtext{direction:ltr;text-align:left;font-family:"Segoe UI",Arial,"Cairo",sans-serif;line-height:1.6;font-size:16px}
.qtext p{margin:0 0 10px}.qtext p.ask{font-weight:700}
details.case{background:#F7FAFC;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;direction:rtl}
details.case summary{cursor:pointer;font-weight:700;color:var(--navy)}
details.case .qtext{max-height:340px;overflow:auto;margin-top:8px;font-size:15px;color:#33414d}
.exhibit{margin:10px 0;text-align:center}.exhibit img{max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
.choose{direction:rtl;font-weight:800;color:var(--bad);margin:6px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;direction:ltr;text-align:left;font-family:"Segoe UI",Arial,"Cairo",sans-serif}
.opt:hover{border-color:var(--navy)}.opt.sel{border-color:var(--navy);background:var(--navy-t)}
.opt .k{font-weight:800;color:var(--navy);min-width:22px}
.opt input{margin-top:5px}
.opt.correct{border-color:var(--ok);background:var(--ok-t)}.opt.wrong{border-color:var(--bad);background:var(--bad-t)}
.opt .tag{margin-left:auto;font-family:"Cairo";font-size:13px;font-weight:700;white-space:nowrap}
.navrow{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.nav h4{margin:0 0 8px;color:var(--deep)}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;direction:ltr}
.nb{font-family:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 0;cursor:pointer;font-weight:700;position:relative}
.nb.ans{background:var(--navy);color:#fff}.nb.cur{outline:3px solid var(--gold)}.nb.flag:after{content:"⚑";position:absolute;top:-6px;right:-3px;color:var(--bad);font-size:13px}
.nb.locked{opacity:.35;cursor:not-allowed}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.flagbtn.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.revlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.revitem{border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer}.revitem.un{border-color:var(--bad);background:var(--bad-t)}.revitem.fl{border-color:var(--gold);background:var(--gold-t)}
.score{font-size:48px;font-weight:800;color:var(--navy)}
.bar{height:16px;background:var(--line);border-radius:999px;overflow:hidden;position:relative;direction:ltr}.bar i{display:block;height:100%;background:var(--navy)}.bar b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--gold)}
.pass{padding:10px 14px;border-radius:10px;font-weight:700}.pass.ok{background:var(--ok-t);color:var(--ok)}.pass.no{background:var(--bad-t);color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.filters .btn{padding:6px 14px}.filters .btn.act{background:var(--gold);color:var(--deep)}
.rq{border-right:6px solid var(--ok)}.rq.bad{border-right-color:var(--bad)}
.exp{background:#F7FAFC;border-radius:8px;padding:10px;margin-top:8px}
.big{font-size:56px;font-weight:800;color:var(--navy);direction:ltr}
.hidden{display:none}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}#zoom img{max-width:96vw;max-height:94vh}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
</style>
<style>/* ABAD: back link (hidden while exam timer runs) */.abad-back{background:var(--gold);color:#10293b;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;text-decoration:none;white-space:nowrap}.timer:not(.hidden)~.abad-back{display:none}@media(max-width:520px){.abad-back{font-size:12px;padding:5px 10px}}</style>
<style id="sp-hero-css">/* ITIL-style welcome (shared design) */
.sp-hero{text-align:center;padding:0!important}.sp-hero:before{display:none}
.sp-hero .band{height:8px;background:linear-gradient(90deg,var(--gold) 0 33%,var(--navy) 33% 100%)}
.sp-hero .body{padding:34px 34px 30px}
.sp-hero .logo-row{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:10px}
.sp-hero .logo-big{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 22px}
.sp-hero .logo-big img{height:86px;display:block}.sp-hero .logo-big.vend img{height:86px}
.sp-hero .sep{width:2px;height:70px;background:var(--line);border-radius:2px}
.sp-hero .greet{color:var(--navy);font-weight:800;font-size:21px;margin:4px 0 2px}
.sp-hero h1{margin:6px 0 0;font-size:40px;line-height:1.35;color:var(--deep);font-weight:900}
.sp-hero .en-title{font-size:19px;color:#b8860b;font-weight:800;margin:2px 0 18px;direction:ltr}
.sp-hero .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:8px 0 22px}
.sp-hero .fact{background:var(--navy-t);border-radius:14px;padding:10px 18px;min-width:130px}
.sp-hero .fact b{display:block;font-size:26px;color:var(--navy);line-height:1.2;font-weight:900}
.sp-hero .fact span{font-size:13.5px;color:var(--muted);font-weight:600}
.sp-hero .fact.gold{background:var(--gold-t)}.sp-hero .fact.gold b{color:#b8860b}
.sp-hero .notice{background:var(--gold-t);border:1px solid #F3D27A;border-right:6px solid var(--gold);border-radius:12px;padding:12px 18px;text-align:start;font-size:14.5px;font-weight:400;color:#4d3f12;margin:0 0 20px;line-height:1.8}
.sp-hero .notice b{color:var(--deep)}
.sp-hero .en{display:block;font-size:12.5px;font-weight:600;opacity:.9;direction:ltr;text-align:left;unicode-bidi:isolate;margin-top:4px}
.sp-hero .en.in{display:inline;font-size:.72em;margin-inline-start:6px}
.sp-hero .welcome-rules{text-align:start;margin:0 0 22px}
.sp-hero .welcome-rules h3{margin:0 0 12px;color:var(--deep);font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp-hero .welcome-rules h3::before{content:"";width:6px;height:22px;background:var(--gold);border-radius:3px}
.sp-hero ul.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:1fr 1fr}
.sp-hero ul.rules li{display:flex;gap:12px;align-items:flex-start;background:#F8FAFC;border:1px solid #E6EDF3;border-radius:12px;padding:10px 14px;margin:0}
.sp-hero .rules .ic{flex:0 0 38px;height:38px;border-radius:10px;background:var(--navy-t);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:15px}
.sp-hero .rules li.k .ic{background:var(--gold-t);color:#b8860b}
.sp-hero .rules b{color:var(--deep)}
.sp-hero .rules small{display:block;color:var(--muted);font-size:13.5px;line-height:1.6}
.sp-hero .rules small.e{direction:ltr;text-align:left;unicode-bidi:isolate}
.sp-hero .src{font-size:13px;color:var(--muted);text-align:start;margin:0 0 18px}
.sp-hero .btn-xl{font-size:22px;padding:14px 64px;min-height:62px;border-radius:16px}
@media (max-width:760px){.sp-hero ul.rules{grid-template-columns:1fr}.sp-hero .body{padding:22px 16px}.sp-hero h1{font-size:31px}.sp-hero .en-title{font-size:15.5px}.sp-hero .logo-big img,.sp-hero .logo-big.vend img{height:62px}.sp-hero .fact{min-width:0;flex:1 1 40%;padding:8px 10px}.sp-hero .fact b{font-size:22px}}

const QS=[{"n": 1, "stem": ["A company's IT department discovers that unauthorized software has been installed on several workstations. The IT manager requests a review and an update of the workstation security posture, focusing on preventing future unauthorized software installations. Which of the following should the company do?"], "opts": [{"k": "A", "t": "Remove account administrative rights."}, {"k": "B", "t": "Turn on the workstation firewall."}, {"k": "C", "t": "Enable Windows Defender SmartScreen."}, {"k": "D", "t": "Install EDR on all devices."}], "ans": ["A"], "exp": "Removing administrative rights from standard user accounts prevents users from installing unauthorized software. Limiting elevated privileges enforces the principle of least privilege and directly reduces the ability to install unapproved applications on workstations.", "src": "PDF"}, {"n": 2, "stem": ["A company wants to enforce the following: - Administrators can add URLs to the Trusted URL list. - Passwords will not be stored through the browser. - When the browser is closed, all history will be saved. - Security of the browser will be set to high. - Specific URLs or ratings will be restricted from access. Which of the following is the best for the technician to configure?"], "opts": [{"k": "A", "t": "Group Policy"}, {"k": "B", "t": "Web gateway"}, {"k": "C", "t": "Browser policy"}, {"k": "D", "t": "Web proxy"}], "ans": ["A"], "exp": "Group Policy allows centralized enforcement of browser security and usage settings across managed systems, including trusted sites management, password storage restrictions, security level configuration, browsing history behavior, and access control to specific URLs or content categories.", "src": "PDF"}, {"n": 3, "stem": ["A user regularly connects their laptop to public Wi-Fi networks. The user wants to block their laptop from responding to all pingrequests. Which of the following features fulfills this purpose?"], "opts": [{"k": "A", "t": "Internet Options"}, {"k": "B", "t": "Windows Defender Firewall"}, {"k": "C", "t": "Network and Sharing Center"}, {"k": "D", "t": "Virtual Private Networking"}], "ans": ["B"], "exp": "Windows Defender Firewall can block inbound ICMP echo (ping) requests, preventing the laptop from responding on public Wi-Fi networks.", "src": "PDF"}, {"n": 4, "stem": ["A customer calls the help desk to report issues with internet connectivity. The customer is frustrated because they have already spoken to other representatives who were unable to resolve their issue. A help desk technician quickly reviews the customer's file and notices several prior unresolved tickets. Which of the following actions should the technician take to communicate with the customer properly and professionally?"], "opts": [{"k": "A", "t": "Ask the customer to clarify the issue right away."}, {"k": "B", "t": "Escalate the issue to a higher-level support team without further conversation."}, {"k": "C", "t": "Listen to the customer's concerns and acknowledge their frustrations."}, {"k": "D", "t": "Explain to the customer that the previous technicians were following standard procedure."}], "ans": ["C"], "exp": "Actively listening to the customer and acknowledging their frustration demonstrates empathy and professionalism. This helps de-escalate the situation, builds rapport, and creates a more cooperative environment for resolving the issue.", "src": "PDF"}, {"n": 5, "stem": ["Which of the following script types requires that the system mode is set to Unrestricted to run unsigned scripts?"], "opts": [{"k": "A", "t": ".js"}, {"k": "B", "t": ".py"}, {"k": "C", "t": ".ps1"}, {"k": "D", "t": ".bat"}], "ans": ["C"], "exp": "PowerShell scripts (.ps1) require the execution policy to be set to Unrestricted (or another permissive level) to run unsigned scripts.", "src": "PDF"}, {"n": 6, "stem": ["A Microsoft OS laptop user requests an alternative log-in authentication method because they have forgotten their password multiple times. Which of the following should a technician enable to satisfy this request?"], "opts": [{"k": "A", "t": "Single sign-on"}, {"k": "B", "t": "Windows Hello"}, {"k": "C", "t": "BitLocker"}, {"k": "D", "t": "User Account Control"}], "ans": ["B"], "exp": "Windows Hello provides alternative authentication methods, such as facial recognition, fingerprint, or PIN, which can help users who frequently forget their passwords.", "src": "PDF"}, {"n": 7, "stem": ["A customer reports that a computer is displaying pop-ups and making unexpected sounds. Which of the following should a technician do before remediating this issue?"], "opts": [{"k": "A", "t": "Back up the customer's data."}, {"k": "B", "t": "Update the OS."}, {"k": "C", "t": "Reimage the workstation."}, {"k": "D", "t": "Quarantine the machine."}], "ans": ["D"], "exp": "Quarantining the machine prevents the potential spread of malware or malicious activity before attempting remediation.", "src": "PDF"}, {"n": 8, "stem": ["A user receives a notification indicating the antivirus protection on a company laptop is out of date. A technician is able to ping the user's laptop. The technician checks the antivirus parent servers and sees the latest signatures have been installed. The technician then checks the user's laptop and finds the antivirus engine and definitions are current. Which of the following has most likely occurred?"], "opts": [{"k": "A", "t": "Ransomware"}, {"k": "B", "t": "Failed OS updates"}, {"k": "C", "t": "Adware"}, {"k": "D", "t": "Missing system files"}], "ans": ["D"], "exp": "Missing or corrupted system files can cause false notifications or errors, such as an incorrect message that antivirus protection is out of date even when it is current.", "src": "PDF"}, {"n": 9, "stem": ["A user receives a text message that tells them they need to click a link to update their payment information for an unpaid toll. Which of the following is this an example of?"], "opts": [{"k": "A", "t": "Whaling"}, {"k": "B", "t": "Spoofing"}, {"k": "C", "t": "Smishing"}, {"k": "D", "t": "Vishing"}], "ans": ["C"], "exp": "Smishing is a phishing attack delivered through SMS or text messaging. The message attempts to trick the user into clicking a malicious link and entering payment information.", "src": "PDF"}, {"n": 10, "stem": ["A desktop technician is mapping a remote windows share \\\\WinNAS\\sharedas a local disk z:. Which of the following commands should the technician run?"], "opts": [{"k": "A", "t": "nslookup -opt Z: \\\\WinNAS\\shared"}, {"k": "B", "t": "net use Z: \\\\WinNAS\\shared"}, {"k": "C", "t": "chkdsk /R Z: \\\\WinNAS\\shared"}, {"k": "D", "t": "sfc /offwindir Z: \\\\WinNAS\\shared"}], "ans": ["B"], "exp": "The correct command to map a network share as a local drive letter is net use Z: \\\\WinNAS\\shared.", "src": "PDF"}, {"n": 11, "stem": ["Multiple users clicked a phishing link from a compromised email account. The security team isolates and removes the threat. Then, the management team provides security awareness training to the company. What step is this?"], "opts": [{"k": "A", "t": "Provide user education."}, {"k": "B", "t": "Compile lessons learned."}, {"k": "C", "t": "Update the antivirus software."}, {"k": "D", "t": "Perform additional scans."}], "ans": ["A"], "exp": "This is part of the user education step after a security incident to prevent future occurrences.", "src": "PDF"}, {"n": 12, "stem": ["Which of the following is used in addition to a password to implement MFA?"], "opts": [{"k": "A", "t": "Sending a code to the user's phone"}, {"k": "B", "t": "Verifying the user's date of birth"}, {"k": "C", "t": "Prompting the user to solve a simple math problem"}, {"k": "D", "t": "Requiring the user to enter a PIN"}], "ans": ["A"], "exp": "Multi-factor authentication (MFA) combines at least two of the following factors: something you know (password), something you have (a phone-generated or SMS-delivered one-time code), and something you are (biometric). Sending a code to the user's phone provides a \"something you have\" factor in addition to the password.", "src": "PDF"}, {"n": 13, "stem": ["A technician must map a network drive on a piece of legacy equipment running an end-of-life OS. Which of the following is the best script to map the drive using simple Windows commands?"], "opts": [{"k": "A", "t": "Shell"}, {"k": "B", "t": "Batch"}, {"k": "C", "t": "VB"}, {"k": "D", "t": "Java"}], "ans": ["B"], "exp": "A batch script is the best choice for mapping a network drive using simple Windows commands because it can execute command-line instructions like net use in legacy and modern Windows environments.", "src": "PDF"}, {"n": 14, "stem": ["A user is unable to access an external vendor website from the corporate network. Which of the following Windows command-line tools should a technician use to determine where the issue is potentially occurring?"], "opts": [{"k": "A", "t": "ipconfig"}, {"k": "B", "t": "nslookup"}, {"k": "C", "t": "ping"}, {"k": "D", "t": "tracert"}], "ans": ["D"], "exp": "The tracert command traces the route packets take to reach a destination and displays each hop along the path. This allows the technician to identify where communication is failing between the corporate network and the external vendor website.", "src": "PDF"}, {"n": 15, "stem": ["Which of the following authentication methods is the best way to prevent users from frequently entering their credentials?"], "opts": [{"k": "A", "t": "Access control list"}, {"k": "B", "t": "Single sign-on"}, {"k": "C", "t": "Multifactor authentication"}, {"k": "D", "t": "One-time password"}], "ans": ["B"], "exp": "Single sign-on (SSO)allows users to authenticate once and gain access to multiple systems without reentering credentials, which significantly enhances user convenience while maintaining security.", "src": "PDF"}, {"n": 16, "stem": ["A technician is setting up a computer for a new user. A requirement is that the user's documents are stored on a network location and not locally on the computer. Which of the following should the technician configure?"], "opts": [{"k": "A", "t": "File attributes"}, {"k": "B", "t": "User Account Control"}, {"k": "C", "t": "Security groups"}, {"k": "D", "t": "Folder redirection"}], "ans": ["D"], "exp": "Folder redirection is used to automatically store user documents on a network location instead of the local computer.", "src": "PDF"}, {"n": 17, "stem": ["A company computer is being repurposed within an organization. The existing configuration has a static IP address, but it is no longer required. Which of the following should a technician do to satisfy the network requirements?"], "opts": [{"k": "A", "t": "Make a DHCP reservation for the computer"}, {"k": "B", "t": "Create an exclusion in the existing IP scheme"}, {"k": "C", "t": "Switch the NIC settings from manual to automatic"}, {"k": "D", "t": "Change the currently assigned static IP"}], "ans": ["C"], "exp": "Switching the NIC settings from manual to automatic allows the computer to obtain its IP configuration dynamically from DHCP, which is appropriate when a static IP address is no longer required.", "src": "PDF"}, {"n": 18, "stem": ["Which of the following tools should a technician use in macOS to restore an older version of a file?"], "opts": [{"k": "A", "t": "Disk Utility"}, {"k": "B", "t": "FileVault"}, {"k": "C", "t": "Spotlight"}, {"k": "D", "t": "Time Machine"}], "ans": ["D"], "exp": "Time Machine is the macOS backup and recovery tool used to restore older versions of files or recover deleted data.", "src": "PDF"}, {"n": 19, "stem": ["Which of the following is used to store passwords in macOS?"], "opts": [{"k": "A", "t": "FileVault"}, {"k": "B", "t": "Keychain"}, {"k": "C", "t": "Accessibility"}, {"k": "D", "t": "Mission Control"}], "ans": ["B"], "exp": "Keychain is the built-in macOS utility that manages and stores credentials, including passwords and certificates.", "src": "PDF"}, {"n": 20, "stem": ["A company is implementing the 3-2-1 backup rule. Which of the following should the company do?"], "opts": [{"k": "A", "t": "Perform both full and differential backups."}, {"k": "B", "t": "Test the backup integrity every three weeks."}, {"k": "C", "t": "Keep all backup media on site for fast recovery."}, {"k": "D", "t": "Use at least two different types of media."}], "ans": ["D"], "exp": "The 3-2-1 backup rule recommends keeping at least two different types of media to ensure data redundancy and protection.", "src": "PDF"}, {"n": 21, "stem": ["Which of the following threats is shoulder surfing an example of?"], "opts": [{"k": "A", "t": "Zero-day"}, {"k": "B", "t": "Evil twin"}, {"k": "C", "t": "Social engineering"}, {"k": "D", "t": "Brute-force"}], "ans": ["C"], "exp": "Shoulder surfing is a social engineering threat because the attacker captures sensitive information by observing the user's actions, relying on human behavior rather than exploiting a technical vulnerability.", "src": "PDF"}, {"n": 22, "stem": ["An end user wants to have a sales printer added to their computer. The printer is on the domain. Which of the following is the best method for the technician to add the printer?"], "opts": [{"k": "A", "t": "Go to the print server and select the printer name"}, {"k": "B", "t": "Connect the laptop to the printer via USB"}, {"k": "C", "t": "Connect to the printer via Bluetooth"}, {"k": "D", "t": "Go to Local Users and Groups to add the printer"}], "ans": ["A"], "exp": "Selecting the printer from the print server is the best method for adding a domain printer to a user's computer.", "src": "PDF"}, {"n": 23, "stem": ["A technician replaces a motherboard in a desktop computer. Alter reassembling the system and turning it on, the computer tails to start, and no display output is shown. The power supply fan and case fans are working, but there are no beep codes or POST messages. Which of the following should the technician do first to make the computer turn on properly?"], "opts": [{"k": "A", "t": "Replace the power supply with a higher wattage unit."}, {"k": "B", "t": "Ensure that the CPU power connector is properly installed."}, {"k": "C", "t": "Update the BIOS/UEFI firmware."}, {"k": "D", "t": "Reseat the memory modules."}], "ans": ["B"], "exp": "If fans spin but there is no POST or display after a motherboard replacement, a common cause is the CPU not receiving power. Verifying the CPU power connector (such as the 4-pin or 8-pin EPS connector) ensures the processor is powered and allows the system to start properly.", "src": "PDF"}, {"n": 24, "stem": ["A customer's computer does not have an active connection to the network. A technician goes through a few troubleshooting steps but is unable to resolve the issue. The technician has exhausted their knowledge. The customer expresses frustration at the time taken to resolve this issue. Which of the following should the technician do?"], "opts": [{"k": "A", "t": "Escalate the issue to a senior team member and provide next steps to the customer."}, {"k": "B", "t": "Dismiss the customer and reschedule another troubleshooting session at a later date."}, {"k": "C", "t": "Interrupt the customer and express that troubleshooting support tickets can take time."}, {"k": "D", "t": "Maintain a positive attitude and continue to ask questions regarding the scope of the issue."}], "ans": ["A"], "exp": "When you've exhausted your troubleshooting expertise and the customer is frustrated, the appropriate next step is to escalate the ticket to a more experienced technician or specialized team. At the same time, communicate clearly to the customer what you're doing and what they can expect next. This maintains transparency, manages expectations, and ensures the issue is resolved as quickly as possible.", "src": "PDF"}, {"n": 25, "stem": ["Which of the following types of malware would most likely be detected when observing unusually high CPU usage?"], "opts": [{"k": "A", "t": "Keylogger"}, {"k": "B", "t": "Trojan"}, {"k": "C", "t": "Cryptominer"}, {"k": "D", "t": "Rootkit"}], "ans": ["C"], "exp": "Cryptominer malware uses the computer's processing power to mine cryptocurrency, which commonly causes unusually high CPU usage, slow performance, overheating, and increased fan activity.", "src": "PDF"}, {"n": 26, "stem": ["A user created a file on a shared drive and wants to prevent its data from being accidentally deleted by others. Which of the following applications should the technician use to assist the user with hiding the file?"], "opts": [{"k": "A", "t": "Device Manager"}, {"k": "B", "t": "Indexing Options"}, {"k": "C", "t": "File Explorer"}, {"k": "D", "t": "Administrative Tools"}], "ans": ["C"], "exp": "File Explorer allows the user to modify file attributes, such as hiding the file, to help prevent accidental deletion by others.", "src": "PDF"}, {"n": 27, "stem": ["A developer needs to isolate a testing VM in a Type 1 hypervisor from the other guests. Which of the following does the administrator need to use to accomplish this task?"], "opts": [{"k": "A", "t": "VDI"}, {"k": "B", "t": "Container"}, {"k": "C", "t": "Private cloud"}, {"k": "D", "t": "Sandbox"}], "ans": ["D"], "exp": "A sandbox provides an isolated environment within the hypervisor where a virtual machine can run independently without affecting other guests, ensuring safe testing and containment.", "src": "PDF"}, {"n": 28, "stem": ["A help desk team was alerted that a company-owned cell phone has an unrecognized password- cracking application. Which of the following should the help desk team do to prevent further unauthorized installations from occurring?"], "opts": [{"k": "A", "t": "Configure Group Policy."}, {"k": "B", "t": "Implement PAM."}, {"k": "C", "t": "Install anti-malware software."}, {"k": "D", "t": "Deploy MDM."}], "ans": ["D"], "exp": "A Mobile Device Management (MDM) solution lets administrators enforce app-installation policies - whitelisting approved applications and blocking all others. By deploying MDM, the help desk can centrally control which apps users may install on company-owned phones, preventing unauthorized tools from being added in the future.", "src": "PDF"}, {"n": 29, "stem": ["After a technician installs a new network printer, the technician discovers that one of the printer features is not available. Which of the following should the technician do first?"], "opts": [{"k": "A", "t": "Update the firmware."}, {"k": "B", "t": "Contact the manufacturer for assistance."}, {"k": "C", "t": "Enable IPv6"}, {"k": "D", "t": "Connect the printer with a USB cable."}], "ans": ["A"], "exp": "Updating the firmware ensures the printer is running the latest software, which can enable missing features and resolve compatibility or functionality limitations.", "src": "PDF"}, {"n": 30, "stem": ["A technician is setting up a surveillance system for a customer. The customer wants access to the system's web interface on the LAN via the system's IP address. Which of the following should the technician use to prevent external log-in attempts from the internet?"], "opts": [{"k": "A", "t": "Port mapping"}, {"k": "B", "t": "Subnetting"}, {"k": "C", "t": "Static IP"}, {"k": "D", "t": "Content filtering"}], "ans": ["A"], "exp": "By using port mapping (NAT) rules on the router, you can choose to forward the surveillance system's HTTP/HTTPS ports only on the LAN interface and leave them closed on the WAN side. This ensures users on the local subnet can access the camera interface via its IP address, while external login attempts from the internet are blocked.", "src": "PDF"}, {"n": 31, "stem": ["A technician is troubleshooting an issue in which a service runs momentarily and stops at certain points in the process. The technician needs to determine the root cause of this issue. Which of the following tools should the technician use?"], "opts": [{"k": "A", "t": "Event Viewer"}, {"k": "B", "t": "Task Manager"}, {"k": "C", "t": "Internet Options"}, {"k": "D", "t": "Process Explorer"}], "ans": ["A"], "exp": "Event Viewer logs system, application, and service events, including errors and warnings when a service stops unexpectedly. Reviewing these logs provides detailed error codes and messages that help identify the root cause of the service interruptions.", "src": "PDF"}, {"n": 32, "stem": ["An administrator is investigating a zero-day vulnerability. If left unpatched, it could severely impact business. The patch requires downtime. What should the administrator do?"], "opts": [{"k": "A", "t": "Create a standard change request."}, {"k": "B", "t": "Implement an emergency change."}, {"k": "C", "t": "Immediately freeze all changes."}, {"k": "D", "t": "Continue operations until the next change interval."}], "ans": ["B"], "exp": "A zero-day vulnerability demands an emergency change to quickly secure the system, even if downtime is needed.", "src": "PDF"}, {"n": 33, "stem": ["A specialist needs to configure a computer so that it will not boot up using any non-trusted or unsigned external devices that are connected to the computer. Which of the following should the specialist configure?"], "opts": [{"k": "A", "t": "BIOS password"}, {"k": "B", "t": "Secure Boot"}, {"k": "C", "t": "USB settings"}, {"k": "D", "t": "Single sign-on"}], "ans": ["B"], "exp": "Secure Boot ensures that only trusted and digitally signed firmware and bootloaders are allowed during the startup process, preventing the system from booting from unauthorized or unsigned external devices.", "src": "PDF"}, {"n": 34, "stem": ["A help desk support technician needs to ensure that the documentation for a software deployment is up to date. The documentation must also include all necessary information for future troubleshooting. Which of the following should the technician include in the documentation?"], "opts": [{"k": "A", "t": "Detailed guides for resolving common issues"}, {"k": "B", "t": "Email logs of support queries"}, {"k": "C", "t": "Contact information for software vendors"}, {"k": "D", "t": "Installation manuals for end users"}], "ans": ["A"], "exp": "Documentation for future troubleshooting should include clear procedures for resolving common issues. This helps technicians quickly identify known problems, apply proven fixes, and maintain consistent support during and after the software deployment.", "src": "PDF"}, {"n": 35, "stem": ["A user brings their personal laptop into the office. They connect their computer to the docking station. When the user tries to use a search engine, the page displays the following message: This device is quarantined and is not connected to the domain. Contact the IT administrator for further assistance. Which of the following is most likely the issue?"], "opts": [{"k": "A", "t": "The docking station Ethernet cable is unplugged."}, {"k": "B", "t": "Network resources are blocked."}, {"k": "C", "t": "Malware is present."}, {"k": "D", "t": "The URL was entered incorrectly."}], "ans": ["B"], "exp": "The message indicates the device has been placed into a network quarantine because it is not a domain-joined or authorized system. In this state, network resources are blocked, and the device is isolated until IT approves or remediates it.", "src": "PDF"}, {"n": 36, "stem": ["After clicking on an advertisement, a user reports that their browser is slow. A technician looks at the network connections for the machine and notices a large number of outbound connections. Which of the following actions should the technician take next?"], "opts": [{"k": "A", "t": "Enable the firewall."}, {"k": "B", "t": "Run antivirus scans."}, {"k": "C", "t": "Reboot the computer."}, {"k": "D", "t": "Quarantine the system."}], "ans": ["D"], "exp": "The technician should quarantine the system next to prevent potential malware from spreading or communicating with other systems, especially given the suspicious outbound connections.", "src": "PDF"}, {"n": 37, "stem": ["A user's workstation was infected with a newly discovered virus that the AV system detected. After a full virus scan and a workstation reboot, the virus is still present in the OS. Which of the following actions should the user take to remove the virus?"], "opts": [{"k": "A", "t": "Enable the system firewall."}, {"k": "B", "t": "Use bootable antivirus media to scan the system."}, {"k": "C", "t": "Download software designed to specifically target the virus."}, {"k": "D", "t": "Run the operating system update process."}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 38, "stem": ["Which of the following methods would make data unrecoverable but allow the drive to be repurposed?"], "opts": [{"k": "A", "t": "Deleting the partitions"}, {"k": "B", "t": "Implementing EFS"}, {"k": "C", "t": "Performing a low-level format"}, {"k": "D", "t": "Degaussing the device"}], "ans": ["C"], "exp": "A low-level format (more accurately, a secure erase that overwrites all sectors with zeroes or random data) effectively wipes all data on the drive, making previous content unrecoverable while leaving the drive's structure intact for reuse. Unlike degaussing - which destroys the drive's magnetic media and renders it unusable - overwriting allows the drive to be repurposed safely.", "src": "PDF"}, {"n": 39, "stem": ["Which of the following filesystems is a successor to NTFS?"], "opts": [{"k": "A", "t": "ReFS"}, {"k": "B", "t": "XFS"}, {"k": "C", "t": "APFS"}, {"k": "D", "t": "exFAT"}], "ans": ["A"], "exp": "ReFS (Resilient File System) is the successor to NTFS, designed to improve data integrity, availability, and scalability on Windows systems.", "src": "PDF"}, {"n": 40, "stem": ["A user is attempting to open on a mobile phone a HD video that is hosted on a popular media streaming website. The user is receiving connection timeout errors. The mobile reception icon area is showing two bars next to 3G. Which of the following is the most likely cause of the issue?"], "opts": [{"k": "A", "t": "The user does not have Wi-Fi enabled."}, {"k": "B", "t": "The website's subscription has run out."}, {"k": "C", "t": "The bandwidth is not fast enough."}, {"k": "D", "t": "The mobile device storage is full."}], "ans": ["C"], "exp": "Streaming HD video requires substantial network throughput, typically several Mbps. With only a 3G connection showing two bars, the available bandwidth is likely too limited or inconsistent to sustain an HD stream, resulting in timeouts.", "src": "PDF"}, {"n": 41, "stem": ["A scammer is attempting to extract confidential information through phone calls. Which of the following best describes the social engineering attack that the scammer is using?"], "opts": [{"k": "A", "t": "Pretexting"}, {"k": "B", "t": "Phishing"}, {"k": "C", "t": "Whaling"}, {"k": "D", "t": "Vishing"}], "ans": ["D"], "exp": "Vishing is a voice-based social engineering attack that uses phone calls to trick a person into revealing confidential information.", "src": "PDF"}, {"n": 42, "stem": ["A user reports that their smartphone frequently displays pop-ups that warn of security threats and recommend tools to protect against them. After tapping one of the pop-ups, the user notices that the smartphone's battery drains faster. Which of the following should a technician recommend to resolve this issue?"], "opts": [{"k": "A", "t": "Clear the smartphone's browser cache and uninstall unknown applications."}, {"k": "B", "t": "Enable airplane mode and restart the smartphone."}, {"k": "C", "t": "Perform a factory reset on the smartphone."}, {"k": "D", "t": "Replace the SIM card and modify the network settings."}], "ans": ["A"], "exp": "Pop-ups warning of fake security threats and increased battery drain are common signs of adware or malicious applications. Clearing the browser cache and removing unknown or suspicious apps eliminates the source of the pop-ups and stops the background activity causing excessive battery usage.", "src": "PDF"}, {"n": 43, "stem": ["Which of the following data destruction methods is most appropriate to ensure that classified information on hard drives cannot be recovered?"], "opts": [{"k": "A", "t": "Overwriting with a software-based secure erase program"}, {"k": "B", "t": "Degaussing followed by physical shredding"}, {"k": "C", "t": "Formatting with a low-level format tool"}, {"k": "D", "t": "Encrypting the drives and storing them securely"}], "ans": ["B"], "exp": "Degaussing removes all magnetic data on the drive, and physical shredding ensures the remaining media cannot be reconstructed, making this combination the most secure method for destroying classified information.", "src": "PDF"}, {"n": 44, "stem": ["A high percentage of users at an office store documents on their local computers. The office needs to migrate to the next version of Windows. Which of the following methods should a technician use?"], "opts": [{"k": "A", "t": "Remote network install"}, {"k": "B", "t": "Zero-touch deployment"}, {"k": "C", "t": "In-place upgrades"}, {"k": "D", "t": "Clean install"}], "ans": ["C"], "exp": "An in-place upgrade preserves existing user data, applications, and settings while upgrading the operating system. Since many users store documents locally, this method minimizes data loss risk and reduces the need for extensive file restoration after the upgrade.", "src": "PDF"}, {"n": 45, "stem": ["When a user navigates to comptiaa.org, pop-up messages indicate that the computer is infected with adware. A technician scans the computer for malware and does not find an infection. Which of the following should the technician do before returning the computer to the user?"], "opts": [{"k": "A", "t": "Clear the browser's cached data and recent history."}, {"k": "B", "t": "Sign in to the company's cloud workspace application."}, {"k": "C", "t": "Install corporate DNS security software"}, {"k": "D", "t": "Enable private mode for using the internet."}], "ans": ["A"], "exp": "Clearing the browser's cached data and recent history removes malicious scripts or adware- related pop-ups stored in the cache, ensuring the issue is resolved before returning the computer.", "src": "PDF"}, {"n": 46, "stem": ["A user reports that the time on their computer does not match the time on their VoIP phone. What should a technician do?"], "opts": [{"k": "A", "t": "Confirm the user is logging in to the domain."}, {"k": "B", "t": "Manually set the time on the phone to match the computer."}, {"k": "C", "t": "Download and install the latest BIOS update."}, {"k": "D", "t": "Configure access to an available NTP server."}], "ans": ["D"], "exp": "This scenario involves a mismatch in device time settings, which can affect synchronization and authentication across the network. Using a Network Time Protocol (NTP) server ensures all networked devices maintain accurate and synchronized clocks.", "src": "PDF"}, {"n": 47, "stem": ["The screen of a previously working computer repeatedly displays an OS Not Founderror message when the computer is started. Only a USB drive, a keyboard, and a mouse are plugged into the computer. Which of the following should a technician do first?"], "opts": [{"k": "A", "t": "Run data recovery tools on the disk."}, {"k": "B", "t": "Partition the disk using the GPT format."}, {"k": "C", "t": "Check boot options."}, {"k": "D", "t": "Switch from UEFI to BIOS."}], "ans": ["C"], "exp": "An \"OS Not Found\" error most commonly indicates the system isn't booting from the correct device. Verifying and correcting the boot order (ensuring the internal hard drive is prioritized over USB or other entries) is the quickest first step before making any changes to the disk or firmware settings.", "src": "PDF"}, {"n": 48, "stem": ["After new device software for a webcam is installed, a Windows PC is experiencing BSOD. The BSOD occurs during a videoconference call. Which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Update the anti-malware signature and scan the system"}, {"k": "B", "t": "File a warranty claim with the manufacturer"}, {"k": "C", "t": "Start in Safe Mode and roll back the device driver"}, {"k": "D", "t": "Reconnect the webcam to the computer"}], "ans": ["C"], "exp": "Starting in safe mode and rolling back the device driver can resolve BSOD issues caused by newly installed or incompatible webcam drivers.", "src": "PDF"}, {"n": 49, "stem": ["A Windows user wants a filesystem that protects confidential data from attackers who have physical access to the system. Which of the following should the user choose?"], "opts": [{"k": "A", "t": "ext"}, {"k": "B", "t": "APFS"}, {"k": "C", "t": "FAT"}, {"k": "D", "t": "EFS"}], "ans": ["D"], "exp": "EFS (Encrypting File System) is a feature of Windows that provides filesystem-level encryption. It is designed to encrypt files and folders to protect them from unauthorized access, even if an attacker has physical access to the computer. ext: A filesystem type used primarily in Linux, without native encryption features for Windows. APFS: Apple's filesystem, used in macOS and iOS. FAT: A simple filesystem type with no encryption features. EFS: The correct choice for a Windows user needing to encrypt data at the filesystem level to protect against unauthorized physical access.", "src": "PDF"}, {"n": 50, "stem": ["A company's directory services server is located on premises. Which of the following best describes the directory services infrastructure?"], "opts": [{"k": "A", "t": "Hybrid cloud"}, {"k": "B", "t": "Private cloud"}, {"k": "C", "t": "Public cloud"}, {"k": "D", "t": "Community cloud"}], "ans": ["B"], "exp": "An on-premises directory services server is hosted and managed within the organization's own infrastructure, which aligns with a private cloud model where resources are dedicated and not shared with external organizations.", "src": "PDF"}, {"n": 51, "stem": ["An end user reports that their computer will not load Windows. Which of the following should a technician check after inspecting the computer hardware and verifying that it is working properly?"], "opts": [{"k": "A", "t": "Boot order"}, {"k": "B", "t": "Filesystem"}, {"k": "C", "t": "Encryption"}, {"k": "D", "t": "Drivers"}], "ans": ["A"], "exp": "If the hardware is functioning properly but Windows does not load, the technician should verify that the system is configured to boot from the correct drive. An incorrect boot order can prevent the system from locating the installed operating system.", "src": "PDF"}, {"n": 52, "stem": ["A technician fails to remediate ransomware on a Windows PC. The user is asking for the fastest path for the PC to become operational again. Which of the following actions should the technician take next?"], "opts": [{"k": "A", "t": "Educate the end user on safer browsing techniques."}, {"k": "B", "t": "Disable System Restore capability."}, {"k": "C", "t": "Reimage the system from a good backup."}, {"k": "D", "t": "Run optional Windows updates."}], "ans": ["C"], "exp": "Reimaging the system from a known-good backup is the fastest and most reliable way to restore full functionality after ransomware when remediation attempts have failed, ensuring all malicious components are completely removed.", "src": "PDF"}, {"n": 53, "stem": ["A systems administrator plans to upgrade a server to the latest operating system. Which of the following should the administrator do before placing a change request?"], "opts": [{"k": "A", "t": "Establish a scope"}, {"k": "B", "t": "Get change board approval"}, {"k": "C", "t": "Create a test environment"}, {"k": "D", "t": "Roll back any previous changes"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 54, "stem": ["Which of the following license types allows modification to an application's code?"], "opts": [{"k": "A", "t": "Open-source"}, {"k": "B", "t": "Enterprise"}, {"k": "C", "t": "Personal use"}, {"k": "D", "t": "Perpetual"}], "ans": ["A"], "exp": "Open-source licensing allows users to view and modify the application's source code, depending on the specific license terms.", "src": "PDF"}, {"n": 55, "stem": ["A SOHO customer purchases a Windows 11 computer. When the technician attempts to join the computer to the domain, the option is grayed out. Which of the following explains the reason the option is unavailable?"], "opts": [{"k": "A", "t": "The computer OS needs to be updated to the latest version."}, {"k": "B", "t": "Network settings need to be changed on the Pro edition of Windows."}, {"k": "C", "t": "The computer needs to be restarted to apply new group policies."}, {"k": "D", "t": "The computer operating system is Home edition."}], "ans": ["D"], "exp": "Windows Home edition does not support joining an Active Directory domain. Only Professional, Enterprise, and Education editions include domain join capabilities, which is why the option is unavailable.", "src": "PDF"}, {"n": 56, "stem": ["An end user is unable to print to a network printer but can access everything else on the network. Other users in the organization have no issues printing. A technician opens the print queue on the user's computer and sees the job has failed. Which of the following is the next step to troubleshoot the issue?"], "opts": [{"k": "A", "t": "Printing a test document from another computer on the network"}, {"k": "B", "t": "Restarting the print spooler from services"}, {"k": "C", "t": "Removing the printer from the computer and reinstalling it"}, {"k": "D", "t": "Starting the computer again and attempting to print again"}], "ans": ["B"], "exp": "Since other users can print and the job has failed in the local print queue, the issue is likely related to the print spooler service on the user's machine. Restarting the print spooler clears stalled jobs and resets the printing service, allowing new print jobs to process correctly.", "src": "PDF"}, {"n": 57, "stem": ["Which of the following is a protocol that provides AAA for network services?"], "opts": [{"k": "A", "t": "RADIUS"}, {"k": "B", "t": "Kerberos"}, {"k": "C", "t": "TKIP"}, {"k": "D", "t": "WPA3"}], "ans": ["A"], "exp": "RADIUS (Remote Authentication Dial-In User Service)provides centralized Authentication, Authorization, and Accounting (AAA) for users who connect and use a network service.", "src": "PDF"}, {"n": 58, "stem": ["A technician uses AI to draft a proposal about the benefits of new software. When reading the draft, the technician notices that the draft contains factually incorrect information. Which of the following best describes this scenario?"], "opts": [{"k": "A", "t": "Data privacy"}, {"k": "B", "t": "Hallucinations"}, {"k": "C", "t": "Appropriate use"}, {"k": "D", "t": "Plagiarism"}], "ans": ["B"], "exp": "When an AI model generates plausible-sounding but factually inaccurate or fabricated information, it's referred to as a \"hallucination.\" Identifying and correcting these errors is essential to ensure the accuracy and reliability of AI-assisted content.", "src": "PDF"}, {"n": 59, "stem": ["A user reports that double-clicking on an application's shortcut fails to launch a program. A technician thinks that the application process is running in the background in an unresponsive state. Which of the following tools should the technician use to resolve the issue?"], "opts": [{"k": "A", "t": "Resource Monitor"}, {"k": "B", "t": "Task Manager"}, {"k": "C", "t": "Event Viewer"}, {"k": "D", "t": "Registry Editor"}], "ans": ["B"], "exp": "Task Manager allows the technician to view running processes and terminate an unresponsive application process, enabling the program to be launched again properly.", "src": "PDF"}, {"n": 60, "stem": ["An application's performance is degrading over time. The application is slowing, but it never gives an error and does not crash. Which of the following tools should a technician use to start troubleshooting?"], "opts": [{"k": "A", "t": "Reliability history"}, {"k": "B", "t": "Computer management"}, {"k": "C", "t": "Resource monitor"}, {"k": "D", "t": "Disk"}], "ans": ["C"], "exp": "Resource Monitor provides real-time insights into CPU, memory, disk, and network usage by process. By observing which resources steadily increase or become bottlenecks over time, a technician can pinpoint leaks (e.g., memory), I/O contention, or other performance issues driving the slowdown.", "src": "PDF"}, {"n": 61, "stem": ["An organization is experiencing an increased number of issues. A technician notices applications that are not installed by default. Users are reporting an increased number of system prompts for software licensing. Which of the following would the security team most likely do to remediate the root cause?"], "opts": [{"k": "A", "t": "Deploy an internal PKI to filter encrypted web traffic."}, {"k": "B", "t": "Remove users from the local admin group."}, {"k": "C", "t": "Implement stronger controls to block suspicious websites."}, {"k": "D", "t": "Enable stricter UAC settings on Windows."}], "ans": ["B"], "exp": "When users have local administrative rights, they can install unauthorized applications - leading to licensing prompts, unsupported software, and potential security risks. By removing users from the local Administrators group, installations require elevated credentials, ensuring that only approved software is installed and reducing these recurring issues.", "src": "PDF"}, {"n": 62, "stem": ["When a user is in the office, web pages are loading slowly on the user's phone. Which of the following best explains this issue?"], "opts": [{"k": "A", "t": "Exceeded the data usage limit"}, {"k": "B", "t": "Sluggish response time"}, {"k": "C", "t": "Degraded network service"}, {"k": "D", "t": "Low storage space"}], "ans": ["C"], "exp": "Degraded network service in the office, such as weak Wi-Fi signal or network congestion, is the most likely reason web pages are loading slowly on the user's phone.", "src": "PDF"}, {"n": 63, "stem": ["An employee is trying to connect their company laptop to an airport's Wi-Fi during a business trip. Once the network is connected, a pop-up window appears with the airport logo, which the employee quickly closes. The internet connection is not working properly, and the employee cannot access any websites. Which of the following should a help desk technician suggest to the employee?"], "opts": [{"k": "A", "t": "Look for a wall socket with RJ45 and try to connect the laptop to it"}, {"k": "B", "t": "Contact the airport IT department"}, {"k": "C", "t": "Tell the employee that company policy prohibits connection to public Wi-Fi"}, {"k": "D", "t": "Reconnect to the network and read the pop-up carefully"}], "ans": ["D"], "exp": "Reconnecting to the network and reading the pop-up carefully is necessary because many public WiFi networks require users to interact with a captive portal (such as accepting terms) before providing internet access.", "src": "PDF"}, {"n": 64, "stem": ["A customer brings a recently purchased laptop back to the store. The customer states that the laptop is defective and requests a new unit. The service representative identifies that the laptop was damaged by liquids. Which of the following should the service representative most likely do first?"], "opts": [{"k": "A", "t": "Accept the defective laptop and provide a replacement."}, {"k": "B", "t": "Decline the request and report the case to the service manager."}, {"k": "C", "t": "Review applicable warranty and alternatives to manage special cases."}, {"k": "D", "t": "Escalate the issue to the manufacturer or legal department for further actions."}], "ans": ["C"], "exp": "Reviewing the warranty terms and applicable policies is the first step to determine coverage and appropriate next actions when damage is caused by the customer, ensuring proper handling according to company guidelines.", "src": "PDF"}, {"n": 65, "stem": ["A client is dissatisfied with the help desk and demands an immediate resolution for their unresolved ticket. Which of the following should the technician do first?"], "opts": [{"k": "A", "t": "Actively listen to the client's concerns while assuring them that their issue is a priority."}, {"k": "B", "t": "Redirect the client's call to a different department for further assistance."}, {"k": "C", "t": "Ask the client to submit a new support ticket to open a fresh case."}, {"k": "D", "t": "Politely end the call and contact a manager for further instructions."}], "ans": ["A"], "exp": "Actively listening to the client's concerns and reassuring them that their issue is a priority demonstrates professionalism and strong customer service. Addressing the client calmly and empathetically is the first step in de-escalating the situation and maintaining a positive support experience before taking further action.", "src": "PDF"}, {"n": 66, "stem": ["A technician is using a credential manager to safeguard a large number of credentials. Which of the following is important for using this application?"], "opts": [{"k": "A", "t": "Restricted log-in times"}, {"k": "B", "t": "Secure master password"}, {"k": "C", "t": "TPM module"}, {"k": "D", "t": "Windows lock screen"}], "ans": ["B"], "exp": "A credential manager encrypts and stores multiple credentials behind a single master password. Ensuring that this master password is strong and kept secure is critical; if it's compromised, all stored credentials become vulnerable.", "src": "PDF"}, {"n": 67, "stem": ["After completing malware removal steps, what is the next step the technician should take?"], "opts": [{"k": "A", "t": "Perform a secondary antivirus scan"}, {"k": "B", "t": "Educate the end user"}, {"k": "C", "t": "Reimage the computer"}, {"k": "D", "t": "Review system logs"}], "ans": ["B"], "exp": "End-user education is crucial after malware removal to prevent recurrence. Teaching safe browsing habits and security awareness completes the remediation cycle.", "src": "PDF"}, {"n": 68, "stem": ["An employee accidentally installs software on a company PC. The software sends data to a remote server. Which of the following best describes the software?"], "opts": [{"k": "A", "t": "Trojan"}, {"k": "B", "t": "Spyware"}, {"k": "C", "t": "Cryptominer"}, {"k": "D", "t": "Ransomware"}], "ans": ["B"], "exp": "Spyware secretly collects user or system information and sends it to a remote server, matching the described behavior.", "src": "PDF"}, {"n": 69, "stem": ["A user has rooted their corporate phone to load unapproved software. Which of the following tools should the company use to prevent access to the corporate network?"], "opts": [{"k": "A", "t": "Mobile device management"}, {"k": "B", "t": "Encryption"}, {"k": "C", "t": "Geofencing"}, {"k": "D", "t": "Lock screen"}], "ans": ["A"], "exp": "MDM software allows administrators to monitor, manage, and secure mobile devices connected to enterprise networks. One key feature is the detection and denial of access for rooted or jailbroken devices.", "src": "PDF"}, {"n": 70, "stem": ["A technician is designing a solution to automatically save users' local documents, pictures, and files to the network. The network is in an Active Directory environment. Which of the following will the technician most likely do?"], "opts": [{"k": "A", "t": "Enable System Restore."}, {"k": "B", "t": "Create recovery points."}, {"k": "C", "t": "Configure folder redirection."}, {"k": "D", "t": "Manage Windows server backups."}], "ans": ["C"], "exp": "Configuring folder redirection in an Active Directory environment allows user folders such as Documents, Pictures, and Desktop to be automatically redirected and stored on a network server. This ensures files are centrally saved, backed up, and accessible regardless of which domain- joined computer the user logs into.", "src": "PDF"}, {"n": 71, "stem": ["A small office reported a phishing attack that resulted in a malware infection. A technician is investigating the incident and has verified the following: - All endpoints are updated and have the newest EDR signatures. - Logs confirm that the malware was quarantined by EDR on one system. - The potentially infected machine was reimaged. Which of the following actions should the technician take next?"], "opts": [{"k": "A", "t": "Install network security tools to prevent downloading infected files from the internet."}, {"k": "B", "t": "Discuss the cause of the issue and educate the end user about security hygiene."}, {"k": "C", "t": "Flash the firmware of the router to ensure the integrity of network traffic."}, {"k": "D", "t": "Suggest alternate preventative controls that would include more advanced security software."}], "ans": ["B"], "exp": "With technical controls updated, EDR signatures current, and the infected system reimaged, the next step is to address the human factor. Educating the user on how to recognize phishing attempts and follow safe practices helps prevent recurrence and strengthens the organization's overall security posture.", "src": "PDF"}, {"n": 72, "stem": ["After a user installs a mobile application from an advertisement, the phone's battery dies a few hours later, and it is hot to the touch, even when not in use. Which of the following should a technician do first?"], "opts": [{"k": "A", "t": "Check for unauthorized device administrators"}, {"k": "B", "t": "Contact the software developer"}, {"k": "C", "t": "Run a mobile malware scan on the phone"}, {"k": "D", "t": "Ensure appropriate MDM policies are applied"}], "ans": ["C"], "exp": "Running a mobile malware scan is the first step because the app installed from an advertisement could be malicious, causing excessive battery drain and overheating.", "src": "PDF"}, {"n": 73, "stem": ["A user's new smartphone is not staying charged throughout the day. The smartphone charges fully every night. Which of the following should a technician review first to troubleshoot the issue?"], "opts": [{"k": "A", "t": "Storage usage"}, {"k": "B", "t": "End of software support"}, {"k": "C", "t": "Charger wattage"}, {"k": "D", "t": "Background applications"}], "ans": ["D"], "exp": "Background apps can consume significant battery by running processes, syncing data, or using location services throughout the day. Reviewing and limiting or disabling unnecessary background applications will help identify and mitigate excessive battery drain.", "src": "PDF"}, {"n": 74, "stem": ["Which of the following commands is used to validate the IP settings of a Windows OS?"], "opts": [{"k": "A", "t": "ipconfig"}, {"k": "B", "t": "net use"}, {"k": "C", "t": "route print"}, {"k": "D", "t": "ping"}], "ans": ["A"], "exp": "The ipconfig command displays the current TCP/IP configuration of a Windows system, including IP address, subnet mask, default gateway, and DNS information. This allows a technician to validate and troubleshoot the system's IP settings directly from the command line.", "src": "PDF"}, {"n": 75, "stem": ["A user keeps seeing malicious ads in the bottom right corner of their screen. When the ads appear, the icon for the internet browser process is visible in Task Manager. A technician runs an anti-malware scan that shows no results. Which of the following is the cause of this issue?"], "opts": [{"k": "A", "t": "Browser notifications"}, {"k": "B", "t": "Remote access Trojan"}, {"k": "C", "t": "Browser cache"}, {"k": "D", "t": "Browser hijacker"}], "ans": ["A"], "exp": "Browser notifications can display pop-up ads from websites even when no malware is detected. Since the browser process is associated with the ads, the issue is most likely caused by notification permissions granted to a malicious or unwanted website.", "src": "PDF"}, {"n": 76, "stem": ["A technician needs to install Windows 11 on a 4TB SSD. The company requirements state that the drive needs to be partitioned with at least five primary partitions. Which of the following should the technician use? (Choose two.)"], "opts": [{"k": "A", "t": "FAT16"}, {"k": "B", "t": "XFS"}, {"k": "C", "t": "GPT"}, {"k": "D", "t": "MBR"}, {"k": "E", "t": "NTFS"}, {"k": "F", "t": "APFS"}], "ans": ["C", "E"], "exp": "GUID Partition Table supports drives larger than 2TB and allows many primary partitions, meeting the partitioning requirement. NTFS is the required file system for modern Windows installations and supports large volumes, security features, and system files needed by Windows 11.", "src": "PDF"}, {"n": 77, "stem": ["Which of the following devices can provide combined data and power to hardwired VoIP phones in a small office?"], "opts": [{"k": "A", "t": "Injector"}, {"k": "B", "t": "PoE switch"}, {"k": "C", "t": "Optical network terminal"}, {"k": "D", "t": "Router"}], "ans": ["B"], "exp": "A PoE switch supplies both electrical power and network connectivity over Ethernet cables, allowing VoIP phones to operate without separate power adapters while maintaining data communication.", "src": "PDF"}, {"n": 78, "stem": ["A senior administrator asks a help desk technician to run a set of commands on a remote network switch. After running the commands, the technician needs to collect the output and provide it to the administrator. Which of the following should the technician use to fulfill the administrator's request?"], "opts": [{"k": "A", "t": "RDP"}, {"k": "B", "t": "WinRM"}, {"k": "C", "t": "SSH"}, {"k": "D", "t": "VNC"}], "ans": ["C"], "exp": "SSH provides secure command-line access to remote network devices such as switches. It allows the technician to run administrative commands remotely and securely capture the command output for the administrator.", "src": "PDF"}, {"n": 79, "stem": ["Which of the following prevents forced entry into a building?"], "opts": [{"k": "A", "t": "PIV card"}, {"k": "B", "t": "Motion-activated lighting"}, {"k": "C", "t": "Video surveillance"}, {"k": "D", "t": "Bollard"}], "ans": ["D"], "exp": "Bollards are sturdy, fixed posts installed around buildings or sensitive areas to physically block vehicles and prevent ramming attacks or forced vehicular entry. Unlike surveillance or lighting, bollards provide a direct physical barrier.", "src": "PDF"}, {"n": 80, "stem": ["A technician recently installed a program that uses several anti-piracy technologies. When the program is launched, it briefly opens and then closes. Which of the following is most likely the reason?"], "opts": [{"k": "A", "t": "32-bit program on a 64-bit computer"}, {"k": "B", "t": "CPU incompatibility"}, {"k": "C", "t": "Outdated video card drivers"}, {"k": "D", "t": "USB key not plugged in"}], "ans": ["D"], "exp": "Many anti-piracy technologies require a USB key (dongle) to be plugged in for the program to run; if it is missing, the program will open and then immediately close.", "src": "PDF"}, {"n": 81, "stem": ["During a routine security audit, an employee's smartphone is flagged with several security alerts. The alerts indicate that there have been multiple failed login attempts and that an unverified application was recently downloaded. Which of the following actions should a technician take first on the employee's smartphone?"], "opts": [{"k": "A", "t": "Update the smartphone's security settings and policies."}, {"k": "B", "t": "Reinstall the smartphone's latest official OS version."}, {"k": "C", "t": "Scan the smartphone for malware."}, {"k": "D", "t": "Reset the device remotely."}], "ans": ["C"], "exp": "The first action should be to scan the smartphone for malware, since the alerts indicate suspicious activity and an unverified application installation, which may have introduced malicious software.", "src": "PDF"}, {"n": 82, "stem": ["An end user discovers a virus on their computer. A technician quarantines the computer, scans for viruses, and remediates the infection. Which of the following is the next step the technician should take?"], "opts": [{"k": "A", "t": "Perform a secondary antivirus scan."}, {"k": "B", "t": "Educate the end user."}, {"k": "C", "t": "Reimage the computer."}, {"k": "D", "t": "Review system logs."}], "ans": ["B"], "exp": "Educating the end user is the next step to help prevent future infections by informing them about safe practices and how to avoid similar threats.", "src": "PDF"}, {"n": 83, "stem": ["Which of the following authentication methods is token-based?"], "opts": [{"k": "A", "t": "Kerberos"}, {"k": "B", "t": "TACACS+"}, {"k": "C", "t": "Passwords"}, {"k": "D", "t": "TKIP"}], "ans": ["B"], "exp": "TACACS+ (Terminal Access Controller Access-Control System Plus) is a token-based authentication protocol that can use tokens (such as one-time passwords or security tokens) for authenticating users.", "src": "PDF"}, {"n": 84, "stem": ["A customer laptop has been shutting down unexpectedly. The customer explains that a blue screen appears just before the laptop turns off. but the screen disappears too quickly to see anything. Which of the following tools should a technician use to find details about the error?"], "opts": [{"k": "A", "t": "Performance Monitor"}, {"k": "B", "t": "Device Manager"}, {"k": "C", "t": "Event Viewer"}, {"k": "D", "t": "System Information"}], "ans": ["C"], "exp": "Event Viewer logs system events, including critical errors like blue screen crashes, allowing the technician to review details about the failure after the system restarts.", "src": "PDF"}, {"n": 85, "stem": ["An employee's personal smartphone was stolen. The employee's corporate email account is set up on the smartphone. Which of the following is the first action to take to prevent unauthorized users from accessing this email account?"], "opts": [{"k": "A", "t": "Enforcing existing BYOD policies"}, {"k": "B", "t": "Changing the password on the email account"}, {"k": "C", "t": "Remotely wiping any non-personal data"}, {"k": "D", "t": "Enabling GPS and geofencing"}], "ans": ["B"], "exp": "Changing the email account password immediately invalidates the existing authentication token on the stolen device and prevents unauthorized access to the corporate email account. This is the fastest and most direct action to secure the account while additional steps, such as remote wipe, can be performed afterward.", "src": "PDF"}, {"n": 86, "stem": ["Which of the following commands is used to determine how a packet reaches a server?"], "opts": [{"k": "A", "t": "ipaddr"}, {"k": "B", "t": "traceroute"}, {"k": "C", "t": "ping"}, {"k": "D", "t": "dig"}], "ans": ["B"], "exp": "The traceroute command shows the path a packet takes to reach a destination, identifying each hop along the route.", "src": "PDF"}, {"n": 87, "stem": ["An administrator must write a script that will output the OS name to a file. Which of the following commands is the best way to accomplish this task?"], "opts": [{"k": "A", "t": "hostname"}, {"k": "B", "t": "netstat"}, {"k": "C", "t": "whoami"}, {"k": "D", "t": "winver"}], "ans": ["D"], "exp": "The winver command displays the Windows operating system name and version information. This makes it the appropriate command to use in a script when the requirement is to output the OS name to a file.", "src": "PDF"}, {"n": 88, "stem": ["A technician is installing a new business application on a user's desktop computer. The machine is running Windows 10 Enterprise 32-bit operating system. Which of the following files should the technician execute in order to complete the installation?"], "opts": [{"k": "A", "t": "Installer_x64.exe"}, {"k": "B", "t": "Installer_Files.zip"}, {"k": "C", "t": "Installer_32.msi"}, {"k": "D", "t": "Installer_x86.exe"}, {"k": "E", "t": "Installer_Win10Enterprise.dmg"}], "ans": ["D"], "exp": "\"x86\" refers to 32-bit architecture. On a Windows 10 Enterprise 32-bit system, the technician should execute the x86 installer for compatibility.", "src": "PDF"}, {"n": 89, "stem": ["A company wants to reduce the negative ecological impacts of its business and has decided to hire an e-waste company to dispose of equipment. Which of the following should the e-waste company provide the business?"], "opts": [{"k": "A", "t": "Non-disclosure agreement"}, {"k": "B", "t": "Certification of destruction"}, {"k": "C", "t": "Low-level formatting"}, {"k": "D", "t": "Shredding/drilling"}], "ans": ["B"], "exp": "When disposing of e-waste, it is important to ensure that the data on the equipment is securely destroyed and that the disposal process complies with environmental regulations. Non-disclosure agreement: Relates to confidentiality, not disposal. Certification of destruction: The correct document verifying that the equipment has been disposed of in accordance with regulations and standards, ensuring data is irretrievably destroyed. Low-level formatting: A method to wipe data but does not guarantee compliance with e-waste disposal regulations. Shredding/drilling: Physical destruction methods that might be used, but certification of destruction is the documentation needed.", "src": "PDF"}, {"n": 90, "stem": ["Which of the following would an administrator most likely use to automate a repetitive task via a Linux command line?"], "opts": [{"k": "A", "t": "JavaScript file"}, {"k": "B", "t": "Shell script"}, {"k": "C", "t": "Visual Basic utilities"}, {"k": "D", "t": "Batch file"}], "ans": ["B"], "exp": "A shell script is commonly used in Linux to automate repetitive tasks by executing a sequence of commands directly from the command line.", "src": "PDF"}, {"n": 91, "stem": ["Which of the following is a Linux command that is used for administrative purposes?"], "opts": [{"k": "A", "t": "runas"}, {"k": "B", "t": "cmcl"}, {"k": "C", "t": "net user"}, {"k": "D", "t": "su"}], "ans": ["D"], "exp": "The su (substitute user) command is a standard Linux utility that allows an administrator to assume another user's identity - most commonly switching to the root account for elevated privileges. It's an essential tool for administrative tasks on Unix and Linux systems.", "src": "PDF"}, {"n": 92, "stem": ["A company wants to provide its employees with devices that align with the company's mission to support open-source projects. Which of the following should a technician recommend?"], "opts": [{"k": "A", "t": "Notebooks with macOS"}, {"k": "B", "t": "Tablets with iPadOS"}, {"k": "C", "t": "Desktops with Microsoft Windows"}, {"k": "D", "t": "Smartphones with Android"}], "ans": ["D"], "exp": "Android is based on open-source software through the Android Open Source Project, making Android devices the best fit for a company that wants to support open-source technology.", "src": "PDF"}, {"n": 93, "stem": ["A user is unable to upload files to the corporate servers from their mobile phone when outside the office, but uploading files works without issue when they are in the office. The user briefly saw an error notification but dismissed the error before reading it. Which of the following should a technician do to determine the root cause?"], "opts": [{"k": "A", "t": "Check the data usage limit"}, {"k": "B", "t": "Enable airplane mode"}, {"k": "C", "t": "Verify the last device reboot"}, {"k": "D", "t": "Enable Bluetooth connectivity"}], "ans": ["A"], "exp": "Checking the data usage limit can help determine if the mobile phone has exceeded its data allowance or has restrictions that prevent file uploads when outside the office.", "src": "PDF"}, {"n": 94, "stem": ["A client provides a large spreadsheet to a business analyst for review. When the analyst attempts to open the spreadsheet, the system freezes until the application crashes. Which of the following should a technician do next?"], "opts": [{"k": "A", "t": "Run a malware scan on the file received from the client."}, {"k": "B", "t": "Validate that the file extension of the shared spreadsheet is compatible."}, {"k": "C", "t": "Review event logs for error messages relating to the application."}, {"k": "D", "t": "Perform an upgrade on the spreadsheet application."}], "ans": ["C"], "exp": "Reviewing the event logs will reveal application-specific errors that explain why the spreadsheet causes the system to freeze and crash, allowing the technician to identify the root cause before taking further action.", "src": "PDF"}, {"n": 95, "stem": ["Which of the following operating systems is used to join a domain?"], "opts": [{"k": "A", "t": "Windows 10 Home"}, {"k": "B", "t": "Windows 11 Home"}, {"k": "C", "t": "Windows 11 Pro"}, {"k": "D", "t": "Windows 11 SE"}], "ans": ["C"], "exp": "Windows 11 Pro supports domain joining, unlike Windows Home and SE editions, which lack the necessary domain-join functionality.", "src": "PDF"}, {"n": 96, "stem": ["A technician needs to download and install a new web browser on a desktop computer. Which of the following should the technician use to verify the installer is an authentic version?"], "opts": [{"k": "A", "t": "Date"}, {"k": "B", "t": "Hash"}, {"k": "C", "t": "Size"}, {"k": "D", "t": "Name"}], "ans": ["B"], "exp": "Verifying the hash of the installer ensures that the downloaded file is authentic and has not been tampered with.", "src": "PDF"}, {"n": 97, "stem": ["A technician thinks that an application a user downloaded from the internet may not be the legitimate one, even though the name is the same. The technician needs to confirm whether the application is legitimate. Which of the following should the technician do?"], "opts": [{"k": "A", "t": "Compare the hash value from the vendor."}, {"k": "B", "t": "Run Task Manager and compare the process ID."}, {"k": "C", "t": "Run the application in safe mode."}, {"k": "D", "t": "Verify the file name is correct."}], "ans": ["A"], "exp": "By computing the downloaded application's checksum (e.g., SHA-256 or MD5) and comparing it against the official hash published by the software vendor, the technician can verify the file's integrity and authenticity. A matching hash confirms the application is genuine and unaltered, whereas any discrepancy indicates a potentially illegitimate or tampered file.", "src": "PDF"}, {"n": 98, "stem": ["A developer who is using a personal laptop that is running Windows wants to leverage virtual technologies. The developer does not see an option to enable the Hyper-V feature. Which of the following is the most likely reason?"], "opts": [{"k": "A", "t": "The system is not fully patched."}, {"k": "B", "t": "The OS edition is Home."}, {"k": "C", "t": "The motherboard does not have a TPM."}, {"k": "D", "t": "The user has not joined a domain."}], "ans": ["B"], "exp": "Hyper-V cannot be enabled on Windows Home editions; it requires Windows Pro, Enterprise, or Education.", "src": "PDF"}, {"n": 99, "stem": ["A malicious actor uses multiple endpoints that are spread across multiple locations to target a single endpoint. Which of the following describes this threat?"], "opts": [{"k": "A", "t": "On-path attack"}, {"k": "B", "t": "Structured Query Language injection"}, {"k": "C", "t": "Brute-force attack"}, {"k": "D", "t": "Distributed denial of service"}], "ans": ["D"], "exp": "A distributed denial of service (DDoS) attack involves multiple endpoints from different locations targeting a single endpoint to disrupt its services.", "src": "PDF"}, {"n": 100, "stem": ["Which of the following are system folders on macOS? (Choose two)"], "opts": [{"k": "A", "t": "Applications"}, {"k": "B", "t": "Spotlight"}, {"k": "C", "t": "Time Machine"}, {"k": "D", "t": "Library"}, {"k": "E", "t": "FileVault"}, {"k": "F", "t": "iCloud"}], "ans": ["A", "D"], "exp": "Applications and Library are core system directories in macOS. The Applications folder contains installed applications. The Library folder contains support files, preferences, and other system- related files.", "src": "PDF"}, {"n": 101, "stem": ["A support technician receives a computer with a non-responsive touch pad. The touch pad does not appear to be physically damaged. Which of the following tools should the technician use to check the touch pad driver?"], "opts": [{"k": "A", "t": "System Configuration"}, {"k": "B", "t": "Device Manager"}, {"k": "C", "t": "Event Viewer"}, {"k": "D", "t": "Local Users and Groups"}], "ans": ["B"], "exp": "Device Manager is the tool used to check the status and functionality of hardware drivers, including the touch pad driver.", "src": "PDF"}, {"n": 102, "stem": ["An end user is unable to access the intranet. A technician needs to confirm whether the Windows web server is online and functioning. Which of the following default remote access technologies would the technician most likely use to remotely connect to the server?"], "opts": [{"k": "A", "t": "SPICE"}, {"k": "B", "t": "VNC"}, {"k": "C", "t": "RDP"}, {"k": "D", "t": "SSH"}], "ans": ["C"], "exp": "Remote Desktop Protocol is the default remote access technology for Windows servers. It allows a technician to remotely log in to the Windows web server, verify its status, and confirm that the web service is running properly.", "src": "PDF"}, {"n": 103, "stem": ["After a technician upgrades the RAM on a user's workstation, the system shows a No boot devicefoundmessage. Which of the following is most likely the cause?"], "opts": [{"k": "A", "t": "The installation disk is not available."}, {"k": "B", "t": "The SATA HDD power cable is disconnected."}, {"k": "C", "t": "The drive needs to be reformatted."}, {"k": "D", "t": "The boot order needs to be changed."}], "ans": ["B"], "exp": "A disconnected SATA HDD power cable prevents the system from detecting the hard drive during POST. If the drive is not powered, the BIOS/UEFI cannot recognize it as a bootable device, resulting in a \"No boot device found\" message after hardware changes such as a RAM upgrade.", "src": "PDF"}, {"n": 104, "stem": ["A technician is mapping an SMB share using the command line. Which of the following commands should the technician use?"], "opts": [{"k": "A", "t": "cd"}, {"k": "B", "t": "chkdsk"}, {"k": "C", "t": "robocopy"}, {"k": "D", "t": "net use"}, {"k": "E", "t": "nslookup"}], "ans": ["D"], "exp": "The net use command is used to map SMB network shares from the command line.", "src": "PDF"}, {"n": 105, "stem": ["Which of the following is used to determine how many active users are currently logged in to the Remote Desktop Services?"], "opts": [{"k": "A", "t": "Local Users and Groups"}, {"k": "B", "t": "System Informat
