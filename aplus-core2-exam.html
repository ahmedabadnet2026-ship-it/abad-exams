Name\\ShareName This assigns the shared folder to drive letter Z:.", "src": "PDF"}, {"n": 342, "stem": ["A business is hiring a remote employee and must provide the employee with graphical interface access to the in-house Linux servers. Which of the following should the business use for this process?"], "opts": [{"k": "A", "t": "SSH"}, {"k": "B", "t": "VNC"}, {"k": "C", "t": "WinRM"}, {"k": "D", "t": "Telnet"}], "ans": ["B"], "exp": "VNC provides remote graphical desktop access, allowing a user to interact with a Linux system's GUI over the network, which meets the requirement for graphical interface access.", "src": "PDF"}, {"n": 343, "stem": ["A company wants to use a single operating system for its workstation and servers and avoid licensing fees. Which of the following operating systems would the company most likely select?"], "opts": [{"k": "A", "t": "Linux"}, {"k": "B", "t": "Windows"}, {"k": "C", "t": "macOS"}, {"k": "D", "t": "Chrome OS"}], "ans": ["A"], "exp": "Linux distributions are open-source and generally free of licensing fees, making them suitable for both desktop workstations and servers. Organizations can use the same Linux OS across all their systems without incurring per-seat or per-server costs, unlike proprietary systems such as Windows or macOS.", "src": "PDF"}, {"n": 344, "stem": ["A support specialist must apply a new application update to an entire organization. Which of the following is the first step in this process?"], "opts": [{"k": "A", "t": "Backup plan"}, {"k": "B", "t": "Request forms"}, {"k": "C", "t": "Sandbox testing"}, {"k": "D", "t": "Peer review"}], "ans": ["C"], "exp": "Sandbox testing is performed first to validate the application update in a controlled environment, ensuring it functions correctly and does not introduce issues before deployment across the organization.", "src": "PDF"}, {"n": 345, "stem": ["A junior technician is working on a customer request. The junior technician cannot complete the work and escalates the issue to a senior technician. The senior technician completes the work, but the outcome does not match the customer's request. Which of the following communication techniques should the junior technician have followed?"], "opts": [{"k": "A", "t": "Ask open-ended questions to verify understanding."}, {"k": "B", "t": "Maintain a positive attitude and project confidence."}, {"k": "C", "t": "Avoid dismissing the customer's issues."}, {"k": "D", "t": "Use proper language and avoid jargon."}], "ans": ["A"], "exp": "Asking open-ended questions helps clarify the customer's actual needs and verify understanding before escalating, reducing the chance of miscommunication and incorrect outcomes.", "src": "PDF"}, {"n": 346, "stem": ["A user wants to use a new laptop to play audio and video to an office projector, but the laptop does not have VGA or HDMI. Which of the following adapters should the user buy?"], "opts": [{"k": "A", "t": "USB-C to HDMI"}, {"k": "B", "t": "MicroUSB to VGA"}, {"k": "C", "t": "DisplayPort to VGA"}, {"k": "D", "t": "DVI to HDMI"}], "ans": ["A"], "exp": "Modern laptops without VGA or HDMI typically use USB-C for video output, which supports DisplayPort over USB-C. Using a USB-C to HDMI adapter enables both audio and video transmission to the projector.", "src": "PDF"}, {"n": 347, "stem": ["Which of the following security measures addresses the issue of information exfiltration?"], "opts": [{"k": "A", "t": "DLP"}, {"k": "B", "t": "MDM"}, {"k": "C", "t": "SAML"}, {"k": "D", "t": "IAM"}], "ans": ["A"], "exp": "Data Loss Prevention is designed to monitor, detect, and prevent unauthorized transmission of sensitive data outside the organization. It directly addresses information exfiltration by controlling how data is accessed, shared, or transferred.", "src": "PDF"}, {"n": 348, "stem": ["A small company is experiencing unauthorized access attempts to its Windows workstations. The company suspects that some default security settings may be too permissive. Which of the following actions should an IT technician take?"], "opts": [{"k": "A", "t": "Implement an appropriate group policy."}, {"k": "B", "t": "Configure automatic updates for Windows."}, {"k": "C", "t": "Reset account passwords."}, {"k": "D", "t": "Enable account lockout policies."}], "ans": ["A"], "exp": "Group Policy allows centralized enforcement of security settings across Windows workstations, making it the appropriate method for tightening default permissions and reducing unauthorized access attempts.", "src": "PDF"}, {"n": 349, "stem": ["A user needs to test several software replacement possibilities. Part of the process involves installing the different software options on a corporate-imaged sandboxed PC. Which of the following is the best option to allow the user to install the required software?"], "opts": [{"k": "A", "t": "Make the user a member of Domain Admins."}, {"k": "B", "t": "Add the user to the local Administrators group."}, {"k": "C", "t": "Let the user use credentials from another user who has rights."}, {"k": "D", "t": "Give the user the local, high-privileged account password."}], "ans": ["B"], "exp": "Adding the user to the local Administrators group on the sandboxed PC grants the necessary permissions to install and test software without giving excessive domain-wide privileges. This follows the principle of least privilege by limiting elevated access to only the specific machine required for testing.", "src": "PDF"}, {"n": 350, "stem": ["Which of the following is most important for protecting intellectual property from being shared on social media platforms?"], "opts": [{"k": "A", "t": "SLA"}, {"k": "B", "t": "AUP"}, {"k": "C", "t": "ACL"}, {"k": "D", "t": "NDA"}], "ans": ["D"], "exp": "A nondisclosure agreement legally binds individuals to protect confidential and proprietary information, making it the most important control for preventing intellectual property from being shared on social media platforms.", "src": "PDF"}, {"n": 351, "stem": ["A technician must add an external web address as a trusted site. Which of the following settings should the technician configure?"], "opts": [{"k": "A", "t": "System"}, {"k": "B", "t": "Network and Sharing Center"}, {"k": "C", "t": "Internet Options"}, {"k": "D", "t": "Administrative Tools"}], "ans": ["C"], "exp": "Internet Options in Windows provides the security settings where a technician can add external web addresses to the \"Trusted sites\" zone.", "src": "PDF"}, {"n": 352, "stem": ["A network technician notices that most of the company's network switches are now end-oflife and need to be upgraded. Which of the following should the technician do first?"], "opts": [{"k": "A", "t": "Implement the change"}, {"k": "B", "t": "Approve the change."}, {"k": "C", "t": "Propose the change."}, {"k": "D", "t": "Schedule the change."}], "ans": ["C"], "exp": "In a structured change-management process, the very first step is to propose (or formally request) the change via a Request for Change (RFC). This ensures stakeholders review the need, assess risks, and determine the priority before any approvals, scheduling, or implementation occur.", "src": "PDF"}, {"n": 353, "stem": ["A desktop technician is hardening a newly installed company workstation. Which of the following actions should the technician take? (Choose two.)"], "opts": [{"k": "A", "t": "Implement a disclaimer on the log-in screen."}, {"k": "B", "t": "Disable the guest account."}, {"k": "C", "t": "Disable the screensaver."}, {"k": "D", "t": "Install remote collaboration tools."}, {"k": "E", "t": "Change the default administrator password."}, {"k": "F", "t": "Enable a virtual assistant."}], "ans": ["B", "E"], "exp": "Disabling the guest account prevents unauthorized access. Changing the default administrator password strengthens security by preventing easy compromise.", "src": "PDF"}, {"n": 354, "stem": ["Which of the following is the best way to distribute custom images to 800 devices that include four device vendor classes with two types of user groups?"], "opts": [{"k": "A", "t": "Use xcopy to clone the hard drives from one to another."}, {"k": "B", "t": "Use robocopy to move the files to each device."}, {"k": "C", "t": "Use a local image deployment tool for each device."}, {"k": "D", "t": "Use a network-based remote installation tool."}], "ans": ["D"], "exp": "A network-based remote installation tool (such as Windows Deployment Services, MDT, or a similar solution) scales efficiently across hundreds of devices with varying hardware and user configurations. It allows you to segment deployments by vendor classes and user groups, automate imaging processes, and manage version control centrally - far more effectively than one-to-one cloning or file -copy methods.", "src": "PDF"}, {"n": 355, "stem": ["Which of the following allows users to prevent malware installation and the disclosure of sensitive information?"], "opts": [{"k": "A", "t": "Secure Boot"}, {"k": "B", "t": "Threat education"}, {"k": "C", "t": "Email security gateway"}, {"k": "D", "t": "Firewall"}], "ans": ["B"], "exp": "Threat education teaches users how to recognize and avoid malicious content and unsafe behaviors, helping prevent malware installation and reducing the risk of disclosing sensitive information through social engineering or user error.", "src": "PDF"}, {"n": 356, "stem": ["Which of the following best describes a security consequence of using software that is EOL?"], "opts": [{"k": "A", "t": "The software will stop working."}, {"k": "B", "t": "The vendor will not support future features."}, {"k": "C", "t": "New vulnerabilities will not be patched."}, {"k": "D", "t": "Users will incur increased licensing costs."}], "ans": ["C"], "exp": "When software reaches end of life, the vendor no longer provides security updates or patches. This means newly discovered vulnerabilities remain unaddressed, increasing the risk of exploitation and security breaches.", "src": "PDF"}, {"n": 357, "stem": ["A technician is assisting a user who is growing increasingly frustrated because an application continuously crashes. The technician must coordinate with another department to resolve the issue. Which of the following actions should the technician take to effectively and professionally communicate with the user?"], "opts": [{"k": "A", "t": "Transfer the user to the next tier."}, {"k": "B", "t": "Ask the user to submit a formal complaint about the issue."}, {"k": "C", "t": "Continue working on the issue independently."}, {"k": "D", "t": "Explain the issue and the need for collaboration."}], "ans": ["D"], "exp": "Clearly explaining the issue and the need for collaboration keeps the user informed, manages expectations, and maintains professionalism while the technician coordinates with another department to resolve the problem.", "src": "PDF"}, {"n": 358, "stem": ["An administrator must configure computers for remote users. The computers will be shipped directly to users from the manufacturer. Which of the following solutions should the administrator use?"], "opts": [{"k": "A", "t": "Clean install"}, {"k": "B", "t": "Zero-touch deployment"}, {"k": "C", "t": "Remote Desktop Protocol"}, {"k": "D", "t": "Private cloud"}], "ans": ["B"], "exp": "Zero-touch deployment allows devices to be preconfigured and automatically provisioned when first powered on by the end user. This enables remote users to receive systems directly from the manufacturer and have them automatically configured with corporate settings without manual IT intervention.", "src": "PDF"}, {"n": 359, "stem": ["Which of the following is the weakest wireless security protocol?"], "opts": [{"k": "A", "t": "WEP"}, {"k": "B", "t": "WPA2"}, {"k": "C", "t": "TKIP"}, {"k": "D", "t": "AES"}], "ans": ["A"], "exp": "WEP (Wired Equivalent Privacy) is known to be the weakest wireless security protocol due to its vulnerabilities and ease of being compromised. WEP: The oldest and weakest protocol, susceptible to various attacks and easily cracked.", "src": "PDF"}, {"n": 360, "stem": ["A user requires a temporary computer to perform duties. Which of the following is a way to leave minimal user data on the computer?"], "opts": [{"k": "A", "t": "Passwordless login"}, {"k": "B", "t": "Secure DNS"}, {"k": "C", "t": "Private browser"}, {"k": "D", "t": "Syncing user data"}], "ans": ["C"], "exp": "Private browser mode reduces locally saved browsing data, such as history, cookies, cached files, and form entries, which helps leave minimal user data on a temporary computer.", "src": "PDF"}, {"n": 361, "stem": ["Which of the following is provided to a user during MFA?"], "opts": [{"k": "A", "t": "TOTP"}, {"k": "B", "t": "DLP"}, {"k": "C", "t": "FRT"}, {"k": "D", "t": "MDM"}], "ans": ["A"], "exp": "Time-based One-Time Passwords are provided to users during multifactor authentication as a temporary, dynamically generated code. This code serves as an additional authentication factor beyond a username and password, enhancing security by requiring something the user has in addition to something they know.", "src": "PDF"}, {"n": 362, "stem": ["When a corporate laptop is connected to the company network, it can reach external websites. However, it cannot reach any internal websites, displaying the error message \"Cannot reach this page.\" Which of the following should a technician configure?"], "opts": [{"k": "A", "t": "Subnet mask"}, {"k": "B", "t": "DNS settings"}, {"k": "C", "t": "Default gateway"}, {"k": "D", "t": "DHCP"}], "ans": ["B"], "exp": "If internal resources (such as intranet or internal apps) can't be accessed but external sites work, this often points to aDNS issue, where the system isn't resolving internal domain names correctly.", "src": "PDF"}, {"n": 363, "stem": ["A user's computer is able to access resources on the corporate network but is unable to access internet web pages with a browser. Which of the following is most likely the reason?"], "opts": [{"k": "A", "t": "IP address conflict"}, {"k": "B", "t": "Missing proxy settings"}, {"k": "C", "t": "Incorrect subnet mask"}, {"k": "D", "t": "Disconnected Ethernet cable"}], "ans": ["B"], "exp": "Missing proxy settings can prevent access to internet web pages while still allowing access to internal network resources.", "src": "PDF"}, {"n": 364, "stem": ["A technician needs to configure settings for password complexity and failed log-in attempts before a user is locked out. These settings cannot be changed by standard users. Which of the following MMC snap-ins should the technician use?"], "opts": [{"k": "A", "t": "taskschd"}, {"k": "B", "t": "lusrmgr"}, {"k": "C", "t": "perfmon"}, {"k": "D", "t": "gpsdit"}], "ans": ["D"], "exp": "The gpedit (Group Policy Editor) MMC snap-in is used to configure password complexity and account lockout policies that standard users cannot change.", "src": "PDF"}, {"n": 365, "stem": ["A support technician receives a call from an upset customer. The customer continually and loudly interrupts the technician before the technician can ask clarifying questions or confirm details. Which of the following actions should the support technician take to handle the situation effectively and professionally? (Choose two)."], "opts": [{"k": "A", "t": "Use active listening skills to ensure the customer feels heard and understood."}, {"k": "B", "t": "Offer immediate compensation for their troubles without checking policies."}, {"k": "C", "t": "Apologize for the inconvenience without understanding the issue."}, {"k": "D", "t": "Confront the customer about their tone and insist on a civil conversation."}, {"k": "E", "t": "Maintain a calm and empathetic tone throughout the conversation."}, {"k": "F", "t": "Transfer the call to a manager without addressing the customer's concerns."}], "ans": ["A", "E"], "exp": "Active listening helps de-escalate the situation by allowing the customer to feel heard and understood, even when they are upset. Maintaining a calm and empathetic tone demonstrates professionalism and helps reduce tension, making it easier to guide the conversation toward resolving the issue.", "src": "PDF"}, {"n": 366, "stem": ["A user wants to use several used computers to set up a low-cost lab at home to study and test scripts for managing servers. Which of the following would be the best operating system choice?"], "opts": [{"k": "A", "t": "macOS"}, {"k": "B", "t": "Linux"}, {"k": "C", "t": "ChromeOS"}, {"k": "D", "t": "Windows"}], "ans": ["B"], "exp": "This operating system is free, lightweight, and widely used on servers, making it ideal for building a low-cost lab and practicing scripting and server management tasks.", "src": "PDF"}, {"n": 367, "stem": ["A technician needs to increase the security levels on a laptop that will be used during a conference that is out of the country. Which of the following should the technician configure?"], "opts": [{"k": "A", "t": "Content filtering"}, {"k": "B", "t": "A screen lock"}, {"k": "C", "t": "Restricted login times"}, {"k": "D", "t": "Disk encryption"}], "ans": ["D"], "exp": "Disk encryption protects the laptop's stored data if the device is lost, stolen, or accessed without authorization while traveling. It ensures the data remains unreadable without the proper authentication key.", "src": "PDF"}, {"n": 368, "stem": ["Which of the following tools would most likely be used to identify a cable's location in the network closet?"], "opts": [{"k": "A", "t": "Loopback plug"}, {"k": "B", "t": "Crimper"}, {"k": "C", "t": "Toner probe"}, {"k": "D", "t": "Network tap"}], "ans": ["C"], "exp": "A toner probe is used to trace and identify cables by sending a signal through the wire and detecting it at the other end, allowing technicians to locate specific cables in a network closet.", "src": "PDF"}, {"n": 369, "stem": ["Which of the following should be used to verify the integrity of a downloaded patch?"], "opts": [{"k": "A", "t": "Private browsing"}, {"k": "B", "t": "Secure DNS"}, {"k": "C", "t": "Hashing"}, {"k": "D", "t": "Trusted plug-ins"}], "ans": ["C"], "exp": "Hashing is used to verify the integrity of a downloaded patch by comparing the file's calculated hash value with the hash published by the vendor. If the values match, the patch has not been altered or corrupted.", "src": "PDF"}, {"n": 370, "stem": ["A utility failure causes a workstation to immediately shut down. Which of the following would help prevent this from reoccurring?"], "opts": [{"k": "A", "t": "Surge suppressor"}, {"k": "B", "t": "Uninterruptible power supply"}, {"k": "C", "t": "Line voltage regulator"}, {"k": "D", "t": "Redundant PSU"}], "ans": ["B"], "exp": "This device provides temporary battery power during a utility power loss, allowing the workstation to continue running or shut down gracefully instead of immediately powering off.", "src": "PDF"}, {"n": 371, "stem": ["A company requires a storage solution that combines performance and redundancy for a main database server with high levels of read/write operations. Which of the following storage configurations best meets these requirements?"], "opts": [{"k": "A", "t": "RAID 0"}, {"k": "B", "t": "RAID 5"}, {"k": "C", "t": "RAID 6"}, {"k": "D", "t": "RAID 10"}], "ans": ["D"], "exp": "RAID 10 combines striping and mirroring, delivering high performance for intensive read/write operations while maintaining redundancy through mirrored data, making it ideal for database workloads.", "src": "PDF"}, {"n": 372, "stem": ["A systems administrator wants to manage a Linux server from a remote laptop using a disk management tool that is only accessible via the GUI. Which of the following should the administrator install?"], "opts": [{"k": "A", "t": "Secure Shell (SSH)"}, {"k": "B", "t": "Kernel-based virtual machine (KVM)"}, {"k": "C", "t": "Virtual Network Computing (VNC)"}, {"k": "D", "t": "Virtual private network (VPN)"}], "ans": ["C"], "exp": "This technology provides remote access to a system's graphical desktop environment, allowing the administrator to use GUI-only tools on the Linux server from a remote laptop.", "src": "PDF"}, {"n": 373, "stem": ["A technician is unable to upgrade a desktop computer from Windows 10 to Windows 11. Which of the following is most likely preventing the upgrade?"], "opts": [{"k": "A", "t": "Missing TPM module"}, {"k": "B", "t": "Slow HDD spindle speed"}, {"k": "C", "t": "Low refresh rate"}, {"k": "D", "t": "High RAM latency"}], "ans": ["A"], "exp": "A missing TPM (Trusted Platform Module) is a common requirement for Windows 11, and its absence is most likely preventing the upgrade.", "src": "PDF"}, {"n": 374, "stem": ["A technician needs to delete an application's local data from a specific user account, but when the technician navigates to the C:\\Users\\EmployeeA directory, the AppData folder is not present. Which of the following should the technician do to see the appropriate folder?"], "opts": [{"k": "A", "t": "Grant full control permissions on the folder to everyone"}, {"k": "B", "t": "Adjust the display options to show all file details"}, {"k": "C", "t": "Change the settings to view hidden items"}, {"k": "D", "t": "Log in to the workstation as a domain administrator"}], "ans": ["C"], "exp": "The AppData folder is hidden by default in Windows, so changing the settings to view hidden items allows the technician to see and access the folder to delete the application's local data.", "src": "PDF"}, {"n": 375, "stem": ["An employee receives a message urging them to scan an image with their company-owned smartphone that will access the account management portal in order to reset their password. Which of the following describes this type of social engineering attack?"], "opts": [{"k": "A", "t": "Whaling"}, {"k": "B", "t": "Vishing"}, {"k": "C", "t": "Quishing"}, {"k": "D", "t": "Smishing"}], "ans": ["C"], "exp": "Quishing is a social engineering attack that uses QR codes to trick users into scanning them, leading to malicious websites or actions such as credential theft or unauthorized account access.", "src": "PDF"}, {"n": 376, "stem": ["A technician is setting up a Windows server to allow remote desktop connections for multiple users. Which of the following should the technician configure on the workstation?"], "opts": [{"k": "A", "t": "Firewall"}, {"k": "B", "t": "Computer Management"}, {"k": "C", "t": "User Accounts"}, {"k": "D", "t": "Ease of Access"}], "ans": ["A"], "exp": "To allow Remote Desktop connections, the Windows Firewall on the server (or workstation acting as the host) must have the Remote Desktop (TCP port 3389) rule enabled. This opens the necessary port so multiple users can establish RDP sessions. The other settings (User Accounts, Computer Management, Ease of Access) don't directly control network access for RDP.", "src": "PDF"}, {"n": 377, "stem": ["Company employees do not have assigned workspaces and regularly work at different computers and physical locations. Which of the following should the company implement to maintain data security and minimize the amount of user data that needs to be transferred?"], "opts": [{"k": "A", "t": "Centralized certificate storage"}, {"k": "B", "t": "Cloud email"}, {"k": "C", "t": "Portable drives"}, {"k": "D", "t": "Roaming profiles"}], "ans": ["D"], "exp": "Roaming profiles allow user data and settings to follow employees as they log in to different computers, maintaining data security and minimizing the need to transfer user data manually.", "src": "PDF"}, {"n": 378, "stem": ["A user reports the icons on their desktop have changed. A technician investigates and discovers programs no longer open, files are inaccessible, and file extensions have been changed. When a ransom note appears on the display, which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Change the extensions back."}, {"k": "B", "t": "Run antivirus scans."}, {"k": "C", "t": "Restore from a backup."}, {"k": "D", "t": "Isolate the system."}], "ans": ["D"], "exp": "The technician should isolate the system immediately to prevent the ransomware from spreading to other machines or network resources before taking any recovery actions.", "src": "PDF"}, {"n": 379, "stem": ["An organization's network engineering team provides the support team with web proxy information that all workstations need in order to access external web pages. Which of the following should the support team change?"], "opts": [{"k": "A", "t": "DHCP lease configurations"}, {"k": "B", "t": "Internet Options (LAN settings)"}, {"k": "C", "t": "VPN endpoints"}, {"k": "D", "t": "Primary DNS and gateway addresses"}], "ans": ["B"], "exp": "Web proxy settings for accessing external sites are configured in the workstation's Internet Options under LAN settings, where the proxy server information is entered.", "src": "PDF"}, {"n": 380, "stem": ["Which of the following types of malware is designed to enable administrative access to a computer?"], "opts": [{"k": "A", "t": "Rootkit"}, {"k": "B", "t": "Trojan"}, {"k": "C", "t": "Worm"}, {"k": "D", "t": "Ransomware"}], "ans": ["A"], "exp": "A rootkit (Option A) is a type of malware designed to gain administrative (root) access to a system while hiding its presence. Rootkits can manipulate system processes and files to remain undetected, making them particularly dangerous.", "src": "PDF"}, {"n": 381, "stem": ["A technician is troubleshooting the reason that an application is down. The technician verifies that a service that was running has unexpectedly stopped. The technician tries to manually start the service, but it fails to start. Which of the following is the cause of this issue?"], "opts": [{"k": "A", "t": "The service is set to automatically start"}, {"k": "B", "t": "The service account needs administrative rights"}, {"k": "C", "t": "The service account is locked out"}, {"k": "D", "t": "The service should be set to run under the system account"}], "ans": ["C"], "exp": "If the service account is locked out, the service cannot authenticate when starting, causing the manual start attempt to fail even though the service previously ran successfully.", "src": "PDF"}, {"n": 382, "stem": ["A town clerk wants to work from home and access documents on a town hall server. What should a technician set up?"], "opts": [{"k": "A", "t": "VNC"}, {"k": "B", "t": "RDP"}, {"k": "C", "t": "VPN"}, {"k": "D", "t": "SSH"}], "ans": ["C"], "exp": "A VPN (Virtual Private Network) should be set up to securely connect the clerk's laptop to the town hall network, enabling access to server documents from home.", "src": "PDF"}, {"n": 383, "stem": ["Which of the following is a reason to keep the air temperature and humidity level within proper limits in environments with multiple active computers and peripherals?"], "opts": [{"k": "A", "t": "To inhibit power surges"}, {"k": "B", "t": "To control dust"}, {"k": "C", "t": "To reduce fire risks"}, {"k": "D", "t": "To prevent static discharge"}], "ans": ["D"], "exp": "Proper humidity levels prevent environments from becoming too dry, which reduces static electricity buildup and the risk of damaging static discharge around computer equipment.", "src": "PDF"}, {"n": 384, "stem": ["Which of the following is the best term to describe the concept in which AI makes incorrect assumptions because of limited training?"], "opts": [{"k": "A", "t": "Bias"}, {"k": "B", "t": "Hallucinations"}, {"k": "C", "t": "Inconsistency"}, {"k": "D", "t": "Plagiarism"}], "ans": ["A"], "exp": "AI bias occurs when an AI system makes incorrect assumptions or decisions due to limitations or imbalance in its training data, leading to skewed or inaccurate outputs.", "src": "PDF"}, {"n": 385, "stem": ["Which of the following depends on system time accuracy to function properly?"], "opts": [{"k": "A", "t": "Terminal Access Controller Access-control System"}, {"k": "B", "t": "Kerberos token"}, {"k": "C", "t": "Remote Authentication Dial-in User Service"}, {"k": "D", "t": "Wi-Fi Protected Access"}], "ans": ["B"], "exp": "Kerberos relies on accurate system time to validate authentication tickets, as it uses time- stamped tokens with strict expiration windows to prevent replay attacks. If system clocks are not synchronized, authentication fails.", "src": "PDF"}, {"n": 386, "stem": ["A user reports getting a BSOD error on their computer at least twice a day. Which of the following should the technician use to determine the cause?"], "opts": [{"k": "A", "t": "Event Viewer"}, {"k": "B", "t": "Performance Monitor"}, {"k": "C", "t": "System Information"}, {"k": "D", "t": "Device Manager"}], "ans": ["A"], "exp": "Event Viewer logs system errors, including the critical events that lead up to and include Blue Screen of Death (BSOD) incidents. By reviewing the \"System\" and \"Application\" logs, especially the error entries and any bugcheck codes, you can identify the faulting driver, service, or hardware component responsible for the crashes.", "src": "PDF"}, {"n": 387, "stem": ["Which of the following concepts should a technician consider when discussing confidential work projects with individuals outside the company?"], "opts": [{"k": "A", "t": "EULA"}, {"k": "B", "t": "EOL"}, {"k": "C", "t": "SLA"}, {"k": "D", "t": "NDA"}], "ans": ["D"], "exp": "An NDA (Non-Disclosure Agreement) is the concept a technician should consider to ensure that confidential work project details are not shared with unauthorized individuals outside the company.", "src": "PDF"}, {"n": 388, "stem": ["A technician is updating a virtual desktop. The technician discovers that a single update interferes with a business-critical application. The technician reviews the vendor website and learns that the application is EOL and will not receive any further development. Which of the following should the technician do to restore the functionality with minimum downtime?"], "opts": [{"k": "A", "t": "Perform a System Restore."}, {"k": "B", "t": "Uninstall and block the patch."}, {"k": "C", "t": "Upgrade the application."}, {"k": "D", "t": "Change the underlying hypervisor."}], "ans": ["B"], "exp": "Uninstalling and blocking the patch restores functionality immediately and prevents the incompatible update from being applied again, minimizing downtime while allowing the business- critical EOL application to continue running.", "src": "PDF"}, {"n": 389, "stem": ["A technician sees a certificate warning on a new website stating that the certificate source cannot be verified. The technician bypasses the warning. Which of the following must be done to prevent this warning from appearing for other users?"], "opts": [{"k": "A", "t": "A trusted certificate authority must generate the certificate."}, {"k": "B", "t": "The certificate must be signed by the administrator."}, {"k": "C", "t": "A new certificate must be created from a local computer."}, {"k": "D", "t": "The certificate must be added to the personal root."}], "ans": ["A"], "exp": "When a certificate is generated and signed by a trusted certificate authority, browsers can validate the certificate chain automatically, preventing trust warnings for all users accessing the website.", "src": "PDF"}, {"n": 390, "stem": ["A user is trying to install new software. The application downloads successfully, but when the user attempts to install the application, the user receives a prompt for credentials. Which of the following would the technician most likely do to resolve this issue?"], "opts": [{"k": "A", "t": "Restart the user's computer."}, {"k": "B", "t": "Use a different web browser to download the application."}, {"k": "C", "t": "Change the UAC settings."}, {"k": "D", "t": "Contact the software vendor for support."}], "ans": ["C"], "exp": "The credential prompt during installation is caused by User Account Control requiring administrative privileges to install software. Adjusting UAC settings or providing appropriate administrative approval resolves the issue by allowing the installation to proceed with elevated permissions.", "src": "PDF"}, {"n": 391, "stem": ["A user frequently misplaces their Windows laptop and is concerned about it being stolen. The user would like additional security controls on their laptop. Which of the following is a built-in technology that a technician can use to enable full drive encryption?"], "opts": [{"k": "A", "t": "Active Directory"}, {"k": "B", "t": "New Technology File System"}, {"k": "C", "t": "Encrypting File System"}, {"k": "D", "t": "BitLocker"}], "ans": ["D"], "exp": "BitLocker is a built-in Windows feature that provides full-volume encryption of the system drive, protecting all data if the laptop is lost or stolen. It integrates with the TPM (when available) for secure key storage and can be configured via Group Policy or the Control Panel without additional software.", "src": "PDF"}, {"n": 392, "stem": ["A computer frequently crashes after an OS patch. Which of the following actions should a technician take to prevent further crashes and look into the issue?"], "opts": [{"k": "A", "t": "Perform a System Restore."}, {"k": "B", "t": "Roll back the updates."}, {"k": "C", "t": "Apply the optional patches."}, {"k": "D", "t": "Change the startup sequence."}], "ans": ["B"], "exp": "Rolling back the updates will revert the system to its previous stable state, preventing further crashes and allowing investigation into the issue caused by the recent OS patch.", "src": "PDF"}, {"n": 393, "stem": ["A user's computer is running slowly. Web pages take several seconds to open, and applications are slow to respond. A technician opens the Windows Task Manager and sees the following: Disk: 2% Network: 12% GPU: 15% CPU: 70% Memory: 97% Which of the following would a technician most likely do to resolve the issue?"], "opts": [{"k": "A", "t": "Clear browser cached data"}, {"k": "B", "t": "Upgrade the network connection"}, {"k": "C", "t": "Close unnecessary programs"}, {"k": "D", "t": "Delete temporary files"}], "ans": ["C"], "exp": "High memory usage (97%) suggests the system is overloaded with active processes. The technician should close unneeded applications to free up RAM and improve performance.", "src": "PDF"}, {"n": 394, "stem": ["Which of the following commands is used to manage files in a Linux OS?"], "opts": [{"k": "A", "t": "robocopy"}, {"k": "B", "t": "curl"}, {"k": "C", "t": "xcopy"}, {"k": "D", "t": "cp"}], "ans": ["D"], "exp": "The cp command in Linux is used to copy and manage files and directories within the file system. It is a standard Linux utility for file management operations.", "src": "PDF"}, {"n": 395, "stem": ["A technician notices that the weekly backup is taking too long to complete. The daily backups are incremental. Which of the following would most likely resolve the issue?"], "opts": [{"k": "A", "t": "Changing the backup window"}, {"k": "B", "t": "Performing incremental weekly backups"}, {"k": "C", "t": "Increasing the backup storage"}, {"k": "D", "t": "Running synthetic full weekly backups"}], "ans": ["D"], "exp": "Synthetic full backups consolidate the most recent full backup and subsequent incremental backups into a new full backup on the backup storage, without repeatedly reading all data from the production systems. This approach significantly reduces the time impact on the network and source systems during the weekly backup window while still providing a full backup set for restoration.", "src": "PDF"}, {"n": 396, "stem": ["A computer technician is implementing a solution to support a new internet browsing policy for a customer's business. The policy prohibits users from accessing unauthorized websites based on categorization. Which of the following should the technician configure on the SOHO router?"], "opts": [{"k": "A", "t": "Secure management access"}, {"k": "B", "t": "Group Policy Editor"}, {"k": "C", "t": "Content filtering"}, {"k": "D", "t": "Firewall"}], "ans": ["C"], "exp": "Content filtering on a SOHO router lets you block or allow websites based on their categories (e.g., social media, gambling, news). By defining which categories are unauthorized, the router enforces the browsing policy at the network edge, preventing users from reaching disallowed sites.", "src": "PDF"}, {"n": 397, "stem": ["When logging in to a workstation, a technician notices that the roaming profile takes a long time to fully load. Which of the following should the technician check first to troubleshoot this issue?"], "opts": [{"k": "A", "t": "The home folder for large files"}, {"k": "B", "t": "The hard drive storage usage"}, {"k": "C", "t": "The PSU's power output"}, {"k": "D", "t": "Task Manager for unresponsive applications"}], "ans": ["A"], "exp": "Large files stored in the home folder increase the size of the roaming profile, causing slow login times as the profile is copied across the network. Checking for large files is the first and most direct step.", "src": "PDF"}, {"n": 398, "stem": ["A technician needs to change hibernation settings on a Windows computer by applying a batch file. Domain policies are unavailable. Which of the following is the best way to achieve this goal?"], "opts": [{"k": "A", "t": "Use Power Options in Control Panel"}, {"k": "B", "t": "Update the computer's firmware"}, {"k": "C", "t": "Run gpupdate from command prompt"}, {"k": "D", "t": "Use the powercfg command in PowerShell"}], "ans": ["D"], "exp": "The powercfg command in PowerShell or Command Prompt can modify hibernation settings and is suitable for use in a batch file.", "src": "PDF"}, {"n": 399, "stem": ["After a recent mobile OS upgrade to a smartphone, a user attempts to access their corporate email, but the application does not open. A technician restarts the smartphone, but the issue persists. Which of the following is the most likely way to resolve the issue?"], "opts": [{"k": "A", "t": "Updating the failed software"}, {"k": "B", "t": "Registering the smartphone with an MDM solution"}, {"k": "C", "t": "Installing a third-party client"}, {"k": "D", "t": "Clearing the cache partition"}], "ans": ["A"], "exp": "After a major OS upgrade, existing applications often require updates to maintain compatibility with new APIs and system libraries. Updating the corporate email app to its latest version ensures it's built against the updated OS and can launch properly.", "src": "PDF"}, {"n": 400, "stem": ["An administrator received an email stating that the OS they are currently supporting will no longer be issued security updates and patches. Which of the following is most likely the reason the administrator received this message?"], "opts": [{"k": "A", "t": "Support from the computer's manufacturer is expiring."}, {"k": "B", "t": "The OS will be considered end of life."}, {"k": "C", "t": "The built-in security software is being removed from the next OS version."}, {"k": "D", "t": "A new version of the OS will be released soon."}], "ans": ["B"], "exp": "When an operating system reaches end of life (EOL), the vendor ceases issuing security updates and patches. Administrators are notified so they can plan upgrades or migrations before support ends.", "src": "PDF"}, {"n": 401, "stem": ["Which of the following types of malware collects and sends data to an unknown third party without the user's consent?"], "opts": [{"k": "A", "t": "Ransomware"}, {"k": "B", "t": "Virus"}, {"k": "C", "t": "Trojan"}, {"k": "D", "t": "Spyware"}], "ans": ["D"], "exp": "Spyware is designed specifically to collect user or system data and transmit it to a third party without the user's knowledge or consent.", "src": "PDF"}, {"n": 402, "stem": ["A malicious actor uses multiple endpoints to target a single endpoint. Which of the following describes this threat?"], "opts": [{"k": "A", "t": "On-path attack"}, {"k": "B", "t": "Structured Query Language injection"}, {"k": "C", "t": "Brute-force attack"}, {"k": "D", "t": "Distributed Denial of Service"}], "ans": ["D"], "exp": "A Distributed Denial of Service attack uses multiple endpoints simultaneously to overwhelm a single target system, exhausting its resources and making it unavailable to legitimate users.", "src": "PDF"}, {"n": 403, "stem": ["A company requires technicians to verify that files downloaded from the internet have not been modified. Which of the following should the technicians use for validation?"], "opts": [{"k": "A", "t": "Hashing"}, {"k": "B", "t": "SSL certificate"}, {"k": "C", "t": "Plug-in"}, {"k": "D", "t": "Extensions"}], "ans": ["A"], "exp": "Hashing generates a unique checksum value for a file. By comparing the calculated hash of the downloaded file with the original published hash, technicians can verify file integrity and confirm that the file has not been altered or corrupted.", "src": "PDF"}, {"n": 404, "stem": ["A network technician notices that most of the company's network switches are now end-oflife and need to be upgraded. What should the technician do first?"], "opts": [{"k": "A", "t": "Implement the change"}, {"k": "B", "t": "Approve the change"}, {"k": "C", "t": "Document the change"}, {"k": "D", "t": "Schedule the change"}], "ans": ["C"], "exp": "Before any change is implemented, it must be documented as part of change management procedures. This ensures transparency, review, and tracking.", "src": "PDF"}, {"n": 405, "stem": ["An organization notices that its employees often leave their desks without logging off their workstations, leading to unauthorized access by other staff members. Which of the following should the IT department do to address this issue?"], "opts": [{"k": "A", "t": "Implement full disk encryption."}, {"k": "B", "t": "Disable remote desktop access."}, {"k": "C", "t": "Configure inactivity timeout settings."}, {"k": "D", "t": "Set up multifactor authentication."}], "ans": ["C"], "exp": "Configuring inactivity timeout settings automatically locks a workstation after a defined period of inactivity. This prevents unauthorized users from accessing a session when an employee leaves their desk without logging off, directly addressing the issue of unattended workstations.", "src": "PDF"}, {"n": 406, "stem": ["Which of the following provides information to employees, such as permitted activities when using the organization's resources?"], "opts": [{"k": "A", "t": "AUP"}, {"k": "B", "t": "MNDA"}, {"k": "C", "t": "DRM"}, {"k": "D", "t": "EULA"}], "ans": ["A"], "exp": "An Acceptable Use Policy outlines what activities employees are permitted or prohibited from performing when using the organization's IT resources. It provides clear guidance on acceptable behavior, ensuring users understand the rules governing company systems and data.", "src": "PDF"}, {"n": 407, "stem": ["A technician needs to perform remote maintenance on devices across the network. The devices may be unattended or in use by employees. Cross-platform support and built-in security are required. Which of the following remote technologies best meets these requirements?"], "opts": [{"k": "A", "t": "VNC"}, {"k": "B", "t": "RDP"}, {"k": "C", "t": "VPN"}, {"k": "D", "t": "SSH"}], "ans": ["D"], "exp": "SSH provides secure, encrypted remote access for maintenance tasks and supports multiple operating systems. It can be used on unattended systems or while employees continue using their devices without requiring a shared graphical session.", "src": "PDF"}, {"n": 408, "stem": ["Which of the following Linux commands is used to read another command's documentation?"], "opts": [{"k": "A", "t": "chmod"}, {"k": "B", "t": "cat"}, {"k": "C", "t": "man"}, {"k": "D", "t": "sudo"}], "ans": ["C"], "exp": "The man command displays the manual pages for other Linux commands. It provides detailed documentation, including usage, options, and descriptions, allowing users to read a command's official reference directly from the terminal.", "src": "PDF"}, {"n": 409, "stem": ["A new software installation requires administrative privileges for deployment. Which of the following is the best way to provide the necessary permissions to install the software?"], "opts": [{"k": "A", "t": "Granting just-in-time access"}, {"k": "B", "t": "Assigning the power user role"}, {"k": "C", "t": "Performing the installation manually"}, {"k": "D", "t": "Adding the user to the local administrator group"}], "ans": ["A"], "exp": "Granting just-in-time access provides temporary administrative privileges only for the duration required to perform the installation. This approach follows the principle of least privilege by minimizing the time elevated permissions are active, reducing security risk while still allowing the software to be deployed.", "src": "PDF"}, {"n": 410, "stem": ["An administrator is creating user accounts for a new vendor contract. The contract states that the users can work only during certain times. Which of the following should the administrator implement to comply with this requirement?"], "opts": [{"k": "A", "t": "Timeout policies by GPO user objects"}, {"k": "B", "t": "Alerts on authentication attempts outside of SLA requirements"}, {"k": "C", "t": "Expirations on the contractors' accounts"}, {"k": "D", "t": "Account login restrictions set to the specified hours"}], "ans": ["D"], "exp": "Account login restrictions configured for specified hours enforce time-based access control. This ensures users can authenticate only during approved working hours, directly meeting the contractual requirement without relying on monitoring or post-event actions.", "src": "PDF"}, {"n": 411, "stem": ["A technician is unable to join a computer to the Windows domain However, the computer can ping the domain controller by IP address. Which of the following is the most likely reason?"], "opts": [{"k": "A", "t": "The DNS settings are incorrect"}, {"k": "B", "t": "The firewall configuration is wrong"}, {"k": "C", "t": "IPv6 is enabled on the computer"}, {"k": "D", "t": "The computer is not connected to the network"}], "ans": ["A"], "exp": "Joining a Windows domain requires proper DNS resolution to locate the domain controller by name. Even though the computer can ping the domain controller by IP address, incorrect DNS settings prevent the system from resolving domain services, causing the domain join to fail.", "src": "PDF"}, {"n": 412, "stem": ["A technician is creating an MDM policy using hardening techniques that are unique to each user. Which of the following techniques is the technician using?"], "opts": [{"k": "A", "t": "A drawn pattern"}, {"k": "B", "t": "A fingerprint"}, {"k": "C", "t": "A password"}, {"k": "D", "t": "A PIV card"}], "ans": ["B"], "exp": "A fingerprint is a biometric hardening technique unique to each user, making it suitable for an MDM policy that requires individualized security.", "src": "PDF"}];

function begin(i){const e=EXAMS[i];S.run={exam:i,ans:{},flag:{},sec:0,cur:0,left:e.timeSec,since:Date.now(),paused:false,start:Date.now(),brk:0,mode:'q'};S.exam=i;save();show();startTick()}
function resumeRun(){S.exam=S.run.exam;show();startTick()}
function abandon(){if(confirm('إلغاء الاختبار الجاري؟')){S.run=null;save();home()}}
function show(){const r=S.run;if(!r)return home();if(r.brk)return brkScreen();if(r.mode==='rev')return review();question()}
function secOf(){return E().secs[S.run.sec]}
function question(){const r=S.run,e=E(),[a,b]=secOf();if(r.cur<a)r.cur=a;if(r.cur>=b)r.cur=b-1;const qi=e.ids[r.cur],q=QS[qi],sel=r.ans[qi]||[],multi=q.ans.length>1;
 app.innerHTML=`<div class="layout"><div class="card"><div class="qhead"><span class="pill">السؤال ${r.cur+1} من ${e.ids.length}</span>
 <button class="btn ghost flagbtn ${r.flag[qi]?'on':''}" onclick="toggleFlag(${qi})">⚑ ${r.flag[qi]?'مُعلَّم للمراجعة':'علِّم للمراجعة'}</button></div>
 ${qBody(q)}${multi&&q.type!=='cls'?`<div class="choose">اختر ${q.ans.length} — Choose ${q.ans.length}</div>`:''}${q.type==='cls'?'<div class="choose">صنّف كل عنصر (بديل السحب والإفلات) — Classify each item</div>':''}

 <div class="navrow"><div><button class="btn ghost" ${r.cur<=a?'disabled':''} onclick="go(${r.cur-1})">→ السابق</button>

 <div class="legend">■ مُجاب · ⚑ مُعلَّم · الأسئلة الباهتة خارج القسم الحالي (مقفلة أو لاحقة)</div></div></div>`;save()}
function qBody(q){const ps=q.stem;let ask=ps.length;
 // case study: show long passage collapsible; question = trailing paragraphs after the case narrative
 let caseTxt='',main=ps;if(ps.length>3){const k=ps.length-2-(/^\(Refer/.test(ps[ps.length-1])?0:-1);const cut=Math.max(1,Math.min(ps.length-1,k));caseTxt=ps.slice(0,cut);main=ps.slice(cut)}
 const ex=q.img?`<div class="exhibit"><img src="${q.img}" alt="Exhibit" onclick="zoom(this.src)"><div style="font-size:12px;color:var(--muted)">انقر للتكبير</div></div>`:'';
 return (caseTxt?`<details class="case" open><summary>نص دراسة الحالة (Case Study) — كما ورد في المصدر</summary><div class="qtext">${caseTxt.map(p=>`<p>${esc(p)}</p>`).join('')}</div></details>`:'')+ex+`<div class="qtext">${main.map(p=>`<p class="ask">${esc(p)}</p>`).join('')}</div>`}
function zoom(src){const d=document.createElement('div');d.id='zoom';d.innerHTML=`<img src="${src}">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
function clsUI(qi,q,sel){return q.items.map((it,i)=>`<div class="opt ${sel[i]?'sel':''}" style="cursor:default"><span class="k">${i+1}.</span><span style="flex:1">${esc(it)}</span><select class="cls" style="font-family:inherit;font-size:15px" onchange="pickCls(${qi},${i},this.value)"><option value="">— select —</option>${q.cats.map(c=>`<option ${sel[i]===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>`).join('')}
function pickCls(qi,i,v){const r=S.run,q=QS[qi];const a=(r.ans[qi]||[]).slice();while(a.length<q.items.length)a.push(null);a[i]=v||null;r.ans[qi]=a;question()}
function pick(qi,k,multi){const r=S.run;let s=r.ans[qi]||[];if(multi){s=s.includes(k)?s.filter(x=>x!==k):[...s,k].sort()}else s=[k];r.ans[qi]=s;question()}

 <div class="revlist">${items.map(x=>`<div class="revitem ${x.un?'un':''} ${x.fl?'fl':''}" onclick="go(${x.k})">سؤال ${x.k+1} ${x.un?'— غير مُجاب':''} ${x.fl?'⚑':''}</div>`).join('')}</div>

function takeBreak(){freeze();S.run.brk=Date.now()+E().breakSec*1000;S.run.mode='q';save();brkScreen();onTick()}
function brkScreen(){app.innerHTML=`<div class="card" style="text-align:center"><h2>☕ استراحة</h2><div class="big" id="brkt">${fmt((S.run.brk-Date.now())/1000)}</div><p>عدّاد الاختبار متوقف. الوقت المتبقي للاختبار: <b style="direction:ltr;display:inline-block">${fmt(S.run.left)}</b></p>

function endBreak(){if(!S.run.brk)return;S.run.brk=0;resume();save();question()}
function finish(auto){const r=S.run,e=E();freeze();let c=0;const rows=e.ids.map(id=>{const q=QS[id],a=(r.ans[id]||[]).slice(),ok=isCorrect(q,a);if(q.type!=='cls')a.sort();if(ok)c++;return{id,a,ok,fl:!!r.flag[id]}});
 S.last={exam:r.exam,rows,correct:c,total:e.ids.length,used:e.timeSec-Math.max(0,r.left),limit:e.timeSec,auto,at:Date.now()};

 ${q.type==='cls'?q.items.map((it,i)=>{const ok=x.a[i]===q.ans[i];return `<div class="opt ${ok?'correct':'wrong'}"><span class="k">${i+1}.</span><span style="flex:1">${esc(it)}</span><span class="tag">✔ ${esc(q.ans[i])}${ok?'':' · ✖ إجابتك: '+esc(x.a[i]||'—')}</span></div>`}).join(''):''}${q.opts.map(o=>{const c=q.ans.includes(o.k),m=x.a.includes(o.k);return `<div class="opt ${c?'correct':(m?'wrong':'')}"><span class="k">${o.k}.</span><span>${esc(o.t)}</span><span class="tag">${c?'✔ الإجابة الصحيحة':''}${m?(c?' · إجابتك':'✖ إجابتك'):''}</span></div>`}).join('')}

#abad-an .hd{background:linear-gradient(135deg,#10293b,#1b4562);color:#fff;border:0}
#abad-an .hd h3{color:#fff;font-size:1.3rem}
#abad-an .kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
#abad-an .kp div{background:#ffffff14;border-radius:12px;padding:10px 12px}
#abad-an .kp b{display:block;font-size:1.35rem;color:#F5BD2D;direction:ltr;unicode-bidi:isolate}
#abad-an .kp span{font-size:.82rem;opacity:.9}
#abad-an .vd{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:800;margin-top:10px}
#abad-an .vd.p{background:#1c8a57;color:#fff}#abad-an .vd.f{background:#c0392b;color:#fff}
#abad-an .dr{display:grid;grid-template-columns:minmax(120px,1.4fr) 3fr 64px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed #e3eaf1}
#abad-an .dr:last-child{border:0}
#abad-an .dn{font-weight:700;font-size:.92rem;line-height:1.4}#abad-an .dn small{display:block;font-weight:400;color:#5b7083;font-size:.75rem}
#abad-an .bt{position:relative;height:14px;background:#eaf1f7;border-radius:8px;overflow:hidden}
#abad-an .bt i{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:8px;background:#3f86b3}
#abad-an .bt i.w{background:#d9534f}#abad-an .bt i.s{background:#1c8a57}
#abad-an .bt u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#F5BD2D}
#abad-an .pc{font-weight:800;direction:ltr;text-align:end}
#abad-an .lg{font-size:.75rem;color:#5b7083;margin-top:6px}
#abad-an .sw{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#abad-an ul{margin:0;padding-inline-start:20px;line-height:1.8}
#abad-an .rec{background:#fff8e5;border-inline-start:4px solid #F5BD2D;border-radius:10px;padding:10px 12px;margin:8px 0}
#abad-an .rec b{color:#10293b}
#abad-an .wr{border:1px solid #f1d4d2;background:#fffafa;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:.9rem}
#abad-an .wr .q{font-weight:700;direction:ltr;text-align:left;unicode-bidi:plaintext}
#abad-an .wr .y{color:#c0392b}#abad-an .wr .c{color:#1c8a57}
#abad-an .wr .a{direction:ltr;text-align:left;unicode-bidi:plaintext;margin-top:4px}
#abad-an .tg{display:inline-block;background:#eaf1f7;color:#3f86b3;border-radius:999px;padding:1px 10px;font-size:.75rem;font-weight:700;margin-inline-end:6px}
#abad-an svg{width:100%;height:auto;display:block}
#abad-an .bx{display:flex;gap:10px;flex-wrap:wrap}
#abad-an .bb{font-family:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;background:#F5BD2D;color:#10293b;font-size:.95rem}
#abad-an .bb.g{background:#eaf1f7;color:#10293b}
#abad-an .mu{color:#5b7083;font-size:.82rem}
@media(max-width:640px){#abad-an .sw{grid-template-columns:1fr}#abad-an .dr{grid-template-columns:1fr 54px}#abad-an .dr .bt{grid-column:1/-1;grid-row:2}}
