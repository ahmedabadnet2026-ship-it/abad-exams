g network cables under a carpet creates a safety hazard, such as a tripping risk or potential damage to the cable. Proper cable management eliminates this hazard.", "src": "PDF"}, {"n": 228, "stem": ["An employee's company smartphone restarts frequently after the employee installs a messaging application. Which of the following should an IT specialist do first to troubleshoot the issue?"], "opts": [{"k": "A", "t": "Download and install OS updates."}, {"k": "B", "t": "Confirm whether the same issue occurs on a personal smartphone"}, {"k": "C", "t": "Wipe the phone and reinstall the application"}, {"k": "D", "t": "Uninstall the software and check the device for restarting issues"}], "ans": ["D"], "exp": "Following the troubleshooting methodology, the first step is to identify whether the newly installed application is causing the issue. Uninstalling the messaging application and observing whether the device continues to restart helps isolate the problem and confirms if the software is the root cause before performing more disruptive actions.", "src": "PDF"}, {"n": 229, "stem": ["A technician needs to provide remote support for a legacy Linux-based operating system from their Windows laptop. The solution needs to allow the technician to see what the user is doing and provide the ability to interact with the user's session. Which of the following remote access technologies would support the use case?"], "opts": [{"k": "A", "t": "VPN"}, {"k": "B", "t": "VNC"}, {"k": "C", "t": "SSH"}, {"k": "D", "t": "RDP"}], "ans": ["B"], "exp": "VNC is a graphical desktop-sharing system that uses the Remote Frame Buffer protocol (RFB) to remotely control another computer. It is platform-independent and widely supported on Linux, which makes it ideal for providing interactive remote support for a Linux-based operating system. It allows the technician not only to view the remote desktop session but also to control it, fulfilling the need to see and interact with the user's session.", "src": "PDF"}, {"n": 230, "stem": ["An employee is using a photo editing program. Certain features are disabled and require a log-in, which the employee does not have. Which of the following is a way to resolve this issue?"], "opts": [{"k": "A", "t": "License assignment"}, {"k": "B", "t": "VPN connection"}, {"k": "C", "t": "Application repair"}, {"k": "D", "t": "Program reinstallation"}], "ans": ["A"], "exp": "When features in an application are disabled pending a login, it typically indicates those capabilities are controlled by the software's licensing system. Assigning (or activating) the proper license entitles the user to those premium features, restoring full functionality without unnecessary repair or reinstall steps.", "src": "PDF"}, {"n": 231, "stem": ["A company executive is currently attending a major music festival with a large number of attendees and is having trouble accessing a work email account. The email application is not downloading emails and also appears to become stuck during connection attempts. Which of the following is most likely causing the disruption?"], "opts": [{"k": "A", "t": "The phone has no storage space available."}, {"k": "B", "t": "Company firewalls are configured to block remote access to email resources."}, {"k": "C", "t": "Too many devices in the same area are trying to connect to the mobile network."}, {"k": "D", "t": "The festival organizer prohibits internet usage during the event and has blocked the internet signa l"}], "ans": ["C"], "exp": "Large gatherings like music festivals often overwhelm local cellular towers due to the sheer number of devices competing for bandwidth and signal. This congestion can cause mobile applications, such as email clients, to stall or fail when attempting to download messages.", "src": "PDF"}, {"n": 232, "stem": ["A technician is preparing to replace the batteries in rack-mounted UPS system. After ensuring the power is turned off and the batteries are fully discharged, the technician needs to remove the battery modules from the bottom of the rack. Which of the following steps should the technician take?"], "opts": [{"k": "A", "t": "Ensure the fire suppression system is ready to be activated."}, {"k": "B", "t": "Use appropriate lifting techniques and guidelines."}, {"k": "C", "t": "Place the removed batteries in an antistatic bag."}, {"k": "D", "t": "Wear a face mask to filter out any harmful fumes."}], "ans": ["B"], "exp": "UPS battery modules are heavy and awkward; employing proper lifting techniques (e.g., lifting with the legs, keeping the back straight, and using team lifts or mechanical aids as necessary) prevents musculoskeletal injuries and ensures safe removal.", "src": "PDF"}, {"n": 233, "stem": ["A user receives a push notification to approve or deny a log-in request when using MFA. Which of the following describes this security measure?"], "opts": [{"k": "A", "t": "One-time password"}, {"k": "B", "t": "Zero Trust model"}, {"k": "C", "t": "Authenticator application"}, {"k": "D", "t": "Privileged access management"}], "ans": ["C"], "exp": "An authenticator application provides push notifications to approve or deny log-in requests as part of multi-factor authentication (MFA).", "src": "PDF"}, {"n": 234, "stem": ["A customer wants to be able to work from home but does not want to be responsible for bringing company equipment back and forth. Which of the following would allow the user to remotely access and use a Windows PC at the main office? (Choose two.)"], "opts": [{"k": "A", "t": "SPICE"}, {"k": "B", "t": "SSH"}, {"k": "C", "t": "RDP"}, {"k": "D", "t": "VPN"}, {"k": "E", "t": "RMM"}, {"k": "F", "t": "WinRM"}], "ans": ["C", "D"], "exp": "RDP (Remote Desktop Protocol): Allows the user to connect to and control the Windows PC's desktop environment from home. VPN (Virtual Private Network): Establishes a secure tunnel into the office network so the user's home device can reach the Windows PC before initiating the RDP session.", "src": "PDF"}, {"n": 235, "stem": ["An end user's computer is unable to start. A technician examines the machine and does not hear any unusual noises but determines that no OS is found. Which of the following is most likely corrupt?"], "opts": [{"k": "A", "t": "Basic input/output system"}, {"k": "B", "t": "New Technology File System"}, {"k": "C", "t": "Trusted Platform Module"}, {"k": "D", "t": "Master boot record"}], "ans": ["D"], "exp": "This component contains the information needed to locate and start the operating system during the boot process, and corruption prevents the system from finding the installed OS even when the hardware is functioning normally.", "src": "PDF"}, {"n": 236, "stem": ["A vendor normally releases security patches for its operating system on a monthly basis. An administrator receives an email from the vendor that says the vendor has published a patch for a zero-day flaw in its operating system outside of the normal patch schedule. Which of the following actions should the administrator take first in order to properly address this issue in a production environment?"], "opts": [{"k": "A", "t": "Wait until the next monthly patch is issued and deploy it with those updates."}, {"k": "B", "t": "Immediately deploy the patch to all company-owned computers."}, {"k": "C", "t": "Delay the patch deployment to not interfere with the production environment."}, {"k": "D", "t": "Deploy the patch to a small number of computers in order to test it in a lab."}], "ans": ["D"], "exp": "Testing the zero-day patch on a limited set of systems first ensures it does not negatively impact the production environment before wider deployment.", "src": "PDF"}, {"n": 237, "stem": ["A user's application only works with a legacy version of the OS. The OS is reaching its end of life date. For security reasons, the company is migrating to the current version of the OS. Which of the following is the most efficient way to complete the migration while maintaining accessibility to the application?"], "opts": [{"k": "A", "t": "Terminal server"}, {"k": "B", "t": "Bare-metal server"}, {"k": "C", "t": "Multiboot"}, {"k": "D", "t": "Virtualization"}], "ans": ["D"], "exp": "Virtualization allows the legacy OS to be run in a virtual machine (VM) on top of the newer OS. This method provides backward compatibility without requiring outdated operating systems on physical hardware.", "src": "PDF"}, {"n": 238, "stem": ["A company recently transitioned to a cloud-based productivity suite and wants to secure the environment from external threat actors. Which of the following is the most effective method?"], "opts": [{"k": "A", "t": "Multifactor authentication"}, {"k": "B", "t": "Encryption"}, {"k": "C", "t": "Backups"}, {"k": "D", "t": "Strong passwords"}], "ans": ["A"], "exp": "While strong passwords and encryption are important, multifactor authentication (MFA) provides the most effective defense against external threat actors targeting cloud-based services. By requiring a second verification step, such as a push notification, one-time code, or hardware token, MFA ensures that even if credentials are compromised, attackers cannot gain access without the additional factor. This significantly reduces the risk of unauthorized account takeovers in cloud environments.", "src": "PDF"}, {"n": 239, "stem": ["Which of the following filesystem types does the Linux OS use?"], "opts": [{"k": "A", "t": "exFAT"}, {"k": "B", "t": "APFS"}, {"k": "C", "t": "ext4"}, {"k": "D", "t": "NTFS"}], "ans": ["C"], "exp": "ext4 (Fourth Extended Filesystem) is the default filesystem for most Linux distributions. It offers improved performance, reliability, and support for large volumes and files compared to its predecessors (ext2/ext3).", "src": "PDF"}, {"n": 240, "stem": ["A user reports that their computer is running extremely slowly. They are also often redirected to unknown websites when attempting to access internal applications. The computer's antivirus software is outdated, and the user cannot access certain security-related settings. A network administrator confirms that all other workstations are operating normally, and network diagnostics show no issues. Which of the following should the administrator do next to troubleshoot these issues?"], "opts": [{"k": "A", "t": "Check the firewall settings for unauthorized changes or blocked applications."}, {"k": "B", "t": "Clear the browser's cookies and cache and test access to internal applications again."}, {"k": "C", "t": "Disconnect the device from the network and investigate further."}, {"k": "D", "t": "Set the security settings to the highest level and restart the computer."}], "ans": ["C"], "exp": "The symptoms indicate a likely malware infection on the endpoint. Disconnecting the device from the network is the first step to contain the threat and prevent further spread or data exfiltration before continuing investigation and remediation.", "src": "PDF"}, {"n": 241, "stem": ["A software developer has tested an enhancement that would improve performance of the company's critical, cloud-deployed applications. The developer has shared the results with peers and received positive feedback. Which of the following change management procedures should the developer perform next?"], "opts": [{"k": "A", "t": "Seek end-user acceptance."}, {"k": "B", "t": "Submit relevant requests for approval."}, {"k": "C", "t": "Determine organizational impact."}, {"k": "D", "t": "Document the scope of the change."}], "ans": ["B"], "exp": "After peer review, the next step in change management is to formally submit the change request for approval so it can be evaluated, scheduled, and implemented through the proper governance process.", "src": "PDF"}, {"n": 242, "stem": ["A Windows 11 Home device is receiving constant pop-ups about an urgent need to update antivirus software to remove a detected threat. The user has been clicking the \"X\" button in the window frame but it always reappears. The pop-up includes an \"OK\" button to install the update and remove the threat. Which of the following should the user do next?"], "opts": [{"k": "A", "t": "Click the \"OK\" button to install the update"}, {"k": "B", "t": "Reinstall the Windows Operating System"}, {"k": "C", "t": "Run System File Checker"}, {"k": "D", "t": "Verify the current status and settings of protection measures"}], "ans": ["D"], "exp": "The user should verify the current status and settings of legitimate protection measures to determine if the pop-ups are real or part of a scam or malware infection, instead of clicking \"OK\" or taking drastic measures.", "src": "PDF"}, {"n": 243, "stem": ["Which of the following is required to have a central log-in for a Windows computer?"], "opts": [{"k": "A", "t": "Domain membership"}, {"k": "B", "t": "Workgroup"}, {"k": "C", "t": "Active Directory"}, {"k": "D", "t": "Local Group Policy Editor"}], "ans": ["A"], "exp": "A Windows computer must be joined to a domain to support centralized authentication. Domain membership allows users to log in using centrally managed credentials controlled by domain services rather than local accounts.", "src": "PDF"}, {"n": 244, "stem": ["A smartphone user unsuccessfully attempts to open an email attachment that includes an unexpected overdue invoice. After that attempt, the user notices performance issues while using the mobile browser and other applications. The user restarts the smartphone, but the issue persists. Which of the following actions would most likely resolve the issue?"], "opts": [{"k": "A", "t": "Forcing the smartphone to shut down and restarting it"}, {"k": "B", "t": "Deleting the email containing the attachment"}, {"k": "C", "t": "Wiping the device and resetting it to factory defaults"}, {"k": "D", "t": "Uninstalling and reinstalling the mobile browser"}], "ans": ["C"], "exp": "The symptoms indicate a likely malware infection from the suspicious email attachment. A factory reset is the most effective way to fully remove malware and restore normal device performance.", "src": "PDF"}, {"n": 245, "stem": ["A customer's laptop will not turn on. The customer is distraught and panicking because the laptop contains family pictures that can never be replaced. Which of the following communication techniques is most important for the technician to demonstrate in this situation?"], "opts": [{"k": "A", "t": "The technician should provide the customer with the appropriate SLA"}, {"k": "B", "t": "The technician should inform the customer about replacement options for an increased cost"}, {"k": "C", "t": "The technician should project confidence and maintain a positive attitude"}, {"k": "D", "t": "The technician should be dressed in appropriate business casual attire"}], "ans": ["C"], "exp": "In emotionally sensitive situations, it is critical that the technician projects confidence and maintains a calm, positive demeanor to reassure the customer.", "src": "PDF"}, {"n": 246, "stem": ["A user downloads an application with a plug-in that is designed to automatically prompt for an OTP when the user browses to a specific website. The plug-in installs without any warnings or errors. The first time the user goes to the site, the prompt does not open, and the user cannot access the site. Which of the following browser settings should the user configure?"], "opts": [{"k": "A", "t": "Extensions/add-ins"}, {"k": "B", "t": "Certificate validity"}, {"k": "C", "t": "Proxy settings"}, {"k": "D", "t": "Trusted sources"}], "ans": ["A"], "exp": "The user should configure extensions/add-ins settings because the plug-in (extension) may be disabled or blocked, preventing it from prompting for the OTP as intended.", "src": "PDF"}, {"n": 247, "stem": ["A technician is working on multiple remote machines using a command line. Which of the following commands should the technician use to verify which SMB shares are currently mapped?"], "opts": [{"k": "A", "t": "systeminfo"}, {"k": "B", "t": "hostname"}, {"k": "C", "t": "net use"}, {"k": "D", "t": "nslookup"}], "ans": ["C"], "exp": "This command displays all currently mapped network connections, including active SMB shares and their associated drive letters on the system.", "src": "PDF"}, {"n": 248, "stem": ["A user's monitor shows strange colored lines and flickers when adjusting the brightness. The user requires the device for daily professional tasks. Which of the following should a technician do to effectively address the screen issue, given cost and urgency considerations?"], "opts": [{"k": "A", "t": "Suggest the user use a secondary monitor for essential tasks."}, {"k": "B", "t": "Conduct a factory reset to eliminate software issues"}, {"k": "C", "t": "Install a screen protector to minimize flickering."}, {"k": "D", "t": "Check for loose connections on the display."}], "ans": ["D"], "exp": "Strange colored lines and flickering when adjusting brightness are commonly caused by a loose or faulty display cable connection. Checking and securing the connection is a quick, low-cost step that can immediately resolve the issue without interrupting the user's work.", "src": "PDF"}, {"n": 249, "stem": ["Which of the following tasks would most likely be automated by utilizing a script?"], "opts": [{"k": "A", "t": "Overclocking processors"}, {"k": "B", "t": "Troubleshooting BSODs"}, {"k": "C", "t": "Creating user accounts"}, {"k": "D", "t": "Monitoring room humidity"}], "ans": ["C"], "exp": "Creating user accounts is a repetitive administrative task that can be efficiently automated with scripts to streamline provisioning and reduce manual effort.", "src": "PDF"}, {"n": 250, "stem": ["Performance on a user's smartphone is degrading. Applications take a long time to start, and switching between windows also takes a long time. Which of the following diagnostic steps should a mobile technician take first?"], "opts": [{"k": "A", "t": "Restore the phone to factory settings"}, {"k": "B", "t": "Restart the phone"}, {"k": "C", "t": "Check the phone's battery state"}, {"k": "D", "t": "Uninstall unneeded applications"}], "ans": ["B"], "exp": "Restarting the phone is a simple first diagnostic step that can resolve performance issues by clearing temporary memory and processes.", "src": "PDF"}, {"n": 251, "stem": ["A user wants to use a USB to move a 4.57GB .pst file from one Windows computer to another. Which of the following filesystems should the USB be formatted with?"], "opts": [{"k": "A", "t": "ext4"}, {"k": "B", "t": "NTFS"}, {"k": "C", "t": "FAT32"}, {"k": "D", "t": "APFS"}], "ans": ["B"], "exp": "FAT32 cannot support files larger than 4GB. NTFS supports large file sizes and is compatible across Windows systems, making it the correct choice for transferring a 4.57GB file.", "src": "PDF"}, {"n": 252, "stem": ["A user's smartphone has stopped connecting to corporate Wi-Fi networks. The user has tried restarting the phone, but the issue persists. The device indicates full signal strength but fails to obtain an IP address during connection attempts. The user also notes that the smartphone can still connect to cellular data without any issues. Which of the following is the most likely cause of the connectivity issue?"], "opts": [{"k": "A", "t": "DHCP server failure"}, {"k": "B", "t": "Outdated smartphone firmware"}, {"k": "C", "t": "Malfunctioning Wi-Fi antenna"}, {"k": "D", "t": "Insufficient Wi-Fi signal strength"}], "ans": ["A"], "exp": "The device detects the Wi-Fi network and has strong signal but cannot obtain an IP address, indicating a failure in the DHCP process. This points to an issue with the DHCP server rather than signal strength or hardware.", "src": "PDF"}, {"n": 253, "stem": ["Recently, the number of users sharing smartphone passcodes has increased. The management team wants a technician to deploy a more secure screen lock method. Which of the following technologies should the technician use?"], "opts": [{"k": "A", "t": "Pattern lock"}, {"k": "B", "t": "Facial recognition"}, {"k": "C", "t": "Device encryption"}, {"k": "D", "t": "Multifactor authentication"}], "ans": ["B"], "exp": "Facial recognition leverages biometric characteristics unique to each user, offering stronger security than shared passcodes or easily observed pattern locks. It ensures that only the enrolled individual can unlock the device, reducing the risk of unauthorized access from shared codes.", "src": "PDF"}, {"n": 254, "stem": ["A user's new laptop, which was advertised as gaming ready, is performing slowly when the user is playing a modern game. However, when the user is playing a less resource-demanding game, the user does not see any lag. Which of the following should a technician do to resolve the issue?"], "opts": [{"k": "A", "t": "Overclock the RAM."}, {"k": "B", "t": "Enable NIC teaming."}, {"k": "C", "t": "Select dedicated graphics."}, {"k": "D", "t": "Activate CPU hyperthreading."}], "ans": ["C"], "exp": "Modern games require significant graphical processing power, and systems with both integrated and dedicated graphics may default to the integrated option to save power. Selecting the dedicated graphics processor ensures the game uses the more powerful GPU, resolving performance issues during demanding gameplay.", "src": "PDF"}, {"n": 255, "stem": ["After a recent system update, a user's Windows 11 computer begins to experience slower boot times. The user notices additional icons are in the system tray. Which of the following should a technician do first to resolve the issue?"], "opts": [{"k": "A", "t": "Disable unnecessary startup applications."}, {"k": "B", "t": "Uninstall the recent system update"}, {"k": "C", "t": "Run a full system antivirus scan."}, {"k": "D", "t": "Increase virtual memory allocation."}, {"k": "E", "t": "Perform a system restore to a point before the update."}], "ans": ["A"], "exp": "Disabling unnecessary startup applications reduces the number of programs loading during boot, which directly addresses slower startup times and the presence of new system tray icons after the update.", "src": "PDF"}, {"n": 256, "stem": ["Which of the following is the best option to maintain a stable, tethered connection between a cell phone and a laptop?"], "opts": [{"k": "A", "t": "Bluetooth"}, {"k": "B", "t": "USB"}, {"k": "C", "t": "Hotspot"}, {"k": "D", "t": "NFC"}], "ans": ["B"], "exp": "A USB connection provides a direct wired link between the phone and laptop, offering the most stable and reliable tethered connection with consistent speed and minimal interference compared to wireless options.", "src": "PDF"}, {"n": 257, "stem": ["The battery on a user's smartphone discharges quickly when the user travels. The smartphone was replaced two weeks ago. Which of the following should a technician do first?"], "opts": [{"k": "A", "t": "Replace the battery with a higher capacity option"}, {"k": "B", "t": "Provide an external battery to extend the usage time"}, {"k": "C", "t": "Ensure that the charging port is working as expected"}, {"k": "D", "t": "Look for applications that are reporting the highest utilization"}], "ans": ["D"], "exp": "The technician should first look for applications reporting the highest utilization, as some apps or services may be consuming excessive battery, especially when the user is traveling.", "src": "PDF"}, {"n": 258, "stem": ["A technician completes malware remediation on a computer. Which of the following steps would most likely prevent future infections?"], "opts": [{"k": "A", "t": "Enabling System Restore"}, {"k": "B", "t": "User education"}, {"k": "C", "t": "Scheduled AV scans"}, {"k": "D", "t": "Symptom verification"}], "ans": ["B"], "exp": "User education is the most effective long-term method to prevent future infections because it helps users recognize and avoid unsafe behaviors that commonly lead to malware incidents.", "src": "PDF"}, {"n": 259, "stem": ["A technician installed, configured, and hardened a SOHO firewall to meet a customer's needs. The customer asks the technician what can be done to keep the firewall secure in the future. Which of the following should the technician recommend?"], "opts": [{"k": "A", "t": "Changing all of the default passwords"}, {"k": "B", "t": "Scheduling regular firmware updates"}, {"k": "C", "t": "Verifying all unneeded ports are disabled"}, {"k": "D", "t": "Keeping the firewall in a secure location"}], "ans": ["B"], "exp": "Regular firmware updates ensure the firewall receives security patches, vulnerability fixes, and performance improvements, helping maintain protection against newly discovered threats over time.", "src": "PDF"}, {"n": 260, "stem": ["A technician is working on a user's computer. The technician wants to log in to the intranet on the computer without logging the current user out. Which of the following should the technician do?"], "opts": [{"k": "A", "t": "Configure the proxy server."}, {"k": "B", "t": "Enable the pop-up blocker on the browser."}, {"k": "C", "t": "Use private browsing."}, {"k": "D", "t": "Clear the browser cache."}], "ans": ["C"], "exp": "Private browsing allows the technician to log in to the intranet without affecting the current user's session, cookies, or logins.", "src": "PDF"}, {"n": 261, "stem": ["An employee's corporate phone is experiencing connectivity issues. The user is unable to access the internet, send emails, or use business applications outside the office. The device is not in airplane mode, and Wi-Fi is turned off. Which of the following is the most likely cause of the issue?"], "opts": [{"k": "A", "t": "The SIM is malfunctioning and needs to be replaced."}, {"k": "B", "t": "The user has exceeded the phone's mobile data plan."}, {"k": "C", "t": "The SSID settings are misconfigured."}, {"k": "D", "t": "The phone is missing security updates."}], "ans": ["B"], "exp": "If Wi-Fi is turned off and the user cannot access internet services outside the office, the device relies on cellular data. Exceeding the mobile data plan can result in restricted or blocked data access, preventing internet connectivity, email, and application usage.", "src": "PDF"}, {"n": 262, "stem": ["A user logs in to a computer each morning and tries to print a daily report, but it will not print. The user calls the help desk, they change a setting, and the user is able to print that day but the same issue happens again the next day. Because the issue occurs every day, the issue gets escalated. Which of the following does the technician need to do so the user does not have to report the issue every day? (Choose two.)"], "opts": [{"k": "A", "t": "Set the print spooler to have no dependencies"}, {"k": "B", "t": "Set the print spooler recovery to take no action"}, {"k": "C", "t": "Start the printer extensions and notifications service"}, {"k": "D", "t": "Start the print spooler service"}, {"k": "E", "t": "Set the print spooler to Automatic"}, {"k": "F", "t": "Set the print spooler log-on to the user's account"}], "ans": ["D", "E"], "exp": "Starting the print spooler service ensures printing functionality is restored immediately. Setting the print spooler to Automatic ensures the service starts each time the computer boots, preventing the issue from recurring daily.", "src": "PDF"}, {"n": 263, "stem": ["A user reports that their internally hosted CRM application splash screen attempts to load, pauses for a few seconds, and then disappears. A technician installs the application software on their computer and is able to recreate the issue. When checking the application logs, the technician sees the following: Windows could not start the CRM Service on Local Computer 10169. The service did not start due to a log-on failure. Which of the following would most likely cause this issue?"], "opts": [{"k": "A", "t": "The user typed their account password incorrectly."}, {"k": "B", "t": "The bandwidth available is insufficient to run the application."}, {"k": "C", "t": "VLAN settings are blocking communication to the hosted application."}, {"k": "D", "t": "The LDAP service account used by the service is disabled."}, {"k": "E", "t": "The computer does not meet minimum hardware specifications."}], "ans": ["D"], "exp": "The log entry indicates the CRM service cannot start due to a log-on failure, which most commonly occurs when the service account used to run the application (often an LDAP/domain service account) is disabled or has incorrect credentials. This prevents the required background service from starting and causes the application to close immediately.", "src": "PDF"}, {"n": 264, "stem": ["A technician is helping a remote user. The technician asks the user to open a specific folder on the root directory of the computer. The user cannot find a folder with that name. The technician explains that a few settings are needed to allow the folder to appear. Which of the following should the user do to be able to see the folder? (Choose two.)"], "opts": [{"k": "A", "t": "Adjust the display properties."}, {"k": "B", "t": "Open File Explorer."}, {"k": "C", "t": "Open the root drive properties."}, {"k": "D", "t": "Configure the system settings."}, {"k": "E", "t": "Set the view extensions to \"on\"."}, {"k": "F", "t": "Check the box to view hidden files."}], "ans": ["B", "F"], "exp": "Opening File Explorer is required to access folder view options and navigate to the root directory. Viewing hidden files must be enabled because some system folders are hidden by default and will not appear until this option is checked.", "src": "PDF"}, {"n": 265, "stem": ["A user is unable to see transaction details on a website, and nothing happens when the user clicks the details button. Which of the following should the user do to fix this issue?"], "opts": [{"k": "A", "t": "Clear the browser cache."}, {"k": "B", "t": "Disable the pop-up blocker."}, {"k": "C", "t": "Configure private browsing."}, {"k": "D", "t": "Verify valid certificates."}], "ans": ["B"], "exp": "Pop-up blockers can sometimes prevent essential pop-up windows required by websites to display transaction details. Clear the browser cache: Helps with loading issues but not specific to pop-ups. Disable the pop-up blocker: The correct solution, as it allows the blocked pop-up to be displayed. Configure private browsing: Prevents storing browsing data but does not affect pop-ups. Verify valid certificates: Ensures secure connections but does not resolve pop-up issues.", "src": "PDF"}, {"n": 266, "stem": ["MFA for a custom web application on a user's smartphone is no longer working. The last time the user remembered it working was before taking a vacation to another country. Which of the following should the technician do first?"], "opts": [{"k": "A", "t": "Verify the date and time settings."}, {"k": "B", "t": "Apply mobile OS patches."}, {"k": "C", "t": "Uninstall and reinstall the application."}, {"k": "D", "t": "Escalate to the website developer."}], "ans": ["A"], "exp": "Time-based one-time password (TOTP) MFA apps rely on accurate clock synchronization. Traveling can desynchronize the device's clock, causing generated codes to be invalid. Ensuring the smartphone's date/time (and time zone) are correct will typically restore MFA functionality immediately.", "src": "PDF"}, {"n": 267, "stem": ["A support specialist must allocate a shared folder. Which of the following commands should the specialist use?"], "opts": [{"k": "A", "t": "cd"}, {"k": "B", "t": "net use"}, {"k": "C", "t": "mkdir"}, {"k": "D", "t": "ipconfig"}], "ans": ["C"], "exp": "The mkdir command is used to create a new directory, which is the required step when allocating a shared folder.", "src": "PDF"}, {"n": 268, "stem": ["A user must perform a series of commands each day on a Linux server. The user wants to use a script to automate the process. Which of the following is the most likely file type for the script?"], "opts": [{"k": "A", "t": ".js"}, {"k": "B", "t": ".vbs"}, {"k": "C", "t": ".bat"}, {"k": "D", "t": ".sh"}], "ans": ["D"], "exp": "Linux shell scripts use the .sh extension, making it the appropriate choice for automating commands on a Linux server.", "src": "PDF"}, {"n": 269, "stem": ["A user has been adding data to the same spreadsheet for several years. After adding a significant amount of data, they are now unable to open the file. Which of the following should a technician do to resolve the issue?"], "opts": [{"k": "A", "t": "Revert the spreadsheet to the last restore point."}, {"k": "B", "t": "Increase the amount of RAM."}, {"k": "C", "t": "the storage drive."}, {"k": "D", "t": "Upgrade the network connection speed."}], "ans": ["B"], "exp": "As spreadsheets grow in size and complexity, they demand more system memory to load and manipulate data. If the file becomes so large that the available RAM is insufficient, the application may fail to open it. Adding more RAM gives the spreadsheet software the resources it needs to load and work with the expanded dataset.", "src": "PDF"}, {"n": 270, "stem": ["A technician needs to install an operating system on a large number of workstations. Which of the following is the fastest method?"], "opts": [{"k": "A", "t": "Physical media"}, {"k": "B", "t": "Mountable ISO"}, {"k": "C", "t": "Manual installation"}, {"k": "D", "t": "Image deployment"}], "ans": ["D"], "exp": "Image deployment allows you to create a standardized OS image with preconfigured settings and applications and then push it simultaneously to multiple workstations over the network or via multicast. This is far faster than using physical media, manual installations, or mounting ISOs one-byone.", "src": "PDF"}, {"n": 271, "stem": ["A user calls the help desk to report an issue with their smartphone. After the user returns from a business trip, the user is no longer able to access email or visit websites without a Wi-Fi connection on the smartphone. Which of the following would the user do to most likely resolve the issue?"], "opts": [{"k": "A", "t": "Enable cellular data."}, {"k": "B", "t": "Increase data limits."}, {"k": "C", "t": "Disconnect the VPN."}, {"k": "D", "t": "Reinstall the SIM card"}], "ans": ["A"], "exp": "If the smartphone works only on Wi-Fi and not on mobile networks, the most likely cause is that cellular data is disabled. Enabling cellular data restores access to email and websites while away from Wi-Fi.", "src": "PDF"}, {"n": 272, "stem": ["Independent contractors often work from a business's lobby. Although the business has WiFi. contractors often plug in their laptops to Ethernet ports in the lobby. Which of the following should a security engineer do to most efficiently address a potential security concern with this network setup?"], "opts": [{"k": "A", "t": "Configure WPA3 encryption on the Wi-Fi router."}, {"k": "B", "t": "Disable lobby ports and restrict external users to the guest wireless network."}, {"k": "C", "t": "Use a protocol analyzer to check for malicious traffic on the network."}, {"k": "D", "t": "Install signage telling external users not to use Ethernet ports."}], "ans": ["B"], "exp": "Disabling the lobby Ethernet ports and forcing contractors onto a segmented guest Wi-Fi network prevents unauthorized or unmanaged devices from connecting directly to the internal network, efficiently addressing the security risk.", "src": "PDF"}, {"n": 273, "stem": ["A user reports a critical application issue. The user tells the technician that a former IT employee previously resolved this same issue. Which of the following steps should the technician take first?"], "opts": [{"k": "A", "t": "Consult the technician who previously solved the issue."}, {"k": "B", "t": "Escalate the issue to the software manufacturer to develop a patch."}, {"k": "C", "t": "Review the ticketing system for details related to the prior occurrence."}, {"k": "D", "t": "Open a case to document the issue and progress until the issue is resolved."}], "ans": ["C"], "exp": "Reviewing the ticketing system for details related to the prior occurrence is the first step because it allows the technician to gather relevant historical information and previously documented resolutions. This supports efficient troubleshooting by leveraging existing knowledge before taking further action.", "src": "PDF"}, {"n": 274, "stem": ["A customer wants to format an external hard drive to work on both Windows and macOS. Which of the following filesystems is the best to use?"], "opts": [{"k": "A", "t": "NTFS"}, {"k": "B", "t": "exFAT"}, {"k": "C", "t": "APFS"}, {"k": "D", "t": "XFS"}], "ans": ["B"], "exp": "exFAT is natively supported for both read and write access on Windows and macOS. It is specifically designed for removable storage and supports large files and large volumes, making it the best choice for cross-platform compatibility.", "src": "PDF"}, {"n": 275, "stem": ["A technician installs VPN client software that has a software bug from the vendor. After the vendor releases an update to the software, the technician attempts to reinstall the software but keeps getting an error message that the network adapter for the VPN already exists. Which of the following should the technician do next to mitigate this issue?"], "opts": [{"k": "A", "t": "Run the latest OS security updates."}, {"k": "B", "t": "Map the network adapter to the new software."}, {"k": "C", "t": "Update the network adapter's firmware."}, {"k": "D", "t": "Delete hidden network adapters."}], "ans": ["D"], "exp": "When uninstalling and reinstalling network-based software like a VPN client, orphaned or \"ghost\" adapters can linger in the system, especially if they're no longer visible in Device Manager. Removing these hidden adapters clears the path for the updated client software to recreate its virtual network interface without conflict.", "src": "PDF"}, {"n": 276, "stem": ["A help desk technician is using a local network server for image deployment. Which of following should the technician use to connect a workstation to the server and begin downloading the image?"], "opts": [{"k": "A", "t": "PXE"}, {"k": "B", "t": "SFTP"}, {"k": "C", "t": "SAN"}, {"k": "D", "t": "USB"}], "ans": ["A"], "exp": "PXE (Preboot Execution Environment) allows a workstation to boot from the network and connect to an imaging server to download and deploy system images.", "src": "PDF"}, {"n": 277, "stem": ["After several workstations received OS updates, users report that their network speeds have dropped. A technician verifies that the network speeds on other workstations are fine. Which of the following would most likely solve the issue on the updated workstations?"], "opts": [{"k": "A", "t": "Rolling back to the previous driver"}, {"k": "B", "t": "Replacing the network cards"}, {"k": "C", "t": "Restarting the router"}, {"k": "D", "t": "Switching the workstations to IPv6"}], "ans": ["A"], "exp": "The issue began after OS updates and affects only specific workstations, indicating a likely driverrelated problem. Rolling back to the previous network driver can restore proper performance if the updated driver introduced compatibility or performance issues.", "src": "PDF"}, {"n": 278, "stem": ["Which of the following filesystems allows a macOS to write data?"], "opts": [{"k": "A", "t": "NTFS"}, {"k": "B", "t": "ReFS"}, {"k": "C", "t": "exFAT"}, {"k": "D", "t": "XFS"}], "ans": ["C"], "exp": "exFAT is supported by macOS for both reading and writing, making it a common cross-platform filesystem for external drives shared between macOS and Windows.", "src": "PDF"}, {"n": 279, "stem": ["Which of the following applications allows a user to create backups in macOS?"], "opts": [{"k": "A", "t": "Time Machine"}, {"k": "B", "t": "FileVault"}, {"k": "C", "t": "Keychain"}, {"k": "D", "t": "Mission Control"}], "ans": ["A"], "exp": "Time Machine (Option A) is macOS's built-in backup application. It allows users to automatically back up their entire system, including apps, music, photos, emails, and system files. Time Machine provides an easy way to restore files from a previous state or recover from a system failure.", "src": "PDF"}, {"n": 280, "stem": ["A technician receives a ticket from a user that reads, \"My computer is having issues.\" Which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Review the user's system resources."}, {"k": "B", "t": "Ask the user to resubmit a ticket with more information."}, {"k": "C", "t": "Upgrade the user's computer."}, {"k": "D", "t": "Ask the user follow-up questions."}], "ans": ["D"], "exp": "Asking follow-up questions allows the technician to gather the details needed to diagnose the vague issue described in the ticket.", "src": "PDF"}, {"n": 281, "stem": ["A new employee at a 3D-printing company is in training. The employee's first training task is to learn about health hazards at the company. Which of the following documents should the new employee read?"], "opts": [{"k": "A", "t": "NDA"}, {"k": "B", "t": "SDS"}, {"k": "C", "t": "EULA"}, {"k": "D", "t": "AUP"}], "ans": ["B"], "exp": "A Safety Data Sheet provides information about chemical hazards, handling, storage, and safety precautions, which is essential for understanding workplace health risks.", "src": "PDF"}, {"n": 282, "stem": ["A user needs to download some files from a vendor website. Downloading the specific file type is blocked when using the Microsoft Edge web browser. A technician determines that the files the user wants to download are safe. Which of the following should the technician configure to allow these files to be downloaded?"], "opts": [{"k": "A", "t": "Defender"}, {"k": "B", "t": "SmartScreen"}, {"k": "C", "t": "User Account Control"}, {"k": "D", "t": "Firewall"}], "ans": ["B"], "exp": "Microsoft Edge uses SmartScreen to block potentially unsafe downloads. If a known safe file type is being blocked, configuring or adjusting SmartScreen settings allows the download to proceed while maintaining browser-based security controls.", "src": "PDF"}, {"n": 283, "stem": ["A user notices that their smartphone's data usage has increased significantly even when the device is not in use. The phone feels warm, and its battery drains quickly. Which of the following should the user do to address this issue?"], "opts": [{"k": "A", "t": "Check for malicious applications."}, {"k": "B", "t": "Disable the Wi-Fi and mobile networks."}, {"k": "C", "t": "Reset the device to its factory defaults."}, {"k": "D", "t": "Enable airplane mode temporarily."}], "ans": ["A"], "exp": "Unusual data usage, overheating, and rapid battery drain are common signs of malicious applications running in the background. The user should check for and remove any suspicious or unauthorized apps to stop unwanted background activity and restore normal device behavior.", "src": "PDF"}, {"n": 284, "stem": ["A user created a document using online collaboration tools, and the document is not available on their laptop now. Which of the following should a desktop technician do to remediate the issue?"], "opts": [{"k": "A", "t": "Synchronize the remote folder with the user's laptop."}, {"k": "B", "t": "Download the file and send it to the user using instant messaging."}, {"k": "C", "t": "Install word processing tools on the user's laptop."}, {"k": "D", "t": "Connect the user's laptop to Wi-Fi."}], "ans": ["A"], "exp": "The document was created using online collaboration tools, meaning it resides in cloud storage. To make it available on the laptop, the technician must synchronize the remote (cloud) folder with the local device, ensuring the file is downloaded and accessible.", "src": "PDF"}, {"n": 285, "stem": ["Which of the following display technologies is known for offering the highest contrast ratios?"], "opts": [{"k": "A", "t": "LCD"}, {"k": "B", "t": "LED"}, {"k": "C", "t": "OLED"}, {"k": "D", "t": "QLED"}], "ans": ["C"], "exp": "OLED displays use self-emissive pixels that can turn off completely, producing true blacks and resulting in the highest contrast ratios among display technologies.", "src": "PDF"}, {"n": 286, "stem": ["A technician follows the proper procedure for malware removal on an infected computer. However, the technician is unable to remove all the malware and decides to reload the OS. Which of the following should the technician select?"], "opts": [{"k": "A", "t": "Version upgrade"}, {"k": "B", "t": "System restore"}, {"k": "C", "t": "OS repair"}, {"k": "D", "t": "Clean install"}], "ans": ["D"], "exp": "A clean install removes the current OS and all existing data, ensuring all malware is eliminated from the system.", "src": "PDF"}, {"n": 287, "stem": ["A help desk technician needs to remove RAM from retired workstations and upgrade other workstations that have applications that use more memory with this RAM. Which of the following actions would the technician most likely take?"], "opts": [{"k": "A", "t": "Demagnetize memory for security."}, {"k": "B", "t": "Use antistatic bags for storage and transport."}, {"k": "C", "t": "Plug in the power supply to ground each workstation."}, {"k": "D", "t": "Install memory in identical pairs."}], "ans": ["B"], "exp": "When handling and moving RAM modules, it's vital to protect them from electrostatic discharge (ESD). Storing the removed RAM in antistatic bags prevents damage during transport or while they're in storage before being installed in other workstations.", "src": "PDF"}, {"n": 288, "stem": ["After using a third-party disk optimization software package, a technician restarts a laptop and receives the message No operating system found. The technician verifies that the BIOS properly recognizes the SSD. Which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Update BitLocker settings in the BIOS"}, {"k": "B", "t": "Replace the CMOS battery"}, {"k": "C", "t": "Boot from installation media and repair the MBR"}, {"k": "D", "t": "Isolate the system from the corporate network"}], "ans": ["C"], "exp": "Repairing the Master Boot Record (MBR) from installation media is the next step, as the disk optimization software may have corrupted or removed the boot information, causing the \"No operating system found\" error.", "src": "PDF"}, {"n": 289, "stem": ["A developer asks a public chatbot to generate a function to convert a .pdf file into a Word document. The chatbot responds that the function exists in the pdf2word library. However, the developer cannot find any evidence that this library exists. Which of the following describes what most likely happened with the chatbot?"], "opts": [{"k": "A", "t": "Plagiarized public repository content"}, {"k": "B", "t": "Leaked proprietary information"}, {"k": "C", "t": "Misunderstood the developer's request"}, {"k": "D", "t": "Hallucinated the solution"}], "ans": ["D"], "exp": "A hallucination occurs when a chatbot generates information that sounds plausible but is not factually supported. In this case, the chatbot invented or incorrectly referenced a library that the developer could not verify.", "src": "PDF"}, {"n": 290, "stem": ["A technician wears a wrist strap while replacing RAM. Which of the following describes the purpose of the wrist strap during this task?"], "opts": [{"k": "A", "t": "To replicate electrostatic charge"}, {"k": "B", "t": "To increase electrostatic charge"}, {"k": "C", "t": "To ground electrostatic charge"}, {"k": "D", "t": "To store electrostatic charge"}], "ans": ["C"], "exp": "The wrist strap safely dissipates static electricity from the technician to ground, preventing electrostatic discharge that could damage sensitive computer components during hardware installation.", "src": "PDF"}, {"n": 291, "stem": ["The touch pad on a user's computer is not working. When the user connects a mouse to the computer, the cursor works normally. Which of the following should a technician use to check for driver updates?"], "opts": [{"k": "A", "t": "certmgr.msc"}, {"k": "B", "t": "lusrmgr.msc"}, {"k": "C", "t": "devmgmt.msc"}, {"k": "D", "t": "gpedit.msc"}], "ans": ["C"], "exp": "devmgmt.msc opens Device Manager, which is the tool used to check, update, or reinstall hardware drivers such as the touchpad driver.", "src": "PDF"}, {"n": 292, "stem": ["A secretary receives an email from the company's chief executive officer with a request to pay a vendor immediately. After the payment is made, the chief executive officer tells the secretary that they never sent that email. Which of the following social engineering tactics best describes this type of attack?"], "opts": [{"k": "A", "t": "Evil twin"}, {"k": "B", "t": "Impersonation"}, {"k": "C", "t": "Whaling"}, {"k": "D", "t": "Spear phishing"}], "ans": ["D"], "exp": "Spear phishing is a targeted email attack aimed at a specific individual or role, such as the secretary, by pretending to be someone trusted like the CEO.", "src": "PDF"}, {"n": 293, "stem": ["A technician is installing a cloud-based productivity suite and gets an error saying the installation is unavailable. What should be tried first?"], "opts": [{"k": "A", "t": "Reinstall the productivity suite"}, {"k": "B", "t": "Download an open-source alternative"}, {"k": "C", "t": "Check the license device limit"}, {"k": "D", "t": "Update the device OS"}], "ans": ["C"], "exp": "Cloud-based software often enforces device limits per license. Before reinstallation or switching software, checking license allocations is the most logical first step.", "src": "PDF"}, {"n": 294, "stem": ["A popular game frequently freezes and crashes on a mobile phone user's device. The user updates the OS. but the issue persists. The device is one year old and has plenty of free storage space. Which of the following is the most appropriate first step to troubleshoot this issue?"], "opts": [{"k": "A", "t": "Reinstalling the application"}, {"k": "B", "t": "Factory resetting the device"}, {"k": "C", "t": "Disabling background applications"}, {"k": "D", "t": "Changing the device's date and time settings"}], "ans": ["A"], "exp": "Reinstalling the application is the most appropriate first step because the issue may be caused by corrupted app files or a faulty update. Removing and reinstalling the game refreshes its files and settings without impacting the rest of the device.", "src": "PDF"}, {"n": 295, "stem": ["Which of the following methods is a way to superficially delete files on a hard drive?"], "opts": [{"k": "A", "t": "Drilling"}, {"k": "B", "t": "Degaussing"}, {"k": "C", "t": "Wiping"}, {"k": "D", "t": "Shredding"}, {"k": "E", "t": "Low-level formatting"}], "ans": ["E"], "exp": "Low-level formatting removes file system structures and references without physically destroying the drive, making it a superficial deletion method compared to physical destruction techniques.", "src": "PDF"}, {"n": 296, "stem": ["Which of the following commands can a technician use to view the contents of a single file on a Linux terminal?"], "opts": [{"k": "A", "t": "chmod"}, {"k": "B", "t": "cat"}, {"k": "C", "t": "ls"}, {"k": "D", "t": "sudo"}], "ans": ["B"], "exp": "The cat command is used on a Linux terminal to view the contents of a single file.", "src": "PDF"}, {"n": 297, "stem": ["A company wants to prevent unauthorized physical access to its mobile devices. Which of the following should the company do? (Choose two.)"], "opts": [{"k": "A", "t": "Disable built-in hotspots."}, {"k": "B", "t": "Configure VPN software."}, {"k": "C", "t": "Install an antivirus application."}, {"k": "D", "t": "Use PIN authentication."}, {"k": "E", "t": "Turn on location services."}, {"k": "F", "t": "Enable screen timeout."}], "ans": ["D", "F"], "exp": "A PIN prevents unauthorized users from unlocking the device, and a screen timeout ensures the device locks automatically when unattended, protecting it from physical access.", "src": "PDF"}, {"n": 298, "stem": ["Which of the following grants a user the minimum level of permissions necessary to perform duties?"], "opts": [{"k": "A", "t": "Least privilege"}, {"k": "B", "t": "Zero Trust"}, {"k": "C", "t": "SSO"}, {"k": "D", "t": "MFA"}], "ans": ["A"], "exp": "The principle of least privilege ensures users are granted only the minimum permissions required to perform their job duties, reducing security risks.", "src": "PDF"}, {"n": 299, "stem": ["A technician wants to create new partitions on a device so that a user can keep work data and personal data separate. Which of the following tools should the technician use?"], "opts": [{"k": "A", "t": "perfmon.msc"}, {"k": "B", "t": "diskmgmt.msc"}, {"k": "C", "t": "lusmgr.msc"}, {"k": "D", "t": "devmgmt.msc"}], "ans": ["B"], "exp": "This tool is used to create, delete, format, and manage disk partitions and volumes, allowing separation of data into different partitions on the same storage device.", "src": "PDF"}, {"n": 300, "stem": ["An engineer notices that many websites prompt users to input login and payment details. The engineer wants to require the browser to encrypt communications. Which of the following best helps to protect sensitive data?"], "opts": [{"k": "A", "t": "Disabling all cookies"}, {"k": "B", "t": "Disabling JavaScript"}, {"k": "C", "t": "Enabling a pop-up blocker"}, {"k": "D", "t": "Enabling HTTPS-Only Mode"}], "ans": ["D"], "exp": "Enabling HTTPS-Only Mode forces the browser to use encrypted HTTPS connections instead of unencrypted HTTP. This ensures that login credentials and payment details are transmitted securely using TLS encryption, protecting sensitive data from interception.", "src": "PDF"}, {"n": 301, "stem": ["A help desk technician is setting up speech recognition on a Windows system. Which of the following settings should the technician use?"], "opts": [{"k": "A", "t": "Time and Language"}, {"k": "B", "t": "Personalization"}, {"k": "C", "t": "System"}, {"k": "D", "t": "Ease of Access"}], "ans": ["D"], "exp": "Windows places speech recognition and other accessibility features under the Ease of Access settings. From there, you can configure Speech options - including enabling Windows Speech Recognition and adjusting its settings - so that users relying on voice input can operate the system effectively.", "src": "PDF"}, {"n": 302, "stem": ["An administrator must rename the administrator account on a Windows desktop. Which of the following tools is best for this task?"], "opts": [{"k": "A", "t": "lusrmgr.msc"}, {"k": "B", "t": "devmgmt.msc"}, {"k": "C", "t": "gpedit.msc"}, {"k": "D", "t": "eventvwr.msc"}], "ans": ["A"], "exp": "The Local Users and Groups Manager (lusrmgr.msc) is the utility for managing user accounts, including renaming the default Administrator.", "src": "PDF"}, {"n": 303, "stem": ["A customer is upgrading their workstation from Windows 10 to Windows 11. They perform a clean installation from a USB drive. After the system restarts, the installer loads again. Which of the following should the user do to complete the installation?"], "opts": [{"k": "A", "t": "Run chkdskfrom the USB."}, {"k": "B", "t": "Turn off TPM."}, {"k": "C", "t": "Change MBR to UEFI."}, {"k": "D", "t": "Remove the USB drive."}], "ans": ["D"], "exp": "Removing the USB drive allows the system to boot from the newly installed Windows 11 operating system, rather than restarting the installation process.", "src": "PDF"}, {"n": 304, "stem": ["Which of the following is used to detect and record access to restricted areas?"], "opts": [{"k": "A", "t": "Bollards"}, {"k": "B", "t": "Video surveillance"}, {"k": "C", "t": "Badge readers"}, {"k": "D", "t": "Fence"}], "ans": ["C"], "exp": "Badge readers authenticate and log each entry attempt - recording who accessed (or tried to access) a secured area and when. This audit trail is essential for monitoring and reviewing access to restricted zones.", "src": "PDF"}, {"n": 305, "stem": ["A government client asks a technician to expunge several drives that contain confidential information. The technician must follow regulatory compliance. Which of the following is the best option?"], "opts": [{"k": "A", "t": "In-house disk incineration"}, {"k": "B", "t": "Certified third-party destruction"}, {"k": "C", "t": "Low-level formatting"}, {"k": "D", "t": "Targeted file deletion"}], "ans": ["B"], "exp": "Certified third-party destruction provides documented, verifiable proof that drives were destroyed according to regulatory and legal compliance requirements, which is essential when handling government confidential information.", "src": "PDF"}, {"n": 306, "stem": ["Which of the following Microsoft Windows versions would most likely be installed on a server?"], "opts": [{"k": "A", "t": "Windows 10 Enterprise"}, {"k": "B", "t": "Windows 11 Pro"}, {"k": "C", "t": "Windows 2022"}, {"k": "D", "t": "Windows 22H2"}], "ans": ["C"], "exp": "Windows Server 2022 is a server-class operating system designed to provide services such as authentication, file sharing, virtualization, and application hosting for an organization's network.", "src": "PDF"}, {"n": 307, "stem": ["The Chief Information Officer (CIO) is overseeing a project to integrate existing business processes to an enterprise resource planning system. The CIO identifies the scope of the change and provides it to the IT department. Which of the following is the first change management procedure to perform before measuring the impact to the systems?"], "opts": [{"k": "A", "t": "Backup plan"}, {"k": "B", "t": "Risk analysis"}, {"k": "C", "t": "Document findings"}, {"k": "D", "t": "Sandbox testing"}], "ans": ["B"], "exp": "Risk analysis is the first step in the change management process before measuring system impact. It identifies potential threats, vulnerabilities, and the likelihood of adverse effects resulting from the change. Performing risk analysis ensures informed decision-making prior to further evaluation, testing, or implementation.", "src": "PDF"}, {"n": 308, "stem": ["A technician is working to restore a customer's access to a website. Which of the following commands should the technician use to determine the point of failure?"], "opts": [{"k": "A", "t": "gpupdate"}, {"k": "B", "t": "tracert"}, {"k": "C", "t": "hostname"}, {"k": "D", "t": "netstat"}], "ans": ["B"], "exp": "Tracert traces the path packets take to reach a destination and shows where the connection fails, allowing the technician to identify the specific network hop causing the website access issue.", "src": "PDF"}, {"n": 309, "stem": ["A technician wants to prevent electrical damage while disassembling a device. The technician turns off the device. Which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Place the computer on an antistatic mat."}, {"k": "B", "t": "Work on a plastic surface."}, {"k": "C", "t": "Place components in antistatic bags."}, {"k": "D", "t": "Connect a wrist strap to a metal frame."}], "ans": ["D"], "exp": "Connecting a wrist strap to a grounded metal frame ensures the technician is properly grounded, preventing electrostatic discharge that could damage internal components during disassembly.", "src": "PDF"}, {"n": 310, "stem": ["Whenever a user clicks on a .jpg, Notepad opens and displays illegible characters. Otherwise, the workstation functions normally. Which of the following is the most likely cause of this issue?"], "opts": [{"k": "A", "t": "The workstation has been infected with malware."}, {"k": "B", "t": "The default application for image files is misconfigured."}, {"k": "C", "t": "The operating system needs the most current update."}, {"k": "D", "t": "A new image editor needs to be installed on the user's computer."}], "ans": ["B"], "exp": "The behavior indicates that Windows is opening .jpg files with the wrong default application. Correcting the file association resolves the issue.", "src": "PDF"}, {"n": 311, "stem": ["A user is installing a third-party application on the latest macOS. The user receives a security warning that states the application is unsigned and cannot be installed. Which of the following settings should the user adjust to allow the installation?"], "opts": [{"k": "A", "t": "Privacy"}, {"k": "B", "t": "Accessibility"}, {"k": "C", "t": "Finder"}, {"k": "D", "t": "iCloud"}], "ans": ["A"], "exp": "Adjusting the Privacy (Security & Privacy) settings allows the user to override macOS Gatekeeper restrictions and permit the installation of an unsigned third-party application.", "src": "PDF"}, {"n": 312, "stem": ["Which of the following file types would a desktop support technician most likely use to automate tasks for a Windows user log-in?"], "opts": [{"k": "A", "t": ".bat"}, {"k": "B", "t": ".sh"}, {"k": "C", "t": ".py"}, {"k": "D", "t": ".js"}], "ans": ["A"], "exp": "Batch files (.bat) are classic Windows script files that execute a series of command-line instructions. They can be linked to user logon events via Group Policy or the Startup folder to automate tasks (like mapping drives or launching applications) when a user signs in.", "src": "PDF"}, {"n": 313, "stem": ["Which of the following technologies uses smartphones to allow contactless entry to secure areas?"], "opts": [{"k": "A", "t": "NFC"}, {"k": "B", "t": "IR"}, {"k": "C", "t": "RFID"}, {"k": "D", "t": "Bluetooth"}], "ans": ["A"], "exp": "Near Field Communication allows smartphones to perform contactless authentication by communicating with access control readers at very short range, enabling secure entry without physical cards.", "src": "PDF"}, {"n": 314, "stem": ["A company would like to deploy baseline images to new computers as they are started up on the network. Which of the following boot processes should the company use for this task?"], "opts": [{"k": "A", "t": "ISO"}, {"k": "B", "t": "Secure"}, {"k": "C", "t": "USB"}, {"k": "D", "t": "PXE"}], "ans": ["D"], "exp": "Preboot Execution Environment (PXE) allows new computers to boot over the network by pulling a boot image from a PXE server. This lets you automatically deploy baseline images as machines power on and receive their network-based boot instructions, without relying on local media like USB drives or ISOs.", "src": "PDF"}, {"n": 315, "stem": ["A technician must install a legacy business application on a new computer. The new computer does not meet the application's requirements. Which of the following steps should the technician take to ensure the application installs and runs correctly?"], "opts": [{"k": "A", "t": "Use a virtual machine to emulate an older OS."}, {"k": "B", "t": "Run the installation in safe mode to avoid driver conflicts."}, {"k": "C", "t": "Increase the swap file size to manage potential memory issues."}, {"k": "D", "t": "Use an application compatibility toolkit to address any software conflicts."}], "ans": ["A"], "exp": "Using a virtual machine allows the technician to install and run an older operating system that meets the legacy application's requirements. This ensures proper compatibility by emulating the required environment without modifying the new computer's primary operating system.", "src": "PDF"}, {"n": 316, "stem": ["A company wants to perform an in-place upgrade of operating systems on all workstations. All types of removable storage are disabled for security reasons. Which of the following is the best way to upgrade while keeping security settings in place?"], "opts": [{"k": "A", "t": "Using an external hard drive to upgrade the OS"}, {"k": "B", "t": "Copying the ISO file to each workstation and executing"}, {"k": "C", "t": "Setting up image deployment for PXE"}, {"k": "D", "t": "Using a hardware token to access upgrade files"}], "ans": ["C"], "exp": "PXE image deployment allows operating system upgrades to be performed over the network without enabling removable storage, maintaining the company's security restrictions while upgrading all workstations efficiently.", "src": "PDF"}, {"n": 317, "stem": ["Users access an internal application through a browser website. When a user is browsing the site a message appears that states it is not safe. The message also displays an Advanced Options button to continue or close the site. During security training, all users were told to close any site that displays this message. Which of the following should the technician do to resolve the issue?"], "opts": [{"k": "A", "t": "Add the site to a list of safe senders"}, {"k": "B", "t": "Install a Secure Sockets Layer certificate for the site"}, {"k": "C", "t": "Migrate the site to a different server"}, {"k": "D", "t": "Move the site to a web-hosting company"}], "ans": ["B"], "exp": "Installing a Secure Sockets Layer certificate ensures the website uses trusted HTTPS encryption, eliminating browser security warnings and allowing users to access the internal application safely without bypassing security alerts.", "src": "PDF"}, {"n": 318, "stem": ["A technician is migrating an application server to another server. Which of the following DNS records should the technician create to ensure seamless connectivity?"], "opts": [{"k": "A", "t": "TXT"}, {"k": "B", "t": "SPF"}, {"k": "C", "t": "DKIM"}, {"k": "D", "t": "CNAME"}], "ans": ["D"], "exp": "A CNAME record allows one hostname to alias another, enabling the application's existing domain name to point to the new server without requiring changes on client systems, ensuring seamless connectivity.", "src": "PDF"}, {"n": 319, "stem": ["Which of the following port numbers is used for NetBIOS?"], "opts": [{"k": "A", "t": "110"}, {"k": "B", "t": "137"}, {"k": "C", "t": "143"}, {"k": "D", "t": "445"}], "ans": ["B"], "exp": "NetBIOS commonly uses port 137 for name services, which is responsible for name registration and resolution on a network.", "src": "PDF"}, {"n": 320, "stem": ["A busy network printer is producing faded printouts after a technician performed maintenance on the printer several months ago. The technician now replaces the toner cartridge, but the issue persists. Which of the following should the technician check next?"], "opts": [{"k": "A", "t": "The firmware version"}, {"k": "B", "t": "The paper type"}, {"k": "C", "t": "The drum unit for wear"}, {"k": "D", "t": "The print resolution settings"}], "ans": ["C"], "exp": "If replacing the toner does not resolve faded prints, the next likely cause is a worn drum unit, which is responsible for transferring toner to paper and degrades over time, leading to poor print quality.", "src": "PDF"}, {"n": 321, "stem": ["An administrator requires information about a server to identify the product owner and whether it has any business-critical services. Which of the following can the administrator refer to in order to find this information?"], "opts": [{"k": "A", "t": "CMDB"}, {"k": "B", "t": "SLA"}, {"k": "C", "t": "SOP"}, {"k": "D", "t": "EULA"}], "ans": ["A"], "exp": "A CMDB (Configuration Management Database) contains details about IT assets, including product ownership and business-critical service status.", "src": "PDF"}, {"n": 322, "stem": ["An end user's laptop is having network drive connectivity issues in the office. The end user submits a help desk ticket, and a support technician is able to establish a remote connection and fix the issue. The following day, however, the network drive is disconnected again. Which of the following should the technician do next?"], "opts": [{"k": "A", "t": "Connect remotely to the user's computer to see whether the network drive is still connected."}, {"k": "B", "t": "Send documentation about how to fix the issue in case it reoccurs."}, {"k": "C", "t": "Escalate the ticket to the next level."}, {"k": "D", "t": "Keep the ticket open until next day, then close the ticket."}], "ans": ["C"], "exp": "Since the fix did not persist and the issue recurred, it indicates there may be an underlying configuration or policy problem that requires deeper troubleshooting than a frontline technician can provide. Escalating to the next support tier ensures that the root cause is identified and a more permanent solution is implemented, rather than repeatedly applying a temporary workaround.", "src": "PDF"}, {"n": 323, "stem": ["A technician is securing a newly deployed workstation that only assigned users can access. Which of the following techniques should the technician do to prevent unauthorized users from accessing the workstation? (Choose two.)"], "opts": [{"k": "A", "t": "Defragment the hard drive"}, {"k": "B", "t": "Enable SSH"}, {"k": "C", "t": "Enable screensaver locks"}, {"k": "D", "t": "Disable iCloud integration"}, {"k": "E", "t": "Enable the firewall"}, {"k": "F", "t": "Apply the BIOS password"}], "ans": ["C", "F"], "exp": "Enabling screensaver locks ensures that only authorized users can access the workstation after periods of inactivity. Applying a BIOS password prevents unauthorized users from changing boot options or accessing the workstation at startup.", "src": "PDF"}, {"n": 324, "stem": ["Which of the following security technologies is designed to enable security visibility and respond to traffic outside of the host and at the network level?"], "opts": [{"k": "A", "t": "RADIUS"}, {"k": "B", "t": "UAC"}, {"k": "C", "t": "XDR"}, {"k": "D", "t": "Antivirus"}], "ans": ["C"], "exp": "XDR (Extended Detection and Response) is designed to provide security visibility and response capabilities beyond the host, including at the network level.", "src": "PDF"}, {"n": 325, "stem": ["Which of the following RAM characteristics allows for recovery from data faults in memory modules?"], "opts": [{"k": "A", "t": "Capacity"}, {"k": "B", "t": "Speed"}, {"k": "C", "t": "ECC"}, {"k": "D", "t": "DDR"}, {"k": "E", "t": "Parity"}], "ans": ["C"], "exp": "Error-correcting code memory detects and corrects data corruption in memory, allowing recovery from faults and improving system reliability.", "src": "PDF"}, {"n": 326, "stem": ["Which of the following contains details about its manufacturer and is hardcoded?"], "opts": [{"k": "A", "t": "DSL"}, {"k": "B", "t": "MAC"}, {"k": "C", "t": "APIPA"}, {"k": "D", "t": "IP"}], "ans": ["B"], "exp": "A MAC address is a hardware identifier assigned to a network interface and includes an Organizationally Unique Identifier that identifies the manufacturer, making it hardcoded and unique.", "src": "PDF"}, {"n": 327, "stem": ["A user's PC is performing slowly after the user clicked on a suspicious email attachment. The technician notices that a single process is taking 100% of RAM, CPU, and network resources. Which of the following should the technician do first?"], "opts": [{"k": "A", "t": "Disconnect the computer from the network"}, {"k": "B", "t": "Run an antivirus scan"}, {"k": "C", "t": "Reboot the computer"}, {"k": "D", "t": "Educate the user about cybersecurity best practices"}], "ans": ["A"], "exp": "The technician should disconnect the computer from the network (Option A) first to prevent any further spread of the infection or data loss. Once the machine is isolated from the network, the technician can safely investigate the malware without risking infection to other systems.", "src": "PDF"}, {"n": 328, "stem": ["An organization wants to deploy a customizable operating system. Which of the following should the organization choose?"], "opts": [{"k": "A", "t": "Windows 10"}, {"k": "B", "t": "macOS"}, {"k": "C", "t": "Linux"}, {"k": "D", "t": "Chrome OS"}, {"k": "E", "t": "iOS"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 329, "stem": ["A department manager asks a technician to set up a group in a company collaboration tool that will allow users in the New York office to communicate sensitive information in a highly regulated environment. Which of the following should the technician configure in order to meet the team's needs? (Choose three.)"], "opts": [{"k": "A", "t": "Local user accounts"}, {"k": "B", "t": "Personal device access"}, {"k": "C", "t": "API token configuration"}, {"k": "D", "t": "Multifactor authentication"}, {"k": "E", "t": "Private channels"}, {"k": "F", "t": "Collaboration tool profiles"}, {"k": "G", "t": "VPN connectivity"}, {"k": "H", "t": "Data retention requirements"}], "ans": ["D", "E", "H"], "exp": "Multifactor authentication adds a required security layer for accessing sensitive information. Private channels restrict communication to authorized members only, protecting confidential discussions. Data retention requirements ensure compliance with regulatory standards for storing and managing sensitive data.", "src": "PDF"}, {"n": 330, "stem": ["Which of the following provides disk encryption on computers running a Windows OS?"], "opts": [{"k": "A", "t": "FileVault"}, {"k": "B", "t": "BitLocker"}, {"k": "C", "t": "Private Key"}, {"k": "D", "t": "PowerShell"}], "ans": ["B"], "exp": "BitLocker is a full-disk encryption feature included with certain editions of Windows, designed to protect data by providing encryption for entire volumes. BitLocker is the correct tool for disk encryption on Windows operating systems, providing full disk encryption.", "src": "PDF"}, {"n": 331, "stem": ["A technician is building a custom CAD workstation with a high-end graphics card. The customer requests that the system has the highest possible stability. Which of the following is the best choice for the power supply?"], "opts": [{"k": "A", "t": "UPS"}, {"k": "B", "t": "Redundant"}, {"k": "C", "t": "Surge protector"}, {"k": "D", "t": "Modular"}], "ans": ["B"], "exp": "A redundant power supply provides failover capability by using multiple power units, ensuring continuous operation and maximum stability if one power supply fails.", "src": "PDF"}, {"n": 332, "stem": ["A developer is using an AI tool to generate a complex sorting algorithm for a web application. Which of the following is the best choice to legally generate code in their application?"], "opts": [{"k": "A", "t": "Use the generated code in their application silently"}, {"k": "B", "t": "Insert comments in their application for the generated code"}, {"k": "C", "t": "Credit the author of the generated code in their application"}, {"k": "D", "t": "Check the sources the AI tool is using for copyrighted content"}], "ans": ["D"], "exp": "To legally use AI-generated code, the developer must ensure that the generated content does not incorporate copyrighted material without permission. Verifying the sources used by the AI tool helps confirm that the code does not violate intellectual property rights and reduces legal risk.", "src": "PDF"}, {"n": 333, "stem": ["Which of the following types of social engineering attacks sends an unsolicited text message to a user's mobile device?"], "opts": [{"k": "A", "t": "Impersonation"}, {"k": "B", "t": "Vishing"}, {"k": "C", "t": "Spear phishing"}, {"k": "D", "t": "Smishing"}], "ans": ["D"], "exp": "Smishing is the act of sending fraudulent messages via SMS or other texting platforms to trick users into revealing sensitive information or clicking malicious links. This distinguishes it from phishing over email (spear phishing), voice calls (vishing), or in-person deception (impersonation).", "src": "PDF"}, {"n": 334, "stem": ["A technician is troubleshooting a computer that fails to start and makes frequent, unexpected sounds. The monitor remains blank, and no OS loads. Which of the following should the technician review first to diagnose this issue?"], "opts": [{"k": "A", "t": "Output voltages of power supplies"}, {"k": "B", "t": "Availability of CPU thermal paste"}, {"k": "C", "t": "OS boot configuration"}, {"k": "D", "t": "Proper installation of RAM modules"}], "ans": ["D"], "exp": "Failure to start with no display and unusual sounds often indicates a POST issue. Improperly installed or faulty RAM commonly prevents the system from completing POST and can generate beep codes or abnormal sounds, making it the first component to check.", "src": "PDF"}, {"n": 335, "stem": ["A user cannot find multiple files on their machine. A technician finds that the files have been renamed with a different extension. The files cannot be opened when changed back to the original file type. Additionally, the user reports receiving pop-ups that request cryptocurrency payments. Which of the following steps should the technician take next?"], "opts": [{"k": "A", "t": "Reimage the machine and restore files from backup."}, {"k": "B", "t": "Scan the system after updating anti-malware."}, {"k": "C", "t": "Remove the machine from the network."}, {"k": "D", "t": "Tum off the machine and restart it in Safe Mode."}], "ans": ["C"], "exp": "The symptoms indicate ransomware. The next step is to isolate the infected machine from the network to prevent the ransomware from spreading to shared drives, other devices, or network resources.", "src": "PDF"}, {"n": 336, "stem": ["A technician is setting up a new work phone for a user. The company requires that all phones be compliant with business standards and be up to date on all OS patches. Which of the following should the technician use to meet the requirements?"], "opts": [{"k": "A", "t": "MDM"}, {"k": "B", "t": "Antivirus software"}, {"k": "C", "t": "BYOD"}, {"k": "D", "t": "Content filtering"}], "ans": ["A"], "exp": "An MDM (Mobile Device Management) solution enforces compliance requirements such as OS patch levels, security policies, and configuration standards on all company phones.", "src": "PDF"}, {"n": 337, "stem": ["Which of the following is occurring when a vulnerability is placed inside of a software package without the vendor's knowledge and it is deployed to customers?"], "opts": [{"k": "A", "t": "Zero-day attack"}, {"k": "B", "t": "Brute-force attack"}, {"k": "C", "t": "Dictionary attack"}, {"k": "D", "t": "Supply chain attack"}], "ans": ["D"], "exp": "A supply chain attack occurs when malicious code or vulnerabilities are introduced into software during development or distribution without the vendor's knowledge, and then delivered to customers through trusted channels.", "src": "PDF"}, {"n": 338, "stem": ["A technician who is using a Windows PC must share their screen with a user. Which of the following should the technician use for this task?"], "opts": [{"k": "A", "t": "VNC"}, {"k": "B", "t": "SSH"}, {"k": "C", "t": "RDP"}, {"k": "D", "t": "WinRM"}], "ans": ["A"], "exp": "VNC allows screen sharing and remote desktop viewing across systems, enabling the technician to display and share their screen with the user.", "src": "PDF"}, {"n": 339, "stem": ["A Chief Executive Officer wants to meet with remote employees in a way that will allow for collaboration and training. Which of the following software technologies is the best for this situation?"], "opts": [{"k": "A", "t": "Videoconferencing"}, {"k": "B", "t": "Screen sharing"}, {"k": "C", "t": "Remote Desktop Protocol"}, {"k": "D", "t": "Virtual desktop infrastructure"}], "ans": ["A"], "exp": "Videoconferencing software enables collaboration and training with remote employees, allowing for real-time meetings and interaction.", "src": "PDF"}, {"n": 340, "stem": ["Users are reporting that an unsecured network is broadcasting with the same name as the normal wireless network. They are able to access the internet but cannot connect to the file share servers. Which of the following best describes this issue?"], "opts": [{"k": "A", "t": "Unreachable DNS server"}, {"k": "B", "t": "Virtual local area network misconfiguration"}, {"k": "C", "t": "Incorrect IP address"}, {"k": "D", "t": "Rogue wireless access point"}], "ans": ["D"], "exp": "A rogue access point mimics the legitimate SSID, allowing clients to connect (often with internet access via its own uplink) but isolating them from internal resources like file shares. This behavior matches the symptoms - users join what appears to be the corporate WLAN but can't reach internal servers.", "src": "PDF"}, {"n": 341, "stem": ["A technician needs to map a shared drive from a command-line interface. Which of the following commands should the technician use?"], "opts": [{"k": "A", "t": "pathping"}, {"k": "B", "t": "nslookup"}, {"k": "C", "t": "net use"}, {"k": "D", "t": "tracert"}], "ans": ["C"], "exp": "The Windows net use command is used to connect, remove, and configure connections to shared network resources. To map a shared drive from the CLI, you'd run a command like: net use Z: \\\\Server
