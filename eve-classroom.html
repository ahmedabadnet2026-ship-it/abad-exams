 var d=document.createElement("div");d.className="seat"+(n==MY?" mine":"");d.style.setProperty("--i",n);d.dataset.n=n;
 d.innerHTML='<div class="desk"><div class="lap"><a class="scr" target="_blank" rel="noopener" href="'+url+'" data-seat="'+n+'" data-lab="eve"><i class="dot" data-n="'+n+'"></i><b><span data-t="seat"></span> '+n+'</b><small>'+id+'</small><span class="go"><span data-t="open"></span></span></a><div class="base"></div></div><div class="bars" data-n="'+n+'"><div class="bar">CPU<u><i class="c"></i></u><em class="cv">–</em></div><div class="bar">RAM<u><i class="m"></i></u><em class="mv">–</em></div></div><span class="act"></span></div><div class="chair" aria-hidden="true"><div class="s"></div><div class="bk"></div></div><span class="tag" data-t="mine"></span><button type="button" class="pick" data-t="pick"></button>';
 box.appendChild(d)}
function setMine(n){MY=n;try{localStorage.setItem("abad-eve-seat",n)}catch(e){}document.querySelectorAll(".seat").forEach(function(s){s.classList.toggle("mine",+s.dataset.n==n)})}
box.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a.scr");if(a){setMine(+a.dataset.seat);if(window.abadLabPing)window.abadLabPing("eve");return}
 var b=e.target.closest&&e.target.closest(".pick");if(b)setMine(+b.closest(".seat").dataset.n)});
/* live status from status.abad-labs.com (fallback: favicon probe) */
var API="https://status.abad-labs.com/",LAST=null,FAILS=0;
function tr(k){return S[k][L=="ar"?0:1]}
function setSeat(n,st,v){var dot=document.querySelector('.dot[data-n="'+n+'"]'),seat=dot.closest(".seat"),bx=seat.querySelector(".bars");
 dot.className="dot "+st;seat.classList.toggle("run",st=="ok");
 var c=v&&v.up?v.cpu:null,m=v&&v.up&&v.mem_total?100*v.mem_used/v.mem_total:null;
 bx.querySelector(".c").style.width=(c==null?0:Math.min(100,c))+"%";bx.querySelector(".m").style.width=(m==null?0:Math.min(100,m))+"%";
 bx.querySelector(".cv").textContent=c==null?"–":Math.round(c)+"%";bx.querySelector(".mv").textContent=m==null?"–":Math.round(m)+"%";
 seat.querySelector(".act").textContent=v&&v.active?v.active+" "+tr("nodes"):"";
 var t=tr("seat")+" "+n+" — "+tr(st=="ok"?"lgOk":st=="idle"?"lgIdle":"lgBad");
 if(v&&v.up)t+="\nCPU "+Math.round(v.cpu)+"%  ·  RAM "+(v.mem_used/1024).toFixed(1)+"/"+(v.mem_total/1024).toFixed(1)+" GB\n"+tr("ld")+" "+v.load+"  ·  "+v.active+" "+tr("nodes");
 seat.querySelector("a.scr").title=t;dot.title=t;
 var tl=document.querySelector('.tile[data-n="'+n+'"]');if(tl){tl.className="tile "+st;tl.title=t;tl.querySelector(".dot").className="dot "+st;tl.querySelector(".c").style.width=(c==null?0:Math.min(100,c))+"%";tl.querySelector(".m").style.width=(m==null?0:Math.min(100,m))+"%";tl.querySelector(".n").textContent=v&&v.up?(v.active+" "+tr("nodes")):st=="bad"?tr("lgBad"):"–"}}
function gauge(p){var nd=document.getElementById("nd"),gv=document.getElementById("gv"),ls=document.getElementById("ls");
 if(p==null){nd.style.transform="rotate(-90deg)";gv.textContent="–";ls.textContent=tr("na");ls.className="na";document.getElementById("kd").textContent="–";document.getElementById("ko").textContent="–";return}
 nd.style.transform="rotate("+(-90+1.8*Math.min(100,p))+"deg)";gv.textContent=Math.round(p)+"%";ls.className="";ls.textContent=tr(p<50?"low":p<80?"mid":"high");ls.style.color=p<50?"var(--ok)":p<80?"var(--gold)":"var(--bad)"}
function render(d){LAST=d;var up=0,act=0,cpu=0;
 d.seats.forEach(function(v){var st=!v.up?"bad":v.active>0?"ok":"idle";setSeat(v.seat,st,v);if(v.up){up++;cpu+=v.cpu}act+=v.active||0});
 gauge(up?Math.max(cpu/up,0):0);document.getElementById("kd").textContent=act;document.getElementById("ko").textContent=up}
function probe(n){var im=new Image(),done=0,t=setTimeout(function(){fin(0)},8000);
 function fin(ok){if(done)return;done=1;clearTimeout(t);setSeat(n,ok?"idle":"bad",null)}
 im.onload=function(){fin(1)};im.onerror=function(){fin(0)};im.src="https://eve"+n+".abad-labs.com/favicon.ico?t="+Date.now()}
function poll(){var c=window.AbortController?new AbortController():null,t=setTimeout(function(){c&&c.abort()},4500);
 fetch(API,{cache:"no-store",signal:c&&c.signal}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){clearTimeout(t);if(!d||!d.seats)throw 0;FAILS=0;render(d)})
 .catch(function(){clearTimeout(t);LAST=null;gauge(null);if(FAILS++%12==0)for(var n=1;n<=12;n++)probe(n)})}
for(var n=1;n<=12;n++)setSeat(n,"",null);gauge(null);poll();setInterval(poll,5000);
function paint(){var i=L=="ar"?0:1;document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";document.getElementById("lang").textContent=L=="ar"?"English":"العربية";document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=S[e.dataset.t][i]});
 document.querySelectorAll("a.scr").forEach(function(a){a.setAttribute("aria-label",S.seat[i]+" "+a.dataset.seat)});document.title=S.title[i]+" — "+S.inst[i];if(LAST)render(LAST);else gauge(null)}
document.getElementById("lang").onclick=function(){L=L=="ar"?"en":"ar";try{localStorage.setItem("abad-lang",L)}catch(e){}paint()};paint();
</script>
