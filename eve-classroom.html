<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10293b">
<title>المعمل — معهد شبكة آباد للتدريب</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:Cairo;src:url('assets/cairo.ttf') format('truetype');font-display:swap}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Cairo,sans-serif;color:#fff;min-height:100vh;background:radial-gradient(circle at 15% 10%,#3f86b344 0,transparent 45%),radial-gradient(circle at 85% 95%,#F5BD2D1c 0,transparent 40%),linear-gradient(135deg,#0a1c29,#10293b 55%,#16405e)}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;flex-wrap:wrap;max-width:1100px;margin:0 auto}
header img{height:42px;background:#fff;border-radius:9px;padding:3px 7px}header .t{flex:1;min-width:170px}header b{display:block;font-size:17px}header small{opacity:.7;font-size:12px}
.hb{font:inherit;font-weight:700;font-size:13px;color:#fff;background:#ffffff14;border:1px solid #ffffff33;border-radius:9px;padding:6px 12px;cursor:pointer;text-decoration:none}
main{max-width:1100px;margin:0 auto;padding:0 18px 40px}
.hero{text-align:center;padding:4px 0}.hero small{color:#F5BD2D;font-weight:700}.hero h1{margin:2px 0;font-size:clamp(1.4rem,3.4vw,2.1rem);font-weight:800}.hero p{margin:0 auto;opacity:.85;max-width:720px;font-size:14px;line-height:1.8}
.note{display:flex;gap:8px;align-items:flex-start;max-width:720px;margin:12px auto 0;padding:9px 14px;border-radius:12px;background:#F5BD2D1f;border:1px solid #F5BD2D77;font-size:13px;line-height:1.7}
/* classroom */
.room{position:relative;margin:20px auto 0;padding:22px 18px 26px;border-radius:22px;background:linear-gradient(180deg,#ffffff12,#ffffff05);border:1px solid #ffffff26;box-shadow:0 14px 30px #0005;overflow:hidden}
.room::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#3f86b3,#F5BD2D)}
.front{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:26px}
.board{width:min(520px,92%);aspect-ratio:16/4.2;border-radius:10px;background:linear-gradient(160deg,#16405e,#0a1c29);border:5px solid #c9d3db;box-shadow:0 8px 20px #0006,inset 0 0 24px #3f86b355;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:clamp(13px,2.4vw,17px);color:#cfe6f5}
.board i{font-style:normal;color:#F5BD2D}
.teacher{display:flex;align-items:center;gap:8px;padding:6px 18px;border-radius:10px;background:#8a5a2b;border-bottom:5px solid #5e3c1c;font-size:12.5px;font-weight:700;color:#fff3df;box-shadow:0 6px 14px #0005}
.aisle{font-size:11.5px;opacity:.55;text-align:center;margin:-12px 0 14px;letter-spacing:.5px}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 20px}
.seat{display:flex;flex-direction:column;align-items:center}
.desk{position:relative;width:100%;max-width:190px;padding:12px 12px 10px;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,#a8743f,#8a5a2b);border-bottom:6px solid #5e3c1c;box-shadow:0 8px 14px #0005;display:flex;flex-direction:column;align-items:center}
.desk::before,.desk::after{content:"";position:absolute;bottom:-20px;width:6px;height:14px;background:#5e3c1c;border-radius:0 0 3px 3px}
.desk::before{inset-inline-start:12px}.desk::after{inset-inline-end:12px}
/* laptop: the screen is the clickable element */
.scr{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:82%;aspect-ratio:16/10;border-radius:8px 8px 2px 2px;border:5px solid #1b2730;background:linear-gradient(160deg,#16405e,#0a1c29);color:#fff;text-decoration:none;box-shadow:0 0 0 #3f86b300;transition:transform .25s,box-shadow .25s,background .25s,border-color .25s;transform-origin:bottom center}
.scr b{font-size:clamp(13px,1.9vw,16px);font-weight:800;color:#F5BD2D;line-height:1.3}
.scr small{font-size:11px;opacity:.75;direction:ltr}
.scr .go{position:absolute;inset:auto 0 4px;text-align:center;font-size:10.5px;font-weight:800;color:#10293b;opacity:0;transform:translateY(4px);transition:.25s}
.scr .go span{background:#F5BD2D;border-radius:6px;padding:0 7px}
.scr::after{content:"";position:absolute;top:5px;inset-inline-end:6px;width:7px;height:7px;border-radius:50%;background:#3ecf8e;box-shadow:0 0 6px #3ecf8e}
.base{width:100%;height:7px;margin-top:0;border-radius:0 0 6px 6px;background:linear-gradient(180deg,#c9d3db,#8b98a3);box-shadow:0 3px 4px #0004}
.base::after{content:"";display:block;width:22%;height:3px;margin:0 auto;background:#6e7a84;border-radius:0 0 4px 4px}
.lap{width:100%;display:flex;flex-direction:column;align-items:center}
.lap .base{width:96%}
.scr:hover,.scr:focus-visible{transform:translateY(-5px) scale(1.06);border-color:#F5BD2D;background:linear-gradient(160deg,#3f86b3,#16405e);box-shadow:0 10px 24px #3f86b388,0 0 0 3px #F5BD2D55}
.scr:hover .go,.scr:focus-visible .go{opacity:1;transform:none}
.seat:hover .chair .bk,.seat:focus-within .chair .bk{background:#3f86b3}
/* chair */
.chair{margin-top:24px;display:flex;flex-direction:column;align-items:center}
.chair .st{width:62px;height:16px;border-radius:8px;background:#2a5a7d;box-shadow:0 4px 8px #0005}
.chair .bk{width:70px;height:26px;margin-top:4px;border-radius:6px 6px 14px 14px;background:#245070;border-top:4px solid #F5BD2D;transition:background .25s}
.legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:22px;font-size:12px;opacity:.75}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ecf8e;margin-inline-end:6px}
@media (max-width:860px){.seats{grid-template-columns:repeat(3,1fr)}}
@media (max-width:560px){.room{padding:18px 10px 22px}.seats{grid-template-columns:repeat(2,1fr);gap:22px 12px}.desk{padding:10px 8px 8px}.scr{width:90%;border-width:4px}.chair .st{width:50px}.chair .bk{width:56px;height:22px}}
@media (prefers-reduced-motion:reduce){.scr,.scr .go,.chair .bk{transition:none}}
</style>

</head>
<body>
<header><img src="assets/abad-logo.png" alt="ABAD"><div class="t"><b data-t="inst"></b><small data-t="sec"></small></div><a class="hb" href="practical-lab.html?v=abad-202610182200" data-t="back"></a><button class="hb" id="lang" type="button"></button></header>
<main>
<section class="hero"><small data-t="kick"></small><h1 data-t="title"></h1><p data-t="lead"></p>
<div class="note" role="note"><span>ℹ️</span><span data-t="note"></span></div></section>
<section class="room" aria-labelledby="rt">
 <div class="front"><div class="board" id="rt"><i>🖥️</i><span data-t="board"></span></div><div class="teacher">👨‍🏫 <span data-t="teacher"></span></div></div>
 <div class="seats" id="seats"></div>
 <div class="legend"><span data-t="legend"></span></div>
</section>
</main>
<script>
var L=(function(){try{return localStorage.getItem("abad-lang")}catch(e){}})()||"ar";
var S={inst:["معهد شبكة آباد للتدريب","ABAD Network Training Institute"],sec:["منصة المحاكاة العملية","Practical Simulation Platform"],back:["→ المختبرات","← Labs"],
kick:["🧑‍💻 أجهزة المعمل","🧑‍💻 Lab machines"],title:["المعمل","The Lab"],lead:["اختر مقعدك واضغط على شاشة الجهاز لفتح جهاز المعمل الخاص بك في نافذة جديدة.","Pick your seat and click the laptop screen to open your lab machine in a new tab."],
note:["تعمل أجهزة المعمل حاليًا من داخل شبكة المعهد فقط — الروابط الخارجية قريبًا.","Lab machines currently work from inside the institute network only — external links coming soon."],
board:["شاشة المدرب","Instructor screen"],teacher:["مكتب المدرب","Instructor desk"],seat:["مقعد","Seat"],open:["افتح ←","Open →"],legend:["12 جهازًا · اضغط على الشاشة للفتح","12 machines · click a screen to open"]};
var box=document.getElementById("seats");
for(var n=1;n<=12;n++){var id="eve-"+(n<10?"0":"")+n,url="http://192.168.200."+(200+n)+"/";
 var d=document.createElement("div");d.className="seat";
 d.innerHTML='<div class="desk"><div class="lap"><a class="scr" target="_blank" rel="noopener" href="'+url+'" data-seat="'+n+'"><b><span data-t="seat"></span> '+n+'</b><small>'+id+'</small><span class="go"><span data-t="open"></span></span></a><div class="base"></div></div></div><div class="chair" aria-hidden="true"><div class="st"></div><div class="bk"></div></div>';
 box.appendChild(d)}
box.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a.scr");if(a&&window.abadLabPing)window.abadLabPing("eve")});
function paint(){var i=L=="ar"?0:1;document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";document.getElementById("lang").textContent=L=="ar"?"English":"العربية";document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=S[e.dataset.t][i]});
 document.querySelectorAll("a.scr").forEach(function(a){a.setAttribute("aria-label",S.seat[i]+" "+a.dataset.seat)});document.title=S.title[i]+" — "+S.inst[i]}
document.getElementById("lang").onclick=function(){L=L=="ar"?"en":"ar";try{localStorage.setItem("abad-lang",L)}catch(e){}paint()};paint();
</script>
<script src="js/abad-labs.js?v=abad-202610182200" defer></script>
</body>
</html>
