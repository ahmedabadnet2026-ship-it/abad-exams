on their responsibilities. The administrator also wants to apply the required access structure via a simplified format. Which of the following should the administrator apply to the site recovery resource group?"], "opts": [{"k": "A", "t": "RBAC"}, {"k": "B", "t": "ACL"}, {"k": "C", "t": "SAML"}, {"k": "D", "t": "GPO"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 319, "stem": ["Which of the following vulnerabilities would likely be mitigated by setting up an MDM platform?"], "opts": [{"k": "A", "t": "TPM"}, {"k": "B", "t": "Buffer overflow"}, {"k": "C", "t": "Jailbreaking"}, {"k": "D", "t": "SQL injection"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 320, "stem": ["Which of the following is the best safeguard to protect against an extended power failure?"], "opts": [{"k": "A", "t": "Off-site backups"}, {"k": "B", "t": "Batteries"}, {"k": "C", "t": "Uninterruptible power supplies"}, {"k": "D", "t": "Generators"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 321, "stem": ["A security administrator receives an email regarding a newly disclosed exploit. The administrator is unsure if the exploit is affecting the company. Which of the following actions should the security administrator take?"], "opts": [{"k": "A", "t": "Review packet captures."}, {"k": "B", "t": "Run proof-of-concept code."}, {"k": "C", "t": "Review security dashboards."}, {"k": "D", "t": "Run a vulnerability scan."}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 322, "stem": ["Which of the following would most likely prevent exploitation of an end-of-life, business-critical system?"], "opts": [{"k": "A", "t": "Monitoring"}, {"k": "B", "t": "Isolation"}, {"k": "C", "t": "Decommissioning"}, {"k": "D", "t": "Encryption"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 324, "stem": ["Which of the following would be the best solution to deploy a low-cost standby site that includes hardware and internet access?"], "opts": [{"k": "A", "t": "Recovery site"}, {"k": "B", "t": "Cold site"}, {"k": "C", "t": "Hot site"}, {"k": "D", "t": "Warm site"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 325, "stem": ["Which of the following is the best mitigation for a zero-day vulnerability found in mission-critical production servers that must be highly available?"], "opts": [{"k": "A", "t": "Virtualizing and migrating to a containerized instance"}, {"k": "B", "t": "Removing and sandboxing to an isolated network"}, {"k": "C", "t": "Monitoring and implementing compensating controls"}, {"k": "D", "t": "Patching and redeploying to production as quickly as possible"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 326, "stem": ["An administrator must secure several end-of-life SCADA devices in a manufacturing facility on a limited budget. Which of the following should the security administrator do to best secure these devices?"], "opts": [{"k": "A", "t": "Segment the SCADA devices to their own subnet."}, {"k": "B", "t": "Add the SCADA devices to a network monitoring tool"}, {"k": "C", "t": "Apply security patches to the SCADA devices."}, {"k": "D", "t": "Block internet access to the SCADA devices."}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 327, "stem": ["Which of the following mitigation techniques would a security analyst most likely use to avoid bloatware on devices?"], "opts": [{"k": "A", "t": "Disabled ports/protocols"}, {"k": "B", "t": "Application allow list"}, {"k": "C", "t": "Default password changes"}, {"k": "D", "t": "Access control permissions"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 328, "stem": ["A security engineer has been assigned to work on a request from outside counsel. The security engineer must provide all email correspondence within a specific date range. Which of the following actions should be taken first in response to the request?"], "opts": [{"k": "A", "t": "Send litigation hold notifications to identify affected data."}, {"k": "B", "t": "Form a team to determine root cause analysis."}, {"k": "C", "t": "Establish the chain of custody."}, {"k": "D", "t": "Determine the type of preservation needed for evidence."}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 329, "stem": ["Which of the following would best allow a company to prevent access to systems from the internet?"], "opts": [{"k": "A", "t": "Containerization"}, {"k": "B", "t": "Virtualization"}, {"k": "C", "t": "SD-WAN"}, {"k": "D", "t": "Air-gapped"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 330, "stem": ["A security analyst is working with an IT group to define appropriate procedures for the destruction of media and assets in the enterprise environment. Which of the following methods provides the strongest level of assurance that the data has been disposed of properly?"], "opts": [{"k": "A", "t": "Degaussing"}, {"k": "B", "t": "Multi-pass wipe"}, {"k": "C", "t": "Hashing"}, {"k": "D", "t": "Erasure"}, {"k": "E", "t": "Shredding"}], "ans": ["E"], "exp": "", "src": "PDF"}, {"n": 331, "stem": ["Which of the following digital forensics activities would a security team perform when responding to legal requests in a pending investigation?"], "opts": [{"k": "A", "t": "E-discovery"}, {"k": "B", "t": "User provisioning"}, {"k": "C", "t": "Firewall log export"}, {"k": "D", "t": "Root cause analysis"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 332, "stem": ["An administrator investigating an incident is concerned about the downtime of a critical server due to a failed drive. Which of the following would the administrator use to estimate the time needed to fix the issue?"], "opts": [{"k": "A", "t": "MTTR"}, {"k": "B", "t": "MTBF"}, {"k": "C", "t": "RTO"}, {"k": "D", "t": "RPO"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 333, "stem": ["Which of the following would an organization most likely use to minimize the loss of data on a file server in the event that data needs to be restored due to loss of the primary server?"], "opts": [{"k": "A", "t": "Monitoring"}, {"k": "B", "t": "Journaling"}, {"k": "C", "t": "Obfuscation"}, {"k": "D", "t": "Tokenization"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 334, "stem": ["Which of the following is an example of a certificate that is generated by an internal source?"], "opts": [{"k": "A", "t": "Digital signature"}, {"k": "B", "t": "Asymmetric key"}, {"k": "C", "t": "Self-signed"}, {"k": "D", "t": "Symmetric key"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 335, "stem": ["A government worker secretly copies classified files that contain defence tactics information to an external drive. The government worker then gives the external drive to a corrupt organization. Which of the following best describes the motivation of the worker?"], "opts": [{"k": "A", "t": "Espionage"}, {"k": "B", "t": "Data exfiltration"}, {"k": "C", "t": "Financial gain"}, {"k": "D", "t": "Blackmail"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 336, "stem": ["A company uses a cloud-based platform for file storage and wants to ensure the security of its data in transit. Which of the following should the company verify are in place to secure this type of communication? (Select two)."], "opts": [{"k": "A", "t": "TLS certificates"}, {"k": "B", "t": "WPA2 encryption"}, {"k": "C", "t": "HTTPS"}, {"k": "D", "t": "Virtual private network"}, {"k": "E", "t": "Encryption key management"}, {"k": "F", "t": "Digital signatures"}], "ans": ["A", "D"], "exp": "", "src": "PDF"}, {"n": 337, "stem": ["A network engineer is increasing the overall security of network devices and needs to harden the devices. Which of the following will best accomplish this task?"], "opts": [{"k": "A", "t": "Configuring centralized logging"}, {"k": "B", "t": "Generating local administrator accounts"}, {"k": "C", "t": "Replacing Telnet with SSH"}, {"k": "D", "t": "Enabling HTTP administration"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 338, "stem": ["Which of the following should a security analyst use to prioritize the remediation of a vulnerability?"], "opts": [{"k": "A", "t": "OSINT"}, {"k": "B", "t": "CVE"}, {"k": "C", "t": "loC"}, {"k": "D", "t": "CVSS"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 339, "stem": ["Which of the following describes the understanding between a company and a client about what will be provided and the accepted time needed to provide the company with the resources?"], "opts": [{"k": "A", "t": "SLA"}, {"k": "B", "t": "MOU"}, {"k": "C", "t": "MOA"}, {"k": "D", "t": "CVSS"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 340, "stem": ["Which of the following techniques would identify whether data has been modified in transit?"], "opts": [{"k": "A", "t": "Hashing"}, {"k": "B", "t": "Tokenization"}, {"k": "C", "t": "Masking"}, {"k": "D", "t": "Encryption"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 341, "stem": ["The internal audit team determines a software application is no longer in scope for external reporting requirements. Which of the following will document management's perspective that the application is no longer applicable?"], "opts": [{"k": "A", "t": "Data classification policies"}, {"k": "B", "t": "Right to be forgotten"}, {"k": "C", "t": "Due care and due diligence"}, {"k": "D", "t": "Acknowledgement and attestation"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 342, "stem": ["Which of the following control types describes an alert from a SIEM tool?"], "opts": [{"k": "A", "t": "Preventive"}, {"k": "B", "t": "Corrective"}, {"k": "C", "t": "Compensating"}, {"k": "D", "t": "Detective"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 343, "stem": ["A customer changes the underlying file structure of a new mobile phone to install a keylogger with administrator permissions. Which of the following does this best describe?"], "opts": [{"k": "A", "t": "Resource reuse"}, {"k": "B", "t": "Bloatware installation"}, {"k": "C", "t": "Side loading"}, {"k": "D", "t": "Jailbreaking"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 344, "stem": ["While browsing a web page, a user receives a pop-up with a link telling them to navigate to another site. To which of the following is the site vulnerable?"], "opts": [{"k": "A", "t": "DoS"}, {"k": "B", "t": "XSS"}, {"k": "C", "t": "SQLi"}, {"k": "D", "t": "TOC"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 345, "stem": ["Attackers created a new domain name that looks similar to a popular file-sharing website. Which of the following threat vectors is being used?"], "opts": [{"k": "A", "t": "Watering-hole attack"}, {"k": "B", "t": "Brand impersonation"}, {"k": "C", "t": "Phishing"}, {"k": "D", "t": "Typo squatting"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 346, "stem": ["A company is experiencing loss of availability due to excessive traffic to their front-end web servers. The company hires a digital forensics expert to investigate the incident. Which of the following logs should the digital forensics expert review first to diagnose the details of this incident?"], "opts": [{"k": "A", "t": "Router"}, {"k": "B", "t": "Load balancer"}, {"k": "C", "t": "Switch"}, {"k": "D", "t": "Firewall"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 347, "stem": ["A company's antivirus solution is effective in blocking malware but often has false positives. The security team has spent a significant amount of time on investigations but cannot determine a root cause. The company is looking for a heuristic solution. Which of the following should replace the antivirus solution?"], "opts": [{"k": "A", "t": "SIEM"}, {"k": "B", "t": "EDR"}, {"k": "C", "t": "DLP"}, {"k": "D", "t": "IDS"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 348, "stem": ["Which of the following will harden access to a new database system? (Select two)."], "opts": [{"k": "A", "t": "Jump server"}, {"k": "B", "t": "NIDS"}, {"k": "C", "t": "Monitoring"}, {"k": "D", "t": "Proxy server"}, {"k": "E", "t": "Host-based firewall"}, {"k": "F", "t": "WAF"}], "ans": ["A", "E"], "exp": "", "src": "PDF"}, {"n": 349, "stem": ["An IT manager is putting together a documented plan describing how the organization will keep operating in the event of a global incident. Which of the following plans is the IT manager creating?"], "opts": [{"k": "A", "t": "Business continuity"}, {"k": "B", "t": "Physical security"}, {"k": "C", "t": "Change management"}, {"k": "D", "t": "Disaster recovery"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 350, "stem": ["After a company was compromised, customers initiated a lawsuit. The company’s attorneys have requested that the security team initiate a legal hold in response to the lawsuit. Which of the following describes the action the security team will most likely be required to take?"], "opts": [{"k": "A", "t": "Retain the emails between the security team and affected customers for 30 days."}, {"k": "B", "t": "Retain any communications related to the security breach until further notice."}, {"k": "C", "t": "Retain any communications between security members during the breach response."}, {"k": "D", "t": "Retain all emails from the company to affected customers for an indefinite period of time."}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 351, "stem": ["Which of the following topics would most likely be included within an organization's SDLC?"], "opts": [{"k": "A", "t": "Service-level agreements"}, {"k": "B", "t": "Information security policy"}, {"k": "C", "t": "Penetration testing methodology"}, {"k": "D", "t": "Branch protection requirements"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 352, "stem": ["Which of the following describes the procedures a penetration tester must follow while conducting a test?"], "opts": [{"k": "A", "t": "Rules of engagement"}, {"k": "B", "t": "Rules of acceptance"}, {"k": "C", "t": "Rules of understanding"}, {"k": "D", "t": "Rules of execution"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 353, "stem": ["A company plans to secure its systems by: •Preventing users from sending sensitive data over corporate email •Restricting access to potentially harmful websites Which of the following features should the company set up? (Select two)."], "opts": [{"k": "A", "t": "DLP software"}, {"k": "B", "t": "DNS filtering"}, {"k": "C", "t": "File integrity monitoring"}, {"k": "D", "t": "Stateful firewall"}, {"k": "E", "t": "Guardrails"}, {"k": "F", "t": "Antivirus signatures"}], "ans": ["A", "B"], "exp": "", "src": "PDF"}, {"n": 355, "stem": ["Which of the following allows for the attribution of messages to individuals?"], "opts": [{"k": "A", "t": "Adaptive identity"}, {"k": "B", "t": "Non-repudiation"}, {"k": "C", "t": "Authentication"}, {"k": "D", "t": "Access logs"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 356, "stem": ["A company that operates with most of its infrastructure in the cloud had its development environment breached. The attackers gained access via a public-facing development application and were able to pivot to the production environment. Which of the following architecture changes would best prevent this from occurring again?"], "opts": [{"k": "A", "t": "Moving each environment to a separate VPC in the company cloud account"}, {"k": "B", "t": "Deploying firewalls in the company cloud account"}, {"k": "C", "t": "Migrating the development environment to an on-premises environment"}, {"k": "D", "t": "Implementing security groups restricting access between environments"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 357, "stem": ["A security administrator is implementing encryption on all hard drives in an organization. Which of the following security concepts is the administrator applying?"], "opts": [{"k": "A", "t": "Integrity"}, {"k": "B", "t": "Authentication"}, {"k": "C", "t": "Zero Trust"}, {"k": "D", "t": "Confidentiality"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 358, "stem": ["Which of the following should be used to ensure that a device is inaccessible to a network-connected resource?"], "opts": [{"k": "A", "t": "Disablement of unused services"}, {"k": "B", "t": "Web application firewall"}, {"k": "C", "t": "Host isolation"}, {"k": "D", "t": "Network-based IDS"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 359, "stem": ["After a security awareness training session, a user called the IT help desk and reported a suspicious call. The suspicious caller stated that the Chief Financial Officer wanted credit card information in order to close an invoice. Which of the following topics did the user recognize from the training?"], "opts": [{"k": "A", "t": "Insider threat"}, {"k": "B", "t": "Email phishing"}, {"k": "C", "t": "Social engineering"}, {"k": "D", "t": "Executive whaling"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 360, "stem": ["impact analysis Which of the following should a company use to provide proof of external network security testing?"], "opts": [{"k": "A", "t": "Business"}, {"k": "B", "t": "Supply chain analysis"}, {"k": "C", "t": "Vulnerability assessment"}, {"k": "D", "t": "Third-party attestation"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 361, "stem": ["An MSSP manages firewalls for hundreds of clients. Which of the following tools would be most helpful to create a standard configuration template in order to improve the efficiency of firewall changes?"], "opts": [{"k": "A", "t": "SNMP"}, {"k": "B", "t": "Benchmarks"}, {"k": "C", "t": "Net flow"}, {"k": "D", "t": "SCAP"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 362, "stem": ["The security team notices that the Always on VPN solution sometimes fails to connect. This leaves remote users unprotected because they cannot connect to the on-premises web proxy. Which of the following changes will best provide web protection in this scenario?"], "opts": [{"k": "A", "t": "Implement network access control."}, {"k": "B", "t": "Configure the local gateway to point to the VPN."}, {"k": "C", "t": "Create a public NAT to the on-premises proxy."}, {"k": "D", "t": "Install a host-based content filtering solution."}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 363, "stem": ["Which of the following should be used to select a label for a file based on the file's value, sensitivity, or applicable regulations?"], "opts": [{"k": "A", "t": "Verification"}, {"k": "B", "t": "Certification"}, {"k": "C", "t": "Classification"}, {"k": "D", "t": "Inventory"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 364, "stem": ["A security administrator receives multiple reports about the same suspicious email. Which of the following is the most likely reason for the malicious email's continued delivery?"], "opts": [{"k": "A", "t": "Employees are flagging legitimate emails as spam."}, {"k": "B", "t": "Information from reported emails is not being used to tune email filtering tools."}, {"k": "C", "t": "Employees are using shadow IT solutions for email."}, {"k": "D", "t": "Employees are forwarding personal emails to company email addresses."}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 365, "stem": ["Which of the following is a qualitative approach to risk analysis?"], "opts": [{"k": "A", "t": "Including the MTTR and MTBF as part of the risk assessment"}, {"k": "B", "t": "Tracking and documenting network risks using a risk register"}, {"k": "C", "t": "Assigning a level of high, medium, or low to the risk rating"}, {"k": "D", "t": "Using ALE and ARO to help determine whether a risk should be mitigated"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 366, "stem": ["Which of the following is a technical security control?"], "opts": [{"k": "A", "t": "Security guard"}, {"k": "B", "t": "Policy"}, {"k": "C", "t": "Fence"}, {"k": "D", "t": "Firewall"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 367, "stem": ["The Chief Information Officer (CIO) asked a vendor to provide documentation detailing the specific objectives within the compliance framework that the vendor's services meet. The vendor provided a report and a signed letter stating that the services meet 17 of the 21 objectives. Which of the following did the vendor provide to the CIO?"], "opts": [{"k": "A", "t": "Penetration test results"}, {"k": "B", "t": "Self-assessment findings"}, {"k": "C", "t": "Attestation of compliance"}, {"k": "D", "t": "Third-party audit report"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 368, "stem": ["Which of the following data types best describes an Al tool developed by a company to automate the ticketing system under a specific contract?"], "opts": [{"k": "A", "t": "Classified"}, {"k": "B", "t": "Regulated information"}, {"k": "C", "t": "Open source"}, {"k": "D", "t": "Intellectual property"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 369, "stem": ["Which of the following non-production sites is an operational mirror of the primary data center and is ready for use if the primary data center experiences an outage?"], "opts": [{"k": "A", "t": "Hot"}, {"k": "B", "t": "Warm"}, {"k": "C", "t": "Cold"}, {"k": "D", "t": "Frozen"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 370, "stem": ["Which of the following metrics is used to quantify the severity of a vulnerability according to the CVSS? (Select two)."], "opts": [{"k": "A", "t": "Probability of impact"}, {"k": "B", "t": "Confidence level"}, {"k": "C", "t": "Exploitability"}, {"k": "D", "t": "Temporal score"}, {"k": "E", "t": "Environmental score"}, {"k": "F", "t": "Remediation effort"}], "ans": ["C", "E"], "exp": "", "src": "PDF"}, {"n": 371, "stem": ["Which of the following attacks primarily targets insecure networks?"], "opts": [{"k": "A", "t": "Evil twin"}, {"k": "B", "t": "Impersonation"}, {"k": "C", "t": "Watering hole"}, {"k": "D", "t": "Pretexting"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 372, "stem": ["A security team must ensure that only TCP port 445 is accessible from a specific VLAN. Which of the following will accomplish this goal?"], "opts": [{"k": "A", "t": "NGFW"}, {"k": "B", "t": "VPN"}, {"k": "C", "t": "Layer 4 firewall"}, {"k": "D", "t": "ACL"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 373, "stem": ["A Chief Security Officer wants to change user authentication to the company wireless network. The authentication must use the LDAP database and must be centrally managed. Which of the following would help fulfil this requirement?"], "opts": [{"k": "A", "t": "SAML"}, {"k": "B", "t": "TACACS+"}, {"k": "C", "t": "OAUTH"}, {"k": "D", "t": "RADIUS"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 374, "stem": ["Which of the following activities should a systems administrator perform to quarantine a potentially infected system?"], "opts": [{"k": "A", "t": "Move the device into an air-gapped environment."}, {"k": "B", "t": "Disable remote logins through Group Policy."}, {"k": "C", "t": "Convert the device into a sandbox."}, {"k": "D", "t": "Remote wipe the device using the MDM platform."}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 375, "stem": ["A government agency requires publicly traded organizations to report cyber breaches within a designated time period. By law, these reports are made public. Which of the following could cause loss of existing and future business for an organization after reports are published?"], "opts": [{"k": "A", "t": "Fines and penalties"}, {"k": "B", "t": "Reputational damage"}, {"k": "C", "t": "Board oversight"}, {"k": "D", "t": "Conflicts of interest"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 376, "stem": ["A security analyst is investigating an alert that was produced by endpoint protection software. The analyst determines this event was a false positive triggered by an employee who attempted to download a file. Which of the following is the most likely reason the download was blocked?"], "opts": [{"k": "A", "t": "A misconfiguration in the endpoint protection software"}, {"k": "B", "t": "A zero-day vulnerability in the file"}, {"k": "C", "t": "A supply chain attack on the endpoint protection vendor"}, {"k": "D", "t": "Incorrect file permissions"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 377, "stem": ["A systems administrator creates a script that validates OS version, patch levels, and installed applications when rocess involves establishing the scope and potential risks involved with a project?"], "opts": [{"k": "A", "t": "Risk mitigation"}, {"k": "B", "t": "Risk identification"}, {"k": "C", "t": "Risk treatment"}, {"k": "D", "t": "Risk monitoring and review"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 383, "stem": ["Which of the following solutions would most likely be used in the financial industry to mask sensitive data?"], "opts": [{"k": "A", "t": "Tokenization"}, {"k": "B", "t": "Hashing"}, {"k": "C", "t": "Salting"}, {"k": "D", "t": "Steganography"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 384, "stem": ["Which of the following best describes the data type the security professional should use to identify organizational policies and standards concerning the storage of employees' personal information?"], "opts": [{"k": "A", "t": "Legal"}, {"k": "B", "t": "Financial"}, {"k": "C", "t": "Privacy D Intellectual property"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 385, "stem": ["Which of the following is prevented by proper data sanitization?"], "opts": [{"k": "A", "t": "Hackers’ ability to obtain data from used hard drives"}, {"k": "B", "t": "Devices reaching end-of-life and losing support"}, {"k": "C", "t": "Disclosure of sensitive data through incorrect classification"}, {"k": "D", "t": "Incorrect inventory data leading to a laptop shortage"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 386, "stem": ["Which of the following best describes the concept of information being stored outside of its country of origin while still being subject to the laws and requirements of the country of origin?"], "opts": [{"k": "A", "t": "Data sovereignty"}, {"k": "B", "t": "Geolocation"}, {"k": "C", "t": "Intellectual property"}, {"k": "D", "t": "Geographic restrictions"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 387, "stem": ["Which of the following is an example of memory injection?"], "opts": [{"k": "A", "t": "Two processes access the same variable, allowing one to cause a privilege escalation."}, {"k": "B", "t": "A process receives an unexpected amount of data, which causes malicious code to be executed."}, {"k": "C", "t": "Malicious code is copied to the allocated space of an already running process."}, {"k": "D", "t": "An executable is overwritten on the disk, and malicious code runs the next time it is executed."}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 388, "stem": ["A penetration test has demonstrated that domain administrator accounts were vulnerable to pass the-hash attacks. Which of the following would have been the best strategy to prevent the threat actor from using domain administrator accounts?"], "opts": [{"k": "A", "t": "Audit each domain administrator account weekly for password compliance."}, {"k": "B", "t": "Implement a privileged access management solution."}, {"k": "C", "t": "Create IDS policies to monitor domain controller access."}, {"k": "D", "t": "Use Group Policy to enforce password expiration."}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 389, "stem": ["Which of the following is a type of vulnerability that may result from outdated algorithms or keys?"], "opts": [{"k": "A", "t": "Hash collision"}, {"k": "B", "t": "Cryptographic"}, {"k": "C", "t": "Buffer overflow"}, {"k": "D", "t": "Input validation"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 390, "stem": ["To which of the following security categories does an EDR solution belong?"], "opts": [{"k": "A", "t": "Physical"}, {"k": "B", "t": "Operational"}, {"k": "C", "t": "Managerial"}, {"k": "D", "t": "Technical"}], "ans": ["D"], "exp": "", "src": "PDF", "note": "Source layout: question text was printed beside the options in the PDF; text unchanged."}, {"n": 391, "stem": ["A company wants to prevent proprietary and confidential company information from being shared to outsiders. Which of the following would this best describe?"], "opts": [{"k": "A", "t": "MOA"}, {"k": "B", "t": "SLA"}, {"k": "C", "t": "MSA"}, {"k": "D", "t": "NDA"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 392, "stem": ["A Chief Information Security Officer is developing procedures to guide detective and corrective activities associated with common threats, including phishing, social engineering, and business email compromise. Which of the following documents would be most relevant to revise as part of this process?"], "opts": [{"k": "A", "t": "SDLC"}, {"k": "B", "t": "IRP"}, {"k": "C", "t": "BCP"}, {"k": "D", "t": "AUP"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 393, "stem": ["Which of the following is the best reason to complete an audit in a banking environment?"], "opts": [{"k": "A", "t": "Regulatory requirement"}, {"k": "B", "t": "Organizational change"}, {"k": "C", "t": "Self-assessment requirement D Service-level requirement"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 394, "stem": ["A security administrator needs to reduce the attack surface in the company's data centers. Which of the following should the security administrator do to complete this task?"], "opts": [{"k": "A", "t": "Implement a honeynet."}, {"k": "B", "t": "Define Group Policy on the servers."}, {"k": "C", "t": "Configure the servers for high availability."}, {"k": "D", "t": "Upgrade end-of-support operating systems."}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 395, "stem": ["A company is considering an expansion of access controls for an application that contractors and internal employees use to reduce costs. Which of the following risk elements should the implementation team understand before granting access to the application?"], "opts": [{"k": "A", "t": "Threshold"}, {"k": "B", "t": "Appetite"}, {"k": "C", "t": "Avoidance"}, {"k": "D", "t": "Register"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 396, "stem": ["Which of the following is a prerequisite for a DLP solution?"], "opts": [{"k": "A", "t": "Data destruction"}, {"k": "B", "t": "Data sanitization"}, {"k": "C", "t": "Data classification"}, {"k": "D", "t": "Data masking"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 397, "stem": ["Which of the following activities should be performed first to compile a list of vulnerabilities in an environment?"], "opts": [{"k": "A", "t": "Automated scanning"}, {"k": "B", "t": "Penetration testing"}, {"k": "C", "t": "Threat hunting"}, {"k": "D", "t": "Log aggregation"}, {"k": "E", "t": "Adversarial emulation"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 398, "stem": ["A business provides long-term cold storage services to banks that are required to follow regulator imposed data retention guidelines. Banks that use these services require that data is disposed of in a specific manner at the conclusion of the regulatory threshold for data retention. Which of the following aspects of data management is the most important to the bank in the destruction of this data?"], "opts": [{"k": "A", "t": "Encryption"}, {"k": "B", "t": "Classification"}, {"k": "C", "t": "Certification"}, {"k": "D", "t": "Procurement"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 399, "stem": ["A penetration test identifies that an SMBv1 is enabled on multiple servers across an organization. The organization wants to remediate this vulnerability in the most efficient way possible. Which of the following should the organization use for this purpose?"], "opts": [{"k": "A", "t": "GPO"}, {"k": "B", "t": "ACL"}, {"k": "C", "t": "SFTP"}, {"k": "D", "t": "DLP"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 400, "stem": ["Which of the following is the fastest and most cost-effective way to confirm a third-party supplier's compliance with security obligations?"], "opts": [{"k": "A", "t": "Attestation report"}, {"k": "B", "t": "Third-party audit"}, {"k": "C", "t": "Vulnerability assessment"}, {"k": "D", "t": "Penetration testing"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 401, "stem": ["A Copilot (Ctrl+S A security administrator is addressing an issue with a legacy system that communicates data using an unencrypted protocol to transfer sensitive data to a third party. No software updates that use an encrypted protocol are available, so a compensating control is needed. Which of the following are the most appropriate for the administrator to suggest? (Select two)."], "opts": [{"k": "A", "t": "Tokenization"}, {"k": "B", "t": "Cryptographic downgrade"}, {"k": "C", "t": "SSH tunnelling"}, {"k": "D", "t": "Segmentation"}, {"k": "E", "t": "Patch installation"}, {"k": "F", "t": "Data masking"}], "ans": ["C", "D"], "exp": "", "src": "PDF"}, {"n": 402, "stem": ["Which of the following is the best way to validate the integrity and availability of a disaster recovery site?"], "opts": [{"k": "A", "t": "Lead a simulated failover."}, {"k": "B", "t": "Conduct a tabletop exercise."}, {"k": "C", "t": "Periodically test the generators."}, {"k": "D", "t": "Develop requirements for database encryption."}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 403, "stem": ["Which of the following would most likely be a hacktivist's motive?"], "opts": [{"k": "A", "t": "Financial gain"}, {"k": "B", "t": "Espionage"}, {"k": "C", "t": "Philosophical beliefs"}, {"k": "D", "t": "Revenge"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 404, "stem": ["During a recent log review, an analyst discovers evidence of successful injection attacks. Which of the following will best address this issue?"], "opts": [{"k": "A", "t": "Authentication"}, {"k": "B", "t": "Secure cookies"}, {"k": "C", "t": "Static code analysis"}, {"k": "D", "t": "Input validation"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 405, "stem": ["Which of the following is the first step to secure a newly deployed server?"], "opts": [{"k": "A", "t": "Close unnecessary service ports."}, {"k": "B", "t": "Update the current version of the software."}, {"k": "C", "t": "Add the device to the ACL."}, {"k": "D", "t": "Upgrade the OS version."}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 406, "stem": ["Which of the following consequences would a retail chain most likely face from customers in the event the retailer is non-compliant with PCI DSS?"], "opts": [{"k": "A", "t": "Contractual impacts"}, {"k": "B", "t": "Sanctions"}, {"k": "C", "t": "Fines"}, {"k": "D", "t": "Reputational damage"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 407, "stem": ["Which of the following security concepts is accomplished when granting access after an individual has logged in to a computer network?"], "opts": [{"k": "A", "t": "Authorization"}, {"k": "B", "t": "Identification"}, {"k": "C", "t": "Non-repudiation"}, {"k": "D", "t": "Authentication"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 408, "stem": ["An accounting clerk sent money to an attacker's bank account after receiving fraudulent instructions over the phone to use a new account. Which of the following would most likely prevent this activity in the future?"], "opts": [{"k": "A", "t": "Standardizing security incident reporting"}, {"k": "B", "t": "Executing regular phishing campaigns"}, {"k": "C", "t": "Implementing insider threat detection measures"}, {"k": "D", "t": "Updating processes for sending wire transfers"}], "ans": ["D"], "exp": "", "src": "PDF"}, {"n": 409, "stem": ["The number of tickets the help desk has been receiving has increased recently due to numerous false-positive phishing reports. Which of the following would be best to help to reduce the false positives?"], "opts": [{"k": "A", "t": "Performing more phishing simulation campaigns"}, {"k": "B", "t": "Improving security awareness training"}, {"k": "C", "t": "Hiring more help desk staff"}, {"k": "D", "t": "Implementing an incident reporting web page"}], "ans": ["B"], "exp": "", "src": "PDF"}, {"n": 410, "stem": ["During a SQL update of a database, a temporary field used as part of the update sequence was modified by an attacker before the update completed in order to allow access to the system. Which of the following best describes this type of vulnerability?"], "opts": [{"k": "A", "t": "Race condition"}, {"k": "B", "t": "Memory injection"}, {"k": "C", "t": "Malicious update"}, {"k": "D", "t": "Side loading"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 411, "stem": ["Which of the following is the best reason to perform a tabletop exercise?"], "opts": [{"k": "A", "t": "To address audit findings"}, {"k": "B", "t": "To collect remediation response times"}, {"k": "C", "t": "To update the IRP"}, {"k": "D", "t": "To calculate the ROI"}], "ans": ["C"], "exp": "", "src": "PDF"}, {"n": 412, "stem": ["Which of the following elements of digital forensics should a company use if it needs to ensure the integrity of evidence?"], "opts": [{"k": "A", "t": "Preservation"}, {"k": "B", "t": "E-discovery"}, {"k": "C", "t": "Acquisition"}, {"k": "D", "t": "Containment"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 413, "stem": ["An administrator needs to perform server hardening before deployment. Which of the following steps should the administrator take? (Select two)."], "opts": [{"k": "A", "t": "Disable default accounts."}, {"k": "B", "t": "Add the server to the asset inventory."}, {"k": "C", "t": "Remove unnecessary services."}, {"k": "D", "t": "Document default passwords."}, {"k": "E", "t": "Send server logs to the SIEM."}, {"k": "F", "t": "Join the server to the corporate domain."}], "ans": ["A", "C"], "exp": "", "src": "PDF"}, {"n": 414, "stem": ["An administrator must replace an expired SSL certificate. Which of the following does the administrator need to create the new SSL certificate?"], "opts": [{"k": "A", "t": "CSR"}, {"k": "B", "t": "OCSP"}, {"k": "C", "t": "Key"}, {"k": "D", "t": "CRL"}], "ans": ["A"], "exp": "", "src": "PDF"}, {"n": 1, "stem": ["Which of the following actions must an organization take to comply with a person's request for the right to be forgotten?"], "opts": [{"k": "A", "t": "Purge all personally identifiable attributes."}, {"k": "B", "t": "Encrypt all of the person's data."}, {"k": "C", "t": "Remove all of the person's data."}, {"k": "D", "t": "Obfuscate all of the person's data."}], "ans": ["C"], "exp": "", "src": "DOCX"}, {"n": 2, "stem": ["Several employees download a productivity program that is useful but also leaks contact information and corporate organizational structure details. Which of the following is the best way to prevent this issue?"], "opts": [{"k": "A", "t": "Application allow list"}, {"k": "B", "t": "Workstation hardening"}, {"k": "C", "t": "Refusal of unsigned code"}, {"k": "D", "t": "IP blocklist"}, {"k": "E", "t": "Standard user accounts"}], "ans": ["A"], "exp": "", "src": "DOCX"}, {"n": 3, "stem": ["During a penetration test in a hypervisor, the security engineer is able to use a script to inject a malicious payload and access the host filesystem. Which of the following best describes this vulnerability?"], "opts": [{"k": "A", "t": "VM escape"}, {"k": "B", "t": "Cross-site scripting"}, {"k": "C", "t": "Malicious update"}, {"k": "D", "t": "SQL injection"}], "ans": ["A"], "exp": "", "src": "DOCX"}, {"n": 5, "stem": ["A Chief Security Officer signs off on a request to allow inbound SMB and RDP from the internet to a single VLAN. Which of the following is the most likely explanation for this activity?"], "opts": [{"k": "A", "t": "The company built a new file-sharing site."}, {"k": "B", "t": "The organization is preparing for a penetration test."}, {"k": "C", "t": "The security team is integrating with an SASE platform."}, {"k": "D", "t": "The security team created a honeynet."}], "ans": ["D"], "exp": "", "src": "DOCX"}, {"n": 7, "stem": ["A new security regulation was announced that will take effect in the coming year. A company must comply with it to remain in business. Which of the following activities should the company perform next?"], "opts": [{"k": "A", "t": "Gap analysis"}, {"k": "B", "t": "Policy review"}, {"k": "C", "t": "Security procedure evaluation"}, {"k": "D", "t": "Threat scope reduction"}], "ans": ["A"], "exp": "", "src": "DOCX"}, {"n": 8, "stem": ["Which of the following data protection strategies can be used to confirm file integrity?"], "opts": [{"k": "A", "t": "Masking"}, {"k": "B", "t": "Encryption"}, {"k": "C", "t": "Hashing"}, {"k": "D", "t": "Obfuscation"}], "ans": ["C"], "exp": "", "src": "DOCX"}, {"n": 9, "stem": ["Which of the following can automate vulnerability management?"], "opts": [{"k": "A", "t": "CVE"}, {"k": "B", "t": "SCAP"}, {"k": "C", "t": "OSINT"}, {"k": "D", "t": "CVSS"}], "ans": ["B"], "exp": "", "src": "DOCX"}, {"n": 10, "stem": ["Which of the following is used to calculate the impact to an organization per cybersecurity incident?"], "opts": [{"k": "A", "t": "SLE"}, {"k": "B", "t": "ALE"}, {"k": "C", "t": "ARO"}, {"k": "D", "t": "SLA"}], "ans": ["A"], "exp": "", "src": "DOCX"}, {"n": 11, "stem": ["A security engineer develops a policy to block all insecure protocols on the network. Which of the following ports should the security engineer block as part of that process? (Select two)."], "opts": [{"k": "A", "t": "22"}, {"k": "B", "t": "23"}, {"k": "C", "t": "25"}, {"k": "D", "t": "443"}, {"k": "E", "t": "993"}, {"k": "F", "t": "995"}], "ans": ["B", "C"], "exp": "", "src": "DOCX"}, {"n": 13, "stem": ["A security analyst is reviewing alerts in the SIEM related to potential malicious network traffic coming from an employee's corporate laptop. The security analyst has determined that additional data about the executable running on the machine is necessary to confirm the investigation. Which of the following logs should the analyst use as a data source?"], "opts": [{"k": "A", "t": "Application"}, {"k": "B", "t": "IPS/IDS"}, {"k": "C", "t": "Network"}, {"k": "D", "t": "Endpoint"}], "ans": ["D"], "exp": "", "src": "DOCX"}, {"n": 14, "stem": ["A security administrator observed the following in a web server log while investigating an incident:", "\"GET ../../../../../etc/passwd\"", "Which of the following attacks did the security administrator most likely see?"], "opts": [{"k": "A", "t": "Privilege escalation"}, {"k": "B", "t": "Credential replay"}, {"k": "C", "t": "Brute force"}, {"k": "D", "t": "Directory traversal"}], "ans": ["D"], "exp": "", "src": "DOCX"}, {"n": 15, "stem": ["A university uses two different cloud solutions for storing student data. Which of the following does this scenario represent?"], "opts": [{"k": "A", "t": "Load balancing"}, {"k": "B", "t": "Parallel processing"}, {"k": "C", "t": "Platform diversity"}, {"k": "D", "t": "Clustering"}], "ans": ["C"], "exp": "", "src": "DOCX"}, {"n": 16, "stem": ["Which of the following concerns needs to be addressed when sensitive information is encoded with Base64 to exchange over the public internet?"], "opts": [{"k": "A", "t": "Malicious updates"}, {"k": "B", "t": "SQL injection"}, {"k": "C", "t": "Unicode manipulation"}, {"k": "D", "t": "Data confidentiality"}], "ans": ["D"], "exp": "", "src": "DOCX"}, {"n": 17, "stem": ["When trying to access an internal website, an employee reports that a prompt displays, stating that the site is insecure. Which of the following certificate types is the site most likely using?"], "opts": [{"k": "A", "t": "Wildcard"}, {"k": "B", "t": "Root of trust"}, {"k": "C", "t": "Third-party"}, {"k": "D", "t": "Self-signed"}], "ans": ["D"], "exp": "", "src": "DOCX"}, {"n": 18, "stem": ["An organization failed to account for the right-to-be-forgotten regulations. Which of the following impacts might this action have on the company?"], "opts": [{"k": "A", "t": "Fines"}, {"k": "B", "t": "Data breaches"}, {"k": "C", "t": "Revenue loss"}, {"k": "D", "t": "Blackmail"}], "ans": ["A"], "exp": "", "src": "DOCX"}, {"n": 19, "stem": ["Which of the following is a compensating control for providing user access to a high-risk website?"], "opts": [{"k": "A", "t": "Enabling threat prevention features on the firewall"}, {"k": "B", "t": "Configuring a SIEM tool to capture all web traffic"}, {"k": "C", "t": "Setting firewall rules to allow traffic from any port to that destination"}, {"k": "D", "t": "Blocking that website on the endpoint protection software"}], "ans": ["A"], "exp": "", "src": "DOCX"}, {"n": 20, "stem": ["Which of the following best describes the benefits of a microservices architecture when compared to a monolithic architecture? (Select two)."], "opts": [{"k": "A", "t": "Easier debugging of the system"}, {"k": "B", "t": "Reduced cost of ownership of the system"}, {"k": "C", "t": "Improved scalability of the system"}, {"k": "D", "t": "Increased compartmentalization of the system"}, {"k": "E", "t": "Stronger authentication of the system"}, {"k": "F", "t": "Reduced complexity of the system"}], "ans": ["C", "D"], "exp": "", "src": "DOCX"}, {"n": 21, "stem": ["An unexpected and out-of-character email message from a Chief Executive Officer's corporate account asked an employee to provide financial information and to change the recipient's contact number. Which of the following attack vectors is most likely being used?"], "opts": [{"k": "A", "t": "Business email compromise"}, {"k": "B", "t": "Phishing"}, {"k": "C", "t": "Brand impersonation"}, {"k": "D", "t": "Pretexting"}], "ans": ["A"], "exp": "", "src": "DOCX"}, {"n": 22, "stem": ["An organization must implement security measures to prevent unauthorized vehicle access to a data center. Which of the following will best meet this requirement and provide adequate security? (Select two)."], "opts": [{"k": "A", "t": "Bollards"}, {"k": "B", "t": "Infrared sensors"}, {"k": "C", "t": "Fencing"}, {"k": "D", "t": "Lighting"}, {"k": "E", "t": "Access badges"}, {"k": "F", "t": "Cameras"}], "ans": ["A", "C"], "exp": "", "src": "DOCX"}, {"n": 23, "stem": ["Which of the following security principles most likely requires validation before allowing traffic between systems?"], "opts": [{"k": "A", "t": "Policy enforcement"}, {"k": "B", "t": "Authentication"}, {"k": "C", "t": "Zero Trust architecture"}, {"k": "D", "t": "Confidentiality"}], "ans": ["C"], "exp": "", "src": "DOCX"}, {"n": 24, "stem": ["Which of the following agreements defines response time, escalation points, and performance metrics?"], "opts": [{"k": "A", "t": "BPA"}, {"k": "B", "t": "MOA"}, {"k": "C", "t": "NDA"}, {"k": "D", "t": "SLA"}], "ans": ["D"], "exp": "", "src": "DOCX"}, {"n": 25, "stem": ["A recent penetration test identified that an attacker could flood the MAC address table of network switches. Which of the following would best mitigate this type of attack?"], "opts": [{"k": "A", "t": "Load balancer"}, {"k": "B", "t": "Port security"}, {"k": "C", "t": "IPS"}, {"k": "D", "t": "NGFW"}], "ans": ["B"], "exp": "", "src": "DOCX"}, {"n": 26, "stem": ["Which of the following best describes a common use of OSINT?"], "opts": [{"k": "A", "t": "Monitoring internal systems and network traffic to detect abnormal behavior"}, {"k": "B", "t": "Installing and configuring security patches to fix known vulnerabilities"}, {"k": "C", "t": "Collecting information from public platforms to find possible security exposures"}, {"k": "D", "t": "Encrypting sensitive company data and storing it securely in the cloud"}], "ans": ["C"], "exp": "", "src": "DOCX"}, {"n": 27, "stem": ["Which of the following best describes a threat actor who can coordinate a cyberattack to disable sensors and execute kinetic effects?"], "opts": [{"k": "A", "t": "Insider threat"}, {"k": "B", "t": "Hacktivist"}, {"k": "C", "t": "Organized criminal"}, {"k": "D", "t": "Nation-state"}], "ans": ["D"], "exp": "", "src": "DOCX"}, {"n": 28, "stem": ["Which of the following should an organization use to ensure that it can review the controls and performance of a service provider or vendor?"], "opts": [{"k": "A", "t": "Service-level agreement"}, {"k": "B", "t": "Memorandum of agreement+"}, {"k": "C", "t": "Right-to-audit clause"}, {"k": "D", "t": "Supply chain analysis"}], "ans": ["C"], "exp": "", "src": "DOCX"}, {"n": 30, "stem": ["Which of the following has been implemented when a host-based firewall on a legacy Linux system allows connections from only specific internal IP addresses?"], "opts": [{"k": "A", "t": "Compensating control"}, {"k": "B", "t": "Network segmentation"}, {"k": "C", "t": "Transfer of risk"}, {"k": "D", "t": "SNMP traps"}], "ans": ["A"], "exp": "", "src": "DOCX"}, {"n": 31, "stem": ["A security engineer needs to quickly identify a signature from a known malicious file. Which of the following analysis methods would the security engineer most likely use?"], "opts": [{"k": "A", "t": "Static"}, {"k": "B", "t": "Sandbox"}, {"k": "C", "t": "Network traffic"}, {"k": "D", "t": "Package monitoring"}], "ans": ["A"], "exp": "", "src": "DOCX"}, {"n": 32, "stem": ["Which of the following scenarios will proper application of the least privilege principle prevent?"], "opts": [{"k": "A", "t": "A network administrator shuts down a critical network interface."}, {"k": "B", "t": "An analyst saves an unauthorized configuration."}, {"k": "C", "t": "A threat actor discovers credentials for a shared service account."}, {"k": "D", "t": "A change is executed outside of the approved change window."}], "ans": ["B"], "exp": "", "src": "DOCX"}, {"n": 33, "stem": ["Which of the following is an example of passive reconnaissance against a company?"], "opts": [{"k": "A", "t": "Calling a company's employees to gather sensitive information"}, {"k": "B", "t": "Mapping the company's IP space with a ping sweep of the company's network"}, {"k": "C", "t": "Using automated tools to search public information on the internet"}, {"k": "D", "t": "Poisoning the company's DNS servers cache with malicious queries"}], "ans": ["C"], "exp": "", "src": "DOCX"}, {"n": 35, "stem": ["Which of the following security controls is most likely being used when a critical legacy server is segmented into a private network?"], "opts": [{"k": "A", "t": "Deterrent"}, {"k": "B", "t": "Corrective"}, {"k": "C", "t": "Compensating"}, {"k": "D", "t": "Preventive"}], "ans": ["C"], "exp": "", "src": "DOCX"}, {"n": 36, "stem": ["Which of the following should be used to aggregate log data in order to create alerts and detect anomalous activity?"], "opts": [{"k": "A", "t": "SIEM"}, {"k": "B", "t": "WAF"}, {"k": "C", "t": "Network taps"}, {"k": "D", "t": "IDS"}], "ans": ["A"], "exp": "", "src": "DOCX"}, {"n": 37, "stem": ["A university employee has logged on to an academic server and attempted to guess the system administrator's login credentials. Which of the following security measures should the university have implemented to detect the employee's attempts to gain access to the administrator's account?"], "opts": [{"k": "A", "t": "Two-factor authentication"}, {"k": "B", "t": "Firewall"}, {"k": "C", "t": "Intrusion prevention system"}, {"k": "D", "t": "User activity logs"}], "ans": ["D"], "exp": "", "src": "DOCX"}, {"n": 39, "stem": ["A few weeks after deploying additional email servers, a company begins to receive complaints from employees that messages they send are going into their recipients' spam folders. Which of the following needs to be updated in order to resolve this issue?"], "opts": [{"k": "A", "t": "CNAME"}, {"k": "B", "t": "SMTP"}, {"k": "C", "t": "DLP"}, {"k": "D", "t": "SPF"}], "ans": ["D"], "exp": "", "src": "DOCX"}];
